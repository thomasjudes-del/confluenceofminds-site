<style>
:root{color-scheme:dark;--panel:rgba(3,9,18,.68);--line:rgba(184,214,255,.14);--ink:#edf6ff;--muted:rgba(219,230,246,.58)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020610;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}#engine{position:fixed;inset:0;width:100%;height:100%;border:0;background:#020610}.glass{border:1px solid var(--line);background:linear-gradient(180deg,rgba(7,16,29,.76),rgba(3,9,18,.60));backdrop-filter:blur(15px) saturate(125%);box-shadow:0 14px 45px rgba(0,0,0,.28)}
