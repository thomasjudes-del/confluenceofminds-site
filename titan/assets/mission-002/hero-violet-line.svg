    <rect x="286" y="52" width="84" height="138" rx="8" fill="#0f1420" stroke="#74cfff" stroke-opacity=".55"/>
    <path d="M329 52V-72M315-72h28M329-72l-42-72M329-72l43-72" stroke="#8ad9ff" stroke-width="7"/>
