<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Violet Line</title>
  <desc id="desc">Hestia power station on Titan beneath Saturn, crossed by a violet electrical front.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#080813"/><stop offset=".5" stop-color="#17142c"/><stop offset="1" stop-color="#321c39"/></linearGradient>
    <radialGradient id="sat" cx="35%" cy="28%" r="70%"><stop stop-color="#f1c88c"/><stop offset=".48" stop-color="#b8865f"/><stop offset="1" stop-color="#4b2f35"/></radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#30213c"/><stop offset="1" stop-color="#090a11"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ccfff" stop-opacity="0"/><stop offset=".42" stop-color="#9b89ff"/><stop offset=".62" stop-color="#d8d1ff"/><stop offset="1" stop-color="#7c67dc" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
