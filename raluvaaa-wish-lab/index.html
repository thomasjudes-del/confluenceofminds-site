function nearestWish(sx,sy){let best=null,bd=32;for(const w of wishes){let p=worldToScreen(w.x,w.y),d=Math.hypot(p.x-sx,p.y-sy);if(d<bd){bd=d;best=w}}return best}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;}else if(pointers.size===2){let arr=[...pointers.values()],dist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);if(lastPinch){let factor=dist/lastPinch.dist;cam.z=Math.max(.22,Math.min(2.3,lastPinch.z*factor));}else lastPinch={dist,z:cam.z}}});
canvas.addEventListener('pointerup',e=>{let was=drag&&!drag.moved&&pointers.size===1;let sx=e.clientX,sy=e.clientY;pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=null;if(was){let w=nearestWish(sx,sy);if(w){if(connectFrom&&connectFrom!==w.id){state.customEdges=state.customEdges||[];state.customEdges.push({a:connectFrom,b:w.id,kind:'human'});state.events.push({type:'connect',a:connectFrom,b:w.id,t:Date.now()});save();rebuildEdges();toast('A human connection now exists between these wishes.');connectFrom=null;document.getElementById('crosshairHint').classList.add('hidden')}openWish(w.id)}}drag=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();let before=screenToWorld(e.clientX,e.clientY);let factor=Math.exp(-e.deltaY*.001);cam.z=Math.max(.22,Math.min(2.3,cam.z*factor));let after=screenToWorld(e.clientX,e.clientY);cam.x+=before.x-after.x;cam.y+=before.y-after.y},{passive:false});
document.getElementById('zoomIn').onclick=()=>cam.z=Math.min(2.3,cam.z*1.25);document.getElementById('zoomOut').onclick=()=>cam.z=Math.max(.22,cam.z/1.25);document.getElementById('home').onclick=()=>{cam={x:1600,y:1050,z:Math.max(.35,Math.min(.72,innerWidth/1900))}};
function pulseStats(){let c=state.customWishes.length;let stats=[['Wishes',100+c],['Human connections',18+(state.customEdges||[]).length],['Splits',23+(state.events||[]).filter(e=>e.type==='split').length],['Blooms',7+(state.events||[]).filter(e=>e.type==='bloom').length],['Encouragements',412+(state.encouraged||[]).length]];document.getElementById('stats').innerHTML=stats.map(x=>`<span class=k>${x[0]}</span><span class=v>${x[1]}</span>`).join('')}
pulseStats();const news=["A wish bloomed in Kyoto.","Someone connected two intentions that had never met.","Three people encouraged the same wish from three countries.","A wish that had been quiet for 214 days moved again.","Someone in Porto split a dream into its first concrete step.","A new intention was entrusted to the world in Lagos."];let ni=0;function rotateNews(){document.getElementById('pulseNews').textContent=news[ni++%news.length]}rotateNews();setInterval(rotateNews,6500);
function ensureEntrusted(){let e=state.entrusted;if(!e||!Array.isArray(e)||e.length!==3)e=null;let now=Date.now();if(!e)e=[makeSlot('hours',now),makeSlot('days',now),makeSlot('weeks',now)];e=e.map(s=>s.expires<=now?makeSlot(s.band,now):s);state.entrusted=e;save();renderEntrusted()}
function makeSlot(band,now){let pool=wishes.filter(w=>w.state!=='closed'),w=pool[Math.floor(Math.random()*pool.length)];let ms=band==='hours'?(2+Math.random()*18)*3600000:band==='days'?(1+Math.random()*5)*86400000:(6+Math.random()*10)*86400000;return{wishId:w.id,band,expires:now+ms}}
function fmtRemain(ms){if(ms<3600000)return Math.max(1,Math.ceil(ms/60000))+' min';if(ms<86400000)return Math.ceil(ms/3600000)+' h';return Math.ceil(ms/86400000)+' d'}
function renderEntrusted(){let now=Date.now();document.getElementById('entrustedGrid').innerHTML=state.entrusted.map(s=>{let w=wishById(s.wishId),rem=s.expires-now;return `<button class="entrusted-item ${rem<6*3600000?'urgent':''}" data-id="${w.id}"><div class=t>${esc(w.text)}</div><div class=m><span>${s.band}</span><span>${fmtRemain(rem)} left</span></div></button>`}).join('');document.querySelectorAll('.entrusted-item').forEach(b=>b.onclick=()=>focusWish(b.dataset.id))}
ensureEntrusted();setInterval(()=>{ensureEntrusted()},60000);
function focusWish(id){let w=wishById(id);if(!w)return;cam.x=w.x;cam.y=w.y;cam.z=Math.max(cam.z,.95);openWish(id)}
function openWish(id){selectedId=id;let w=wishById(id);let own=(state.myWishIds||[]).includes(id);let enc=(state.encouraged||[]).includes(id);let stateLabel=w.state==='bloom'?'Bloomed':w.state==='closed'?'Trace · let go':own?'Your wish':'Living wish';let d=document.getElementById('detail');d.classList.remove('hidden');d.innerHTML=`<div class=detail-top><div><div class=eyebrow>${own?'YOUR WISH':w.id.startsWith('w')?'SIMULATED TEST WISH':'A HUMAN INTENTION'}</div><div class=wishtext>${esc(w.text)}</div><div class=meta>${esc(w.loc)} · ${formatDate(w.date)}</div><div class=state><span class=state-dot></span>${stateLabel}</div></div><button class=close id=closeDetail>×</button></div><div class=actions>
<button class=action data-act=encourage><span class=ico>${enc?'✦':'✧'}</span>${enc?'Encouraged':'Encourage'}</button><button class=action data-act=help><span class=ico>↟</span>Help</button><button class=action data-act=connect><span class=ico>⌁</span>Connect</button><button class=action data-act=pivot><span class=ico>↝</span>Pivot</button><button class=action data-act=split><span class=ico>⑂</span>Split</button><button class=action data-act=share><span class=ico>↗</span>Share</button></div>${own?`<div class=owner-actions><h4>Only you decide what happens to this wish</h4><div class=shareline><button class=secondary data-act=bloom>Bloom</button><button class=secondary data-act=letgo>Let go</button></div></div>`:''}<div class=shareline><button class=secondary data-act=report>Report</button></div>`;document.getElementById('closeDetail').onclick=()=>{d.classList.add('hidden');selectedId=null};d.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,w,own));}
function requireIdentity(next){if(state.identity)return next();showIdentity(next)}
function act(a,w,own){if(a==='encourage'){if(!state.encouraged.includes(w.id)){state.encouraged.push(w.id);w.enc=(w.enc||0)+1;save();toast('Your encouragement made this wish a little brighter.')}else toast('You already encouraged this wish.');openWish(w.id);pulseStats();return}
 if(a==='share'){shareWish(w);return}if(a==='report'){showReport(w);return}if(a==='connect'){requireIdentity(()=>{connectFrom=w.id;document.getElementById('detail').classList.add('hidden');document.getElementById('crosshairHint').classList.remove('hidden');toast('Choose another wish anywhere in the world.');});return}
 if(a==='help'){requireIdentity(()=>showProposal('HELP',w));return}if(a==='pivot'){if(own)requireIdentity(()=>showOwnerPivot(w));else requireIdentity(()=>showProposal('PIVOT',w));return}if(a==='split'){if(own)requireIdentity(()=>showOwnerSplit(w));else requireIdentity(()=>showProposal('SPLIT',w));return}if(a==='bloom'){requireIdentity(()=>{w.state='bloom';syncCustom(w);state.events.push({type:'bloom',wishId:w.id,t:Date.now()});save();openWish(w.id);pulseStats();toast('This wish has bloomed. Its trace remains.');});return}if(a==='letgo'){requireIdentity(()=>{w.state='closed';syncCustom(w);state.events.push({type:'letgo',wishId:w.id,t:Date.now()});save();openWish(w.id);toast('You let this wish go. The trace remains.');});return}}
function syncCustom(w){let i=state.customWishes.findIndex(x=>x.id===w.id);if(i>=0)state.customWishes[i]=w}
function shareWish(w){let url=location.href.split('#')[0]+'#wish='+encodeURIComponent(w.id);let data={title:'A wish in RALUVAAA',text:w.text,url};if(navigator.share)navigator.share(data).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>toast('Wish link copied.'))}
function modal(html){document.getElementById('overlayRoot').innerHTML=`<div class=scrim id=scrim></div><div class=sheet>${html}</div>`;document.getElementById('scrim').onclick=closeModal}
function closeModal(){document.getElementById('overlayRoot').innerHTML=''}
function showIdentity(next){modal(`<div class=eyebrow>LIGHT IDENTITY</div><h2>Keep your place in the world.</h2><p>To send text, manage wishes or open conversations, RALUVAAA needs a way to recognise you. Your email is never public.</p><label>Email</label><input class=field id=idEmail type=email autocomplete=email placeholder="you@example.com"><div class=note>Test mode: this prototype stores the identity only on this device. A production version would use a persistent session after a one-time verification link.</div><div class=row><button class=secondary id=cancelId>Not now</button><button class=primary id=confirmId>Continue</button></div>`);document.getElementById('cancelId').onclick=closeModal;document.getElementById('confirmId').onclick=()=>{let v=document.getElementById('idEmail').value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){toast('Enter a valid email.');return}state.identity={email:v,created:Date.now()};save();closeModal();toast('Identity kept on this device for the test.');next&&next()}}
function showProposal(type,w){modal(`<div class=eyebrow>${type} · SUGGESTION</div><h2>${type==='HELP'?'Offer something concrete.':type==='PIVOT'?'Suggest another direction.':'Suggest smaller steps.'}</h2><p>You cannot change someone else’s wish. You can only offer a possibility.</p><label>Your note</label><textarea class=field id=proposal maxlength=240 placeholder="${type==='HELP'?'I may be able to help by…':type==='PIVOT'?'What if the path became…':'A first smaller step could be…'}"></textarea><div class=row><button class=secondary id=cancelP>Cancel</button><button class=primary id=sendP>Send suggestion</button></div><div class=tiny>In this UX prototype the suggestion is stored locally. Shared delivery will come with the backend.</div>`);document.getElementById('cancelP').onclick=closeModal;document.getElementById('sendP').onclick=()=>{let text=document.getElementById('proposal').value.trim();if(text.length<4){toast('Write a short, concrete suggestion.');return}state.proposals.push({type,wishId:w.id,text,t:Date.now(),from:state.identity.email});state.events.push({type:type.toLowerCase(),wishId:w.id,t:Date.now()});save();closeModal();toast('Suggestion sent in the test world.');pulseStats()}}
function showOwnerPivot(w){modal(`<div class=eyebrow>PIVOT YOUR WISH</div><h2>It can change and still remain yours.</h2><p>The previous form stays in the history. You are changing direction, not erasing the past.</p><label>New direction</label><textarea class=field id=pivotText maxlength=180>${esc(w.text)}</textarea><div class=row><button class=secondary id=cancelP>Cancel</button><button class=primary id=applyP>Pivot</button></div>`);document.getElementById('cancelP').onclick=closeModal;document.getElementById('applyP').onclick=()=>{let t=document.getElementById('pivotText').value.trim();if(t.length<8)return toast('Give the wish a little more shape.');state.events.push({type:'pivot',wishId:w.id,from:w.text,to:t,t:Date.now()});w.text=t;syncCustom(w);save();closeModal();openWish(w.id);toast('Your wish changed direction. The earlier trace remains.');pulseStats()}}
function showOwnerSplit(w){modal(`<div class=eyebrow>SPLIT YOUR WISH</div><h2>Turn a large intention into smaller ones.</h2><p>Write two to four concrete micro-intentions, one per line.</p><label>Smaller intentions</label><textarea class=field id=splitText placeholder="First smaller intention\nSecond smaller intention\nThird smaller intention"></textarea><div class=row><button class=secondary id=cancelS>Cancel</button><button class=primary id=applyS>Split</button></div>`);document.getElementById('cancelS').onclick=closeModal;document.getElementById('applyS').onclick=()=>{let parts=document.getElementById('splitText').value.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>4).slice(0,4);if(parts.length<2)return toast('Add at least two smaller intentions.');parts.forEach((t,i)=>{let id='u'+Date.now()+i,ang=-.8+i*(1.6/Math.max(1,parts.length-1));let c={id,text:t,loc:w.loc,date:new Date().toISOString(),x:w.x+Math.cos(ang)*150,y:w.y+Math.sin(ang)*150,color:w.color,enc:0,state:'alive',owner:true,parent:w.id};state.customWishes.push(c);state.myWishIds.push(id);wishes.push(c);state.customEdges.push({a:w.id,b:id,kind:'human'});});state.events.push({type:'split',wishId:w.id,t:Date.now()});save();rebuildEdges();closeModal();openWish(w.id);pulseStats();toast('Your wish now has smaller living branches.');}}
function showReport(w){modal(`<div class=eyebrow>REPORT</div><h2>Help keep the world safe.</h2><p>Reports are not public and do not affect popularity.</p><div class=choices id=reportChoices><button class=chip>Hate or harassment</button><button class=chip>Personal information</button><button class=chip>Money or solicitation</button><button class=chip>Sexual or violent content</button><button class=chip>Spam</button><button class=chip>Other</button></div><div class=row><button class=secondary id=cancelR>Cancel</button><button class=primary id=sendR>Report</button></div>`);let choice='';document.querySelectorAll('#reportChoices .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#reportChoices .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');choice=c.textContent});document.getElementById('cancelR').onclick=closeModal;document.getElementById('sendR').onclick=()=>{if(!choice)return toast('Choose a reason.');state.reports.push({wishId:w.id,reason:choice,t:Date.now()});save();closeModal();toast('Report received for this test.');}}
function showCreate(){modal(`<div class=eyebrow>RELEASE A WISH</div><h2>What would you like to bring into the world?</h2><p>Short, human and real enough to mean something. It can still change later.</p><label>Start with</label><div class=choices id=starts><button class="chip on">I want to…</button><button class=chip>I wish I could…</button><button class=chip>I want to learn…</button><button class=chip>I want to create…</button><button class=chip>I want to change…</button></div><label>Your intention</label><textarea class=field id=wishText maxlength=150 placeholder="cross the Atlantic one day"></textarea><label>Place</label><input class=field id=wishLoc maxlength=60 placeholder="Nantes, France"><div class=note>Public metadata: place + date. No email, phone number or links in the wish.</div><div class=row><button class=secondary id=cancelC>Cancel</button><button class=primary id=publishC>Release</button></div><div id=modNote class=note></div>`);let start='I want to…';document.querySelectorAll('#starts .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#starts .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');start=c.textContent});document.getElementById('cancelC').onclick=closeModal;document.getElementById('publishC').onclick=()=>{let raw=document.getElementById('wishText').value.trim(),loc=document.getElementById('wishLoc').value.trim()||'Somewhere in the world';let text=(start.replace('…','')+' '+raw).replace(/\s+/g,' ').trim();let err=moderate(text);if(err){document.getElementById('modNote').innerHTML=`<span class=danger-note>${esc(err)}</span>`;return}let btn=document.getElementById('publishC');btn.disabled=true;btn.innerHTML='<span class=loader></span>Checking';setTimeout(()=>{let id='u'+Date.now(),c={id,text,loc,date:new Date().toISOString(),x:500+Math.random()*2200,y:350+Math.random()*1400,color:COLORS[Math.floor(Math.random()*COLORS.length)],enc:0,state:'alive',owner:true,parent:null};state.customWishes.push(c);state.myWishIds.push(id);state.events.push({type:'create',wishId:id,t:Date.now()});wishes.push(c);save();rebuildEdges();closeModal();focusWish(id);pulseStats();showClaimAfterCreate(c)},780)}}
function moderate(t){if(t.length<10)return 'Give the wish a little more shape.';if(/https?:\/\/|www\.|@\w+\.\w+|\+?\d[\d\s().-]{7,}\d/i.test(t))return 'Please remove links or personal contact details.';if(/kill myself|suicide|self[- ]?harm|cancer|chemotherapy|diagnos|porn|nude|sex with|buy drugs|weapon|gun|hate all|send money|donate money|fundraiser|crowdfund/i.test(t))return 'This version of RALUVAAA cannot safely host this kind of wish yet.';return null}
function showClaimAfterCreate(w){if(state.identity){toast('Your wish is connected to your identity on this device.');return}modal(`<div class=eyebrow>YOUR WISH IS HERE</div><h2>Keep its trace.</h2><p>You have already created it. To come back, shape it, receive suggestions and one day talk with helpers, it needs to know how to recognise you.</p><label>Email</label><input class=field id=claimEmail type=email autocomplete=email placeholder="you@example.com"><div class=note>Your email is private. In this prototype, it is stored only on this device. Production will use a persistent verified session.</div><div class=row><button class=secondary id=laterClaim>Leave it for now</button><button class=primary id=claimWish>Keep this wish</button></div>`);document.getElementById('laterClaim').onclick=()=>{closeModal();toast('Unclaimed test wish: it remains only on this device.');};document.getElementById('claimWish').onclick=()=>{let v=document.getElementById('claimEmail').value.trim();if(!/^\S+@\S+\.\S+$/.test(v))return toast('Enter a valid email.');state.identity={email:v,created:Date.now()};save();closeModal();toast('This wish is now yours in the test world.');}}
function showMyWorld(){let mine=(state.myWishIds||[]).map(wishById).filter(Boolean);let proposals=(state.proposals||[]);modal(`<div class=eyebrow>MY WORLD</div><h2>${state.identity?'Your traces and connections.':'You are exploring anonymously.'}</h2><p>${state.identity?'Your identity is private. Only your wishes and actions matter publicly.':'You can explore and encourage without identifying yourself.'}</p>${state.identity?`<div class=note>${esc(state.identity.email)} · test identity on this device</div>`:`<div class=row><button class=primary id=identifyNow>Identify this device</button></div>`}<div class=divider></div><label>Your wishes</label>${mine.length?mine.map(w=>`<button class="entrusted-item" data-mine="${w.id}"><div class=t>${esc(w.text)}</div><div class=m><span>${w.state}</span><span>${esc(w.loc)}</span></div></button>`).join(''):'<p class=tiny>No wish released from this device yet.</p>'}<label>Suggestions you sent in this prototype</label>${proposals.length?proposals.slice(-5).reverse().map(p=>`<div class="entrusted-item"><div class=t>${p.type}: ${esc(p.text)}</div></div>`).join(''):'<p class=tiny>None yet.</p>'}<div class=divider></div><p class=tiny>Messaging concept: when a wisher accepts HELP, a simple private text conversation opens inside RALUVAAA. No phone number or email needs to be shared. Production backend required.</p>`);if(!state.identity)document.getElementById('identifyNow').onclick=()=>{closeModal();showIdentity(()=>showMyWorld())};document.querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>{let id=b.dataset.mine;closeModal();focusWish(id)})}
function showPulse(){modal(`<div class=eyebrow>WORLD PULSE · 24H</div><h2>The world moved while you were away.</h2><p>This is not a feed and nothing here is ranked for you.</p><div class=stats style="display:grid;font-size:14px;margin-top:18px"><span class=k>New wishes</span><span class=v>31</span><span class=k>Encouragements</span><span class=v>114</span><span class=k>Human connections</span><span class=v>9</span><span class=k>Splits</span><span class=v>6</span><span class=k>Blooms</span><span class=v>2</span></div><div class=divider></div><p>✦ A wish bloomed in Kyoto.<br><br>⌁ Two intentions were connected by someone who knew neither wisher.<br><br>↟ Someone offered help from 8,400 km away.<br><br>⑂ A large wish became three smaller actions.</p><div class=note>TEST MODE: seeded wishes and activity are simulated. Any wish you create on this device is local. Production data must always distinguish real, local and simulated activity.  Production WORLD PULSE must always distinguish real, local and simulated activity.</div>`)}
function onboard(){if(state.onboarded)return;let step=0,copy=[['A living map of human intentions.','No feed. No ranking. No recommendation engine. Move through the world and meet what humans hoped for.'],['Every light is a wish.','Tap one. Encourage it, help, suggest a pivot or a split, or connect it to another intention. Other humans can suggest. The wisher decides.'],['Three wishes are entrusted to you.','One is fleeting, one lasts days, one lasts longer. You cannot save them. When their time with you ends, they return to the world.']];function render(){let [a,b]=copy[step];modal(`<div class=orb></div><div class=onboardcopy>${a}</div><div class=onboardsub>${b}</div><div class=steps>${copy.map((_,i)=>`<span class="stepdot ${i===step?'on':''}"></span>`).join('')}</div><button class=primary id=nextOn>${step===copy.length-1?'Enter RALUVAAA':'Continue'}</button>`);document.getElementById('nextOn').onclick=()=>{step++;if(step<copy.length)render();else{state.onboarded=true;save();closeModal()}}}render()}
function toast(t){document.getElementById('toastWrap').innerHTML=`<div class=toast>${esc(t)}</div>`;setTimeout(()=>document.getElementById('toastWrap').innerHTML='',3100)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function formatDate(d){return new Intl.DateTimeFormat('en',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d))}
document.getElementById('createBtn').onclick=showCreate;document.getElementById('myWorldBtn').onclick=showMyWorld;document.getElementById('pulseMore').onclick=showPulse;document.getElementById('pulseMobile').onclick=showPulse;
if(location.hash.startsWith('#wish=')){setTimeout(()=>focusWish(decodeURIComponent(location.hash.slice(6))),450)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});onboard();
