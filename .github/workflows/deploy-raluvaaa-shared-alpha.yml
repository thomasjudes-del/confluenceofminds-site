name: Deploy RALUVAAA Shared Alpha API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RALUVAAA_EMAIL_FROM: ${{ secrets.RALUVAAA_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }
          test -n "$RESEND_API_KEY" || { echo "Missing RESEND_API_KEY"; exit 2; }
          test -n "$RALUVAAA_EMAIL_FROM" || { echo "Missing RALUVAAA_EMAIL_FROM"; exit 2; }
      - name: Install Wrangler
        run: npm install --no-save wrangler@4 >/dev/null 2>&1
      - name: Prepare D1 and Worker config
        working-directory: raluvaaa/alpha-api
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='raluvaaa-alpha');if(x)process.stdout.write(x.uuid||x.id||'')})")
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create raluvaaa-alpha --jurisdiction eu
            DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='raluvaaa-alpha');if(x)process.stdout.write(x.uuid||x.id||'')})")
          fi
          test -n "$DB_ID" || { echo "Could not resolve D1 database id"; exit 3; }
          sed "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml.example > wrangler.prod.toml
          echo "D1 database ready."
      - name: Apply D1 schema
        working-directory: raluvaaa/alpha-api
        run: npx wrangler d1 execute raluvaaa-alpha --remote --file=schema.sql --config=wrangler.prod.toml --yes
      - name: Configure identity secrets
        working-directory: raluvaaa/alpha-api
        run: |
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config=wrangler.prod.toml
          AUTH_CODE_SECRET="$(openssl rand -hex 32)"
          printf '%s' "$AUTH_CODE_SECRET" | npx wrangler secret put AUTH_CODE_SECRET --config=wrangler.prod.toml
          printf '%s' "$RALUVAAA_EMAIL_FROM" | npx wrangler secret put RALUVAAA_EMAIL_FROM --config=wrangler.prod.toml
      - name: Deploy Worker
        working-directory: raluvaaa/alpha-api
        run: |
          npx wrangler deploy --config=wrangler.prod.toml | tee /tmp/raluvaaa-deploy.log
          WORKER_URL=$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/raluvaaa-deploy.log | tail -1)
          test -n "$WORKER_URL" || { echo "Could not detect workers.dev URL"; cat /tmp/raluvaaa-deploy.log; exit 4; }
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "Worker: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production health
        run: |
          curl --retry 6 --retry-delay 2 --fail --silent --show-error "$WORKER_URL/v1/health"
          echo
      - name: Wire Shared and Private Alpha to deployed Worker
        run: |
          printf "window.RALUVAAA_ALPHA_API_BASE='%s';\n" "$WORKER_URL" > raluvaaa/shared-alpha/api-config.js
          printf "window.RALUVAAA_ALPHA_API_BASE='%s';\n" "$WORKER_URL" > raluvaaa/private-alpha/api-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raluvaaa/shared-alpha/api-config.js raluvaaa/private-alpha/api-config.js
          if git diff --cached --quiet; then
            echo "Alpha clients already point to this Worker."
          else
            git commit -m "Point RALUVAAA alpha clients to deployed Worker"
            git push
          fi
