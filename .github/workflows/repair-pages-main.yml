name: Repair and deploy current Pages site

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-pages-main.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: confluence-pages-controlled-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the automatic deployment for this commit
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}"
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'X-GitHub-Api-Version: 2026-03-10'
          )

          cancelled=false
          for attempt in $(seq 1 18); do
            code=$(curl --location --silent --show-error \
              --output /tmp/cancel-response.txt \
              --write-out '%{http_code}' \
              --request POST "${headers[@]}" "${endpoint}/cancel")
            cat /tmp/cancel-response.txt || true
            echo "Attempt ${attempt}: cancel endpoint returned HTTP ${code}"

            if [ "${code}" = '204' ]; then
              cancelled=true
              break
            fi
            if [ "${code}" = '409' ]; then
              break
            fi
            if [ "${code}" != '404' ]; then
              exit 1
            fi
            sleep 5
          done

          echo "automatic_deployment_cancelled=${cancelled}" >> "${GITHUB_OUTPUT}"
          sleep 10

      - name: Checkout the current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the current site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy the current site with extended timeout
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 5000
