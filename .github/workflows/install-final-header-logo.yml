name: Install final transparent header logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-final-header-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install logo and refresh reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          logo_b64 = '''[... ELLIPSIZATION ...]'''

          Path('assets/confluence-logo.png').write_bytes(base64.b64decode(logo_b64))

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'assets/confluence-logo\.png(?:\?v=[^\"]*)?',
              'assets/confluence-logo.png?v=20260805-1010',
              html,
              count=1,
          )
          if count != 1:
              raise SystemExit('Header logo reference not found exactly once')
          index.write_text(updated, encoding='utf-8')
          PY
          file assets/confluence-logo.png
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('assets/confluence-logo.png')
          assert im.size == (180, 180)
          assert im.mode in ('RGBA', 'LA', 'P')
          print('verified', im.size, im.mode)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/confluence-logo.png index.html
          git commit -m "Use final transparent Confluence logo in header"
          git push
