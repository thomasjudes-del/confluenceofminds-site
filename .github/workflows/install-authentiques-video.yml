name: Install Authentiques Victimes teaser

on:
  push:
    paths:
      - '.github/workflows/install-authentiques-video.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/Authentiques_Victimes_Cinematic_Teaser_V2_Nils_Frahm.mp4
    steps:
      - uses: actions/checkout@v4

      - name: Install ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate R2 video
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 240 "$VIDEO_URL" -o /tmp/authentiques-victimes.mp4
          test -s /tmp/authentiques-victimes.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,duration -of default=noprint_wrappers=1 /tmp/authentiques-victimes.mp4

      - name: Add video to card
        run: python3 scripts/install_authentiques_video.py

      - name: Verify integration
        run: |
          grep -q 'world-card--victims world-card--native' index.html
          grep -q 'Authentiques_Victimes_Cinematic_Teaser_V2_Nils_Frahm.mp4' index.html
          grep -q 'data-media-container' index.html

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/install-authentiques-video.yml scripts/install_authentiques_video.py
          git add index.html .github/workflows/install-authentiques-video.yml scripts/install_authentiques_video.py
          git commit -m 'Use Authentiques Victimes cinematic teaser background'
          git push
