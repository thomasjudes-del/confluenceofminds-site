name: Repair immersive hero PNG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-immersive-hero-png.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify PNG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          import zlib

          path = Path('assets/confluence-hero-organic.png')
          data = bytearray(path.read_bytes())

          patches = [
              (23655, 23656, '11'),
              (18143, 18144, '9e'),
              (185, 200, ''),
              (183, 184, '57b1f4b07a84'),
              (171, 182, ''),
              (162, 170, '12098a3812125a11'),
              (160, 161, '45fcb5fc9a896fcb9d6defca6d'),
              (153, 158, '5431362de3aa6ecab89dca9a67'),
              (152, 152, '896eb0a79166'),
              (148, 151, '9ea7645f646354'),
              (143, 147, '73711bc8'),
              (98, 99, 'f2'),
              (77, 80, ''),
              (68, 71, ''),
              (62, 65, ''),
              (59, 59, '534a36'),
              (57, 58, 'a5'),
              (55, 56, 'ee'),
              (53, 54, 'dbcbb1fb'),
          ]

          for start, end, replacement_hex in patches:
              data[start:end] = bytes.fromhex(replacement_hex)

          expected = '256996f0da3b06320b2f292ba13514d673b9a9fa63c2f1273898009c2db32ea4'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA mismatch: {actual}')

          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Invalid PNG signature')

          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (800, 533):
              raise SystemExit(f'Unexpected PNG dimensions: {width}x{height}')

          pos = 8
          found_iend = False
          while pos < len(data):
              if pos + 12 > len(data):
                  raise SystemExit('Truncated PNG chunk header')
              length = struct.unpack('>I', data[pos:pos+4])[0]
              chunk_type = bytes(data[pos+4:pos+8])
              end = pos + 12 + length
              if end > len(data):
                  raise SystemExit(f'Truncated {chunk_type!r} chunk')
              payload = bytes(data[pos+8:pos+8+length])
              stored_crc = struct.unpack('>I', data[pos+8+length:end])[0]
              computed_crc = zlib.crc32(chunk_type + payload) & 0xffffffff
              if stored_crc != computed_crc:
                  raise SystemExit(f'Bad CRC for {chunk_type!r}')
              pos = end
              if chunk_type == b'IEND':
                  found_iend = True
                  break

          if not found_iend or pos != len(data):
              raise SystemExit('Invalid PNG ending')

          path.write_bytes(data)
          print(f'PNG verified: {width}x{height}, {len(data)} bytes, sha256={actual}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/confluence-hero-organic.png
          git rm -f .fix/hero.part00 .fix/hero.part01 \
            .github/workflows/repair-immersive-hero-png.yml
          git commit -m "Repair and verify immersive hero PNG"
          git push
