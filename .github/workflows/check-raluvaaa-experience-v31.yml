name: Check RALUVAAA Experience V31

on:
  push:
    paths:
      - 'raluvaaa/solo-experience-v31/**'
      - 'raluvaaa/mvp-v26/app.js'
      - '.github/workflows/check-raluvaaa-experience-v31.yml'
  workflow_dispatch:

concurrency:
  group: raluvaaa-experience-v31-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          node --check raluvaaa/solo-experience-v31/experience-v31.js
          node --check raluvaaa/solo-experience-v31/create-sound-v31.js
          node --check raluvaaa/solo-experience-v31/qa-v31.cjs
          grep -q 'data-version="31"' raluvaaa/solo-experience-v31/index.html
          grep -q 'raluvaaaSoloExperienceV31R1' raluvaaa/solo-experience-v31/index.html
      - name: Install QA browsers
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Run V31 UI and creation-sound QA
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/raluvaaa-v31-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          sleep 2
          node raluvaaa/solo-experience-v31/qa-v31.cjs
