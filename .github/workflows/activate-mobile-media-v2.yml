name: Activate mobile media fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-mobile-media-v2.yml"

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump mobile CSS and JS cache keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          replacements = {
              'cards-streaming-v1.css?v=20260805-1625': 'cards-streaming-v1.css?v=20260805-mobile-v2',
              'cards-streaming-v1.js?v=20260805-1625': 'cards-streaming-v1.js?v=20260805-mobile-v2',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Missing expected reference: {old}')
              html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')
          PY
          rm .github/workflows/activate-mobile-media-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/activate-mobile-media-v2.yml
          git commit -m "Load mobile media fixes without stale cache"
          git push
