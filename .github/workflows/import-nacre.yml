name: Import NACRE test build
on:
  push:
    paths: ['.github/workflows/import-nacre.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thomasjudes-del/Nacre
          ref: d09f241b8269155d74a02f9e210a329fc80eabbe
          path: .nacre-source
      - name: Copy validated game
        run: |
          mkdir -p nacre/play
          cp -a .nacre-source/dist/. nacre/play/
          rm -rf .nacre-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nacre/play
          git diff --cached --quiet || git commit -m "Publish NACRE shore return d09f241"
          git push
