name: Install verified transparent logo binary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-logo-binary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PNG
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > assets/confluence-logo.png
          file assets/confluence-logo.png
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('assets/confluence-logo.png')
          assert im.size == (180, 180)
          print(im.mode, im.size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/confluence-logo.png
          git commit -m "Install verified transparent header logo"
          git push
