name: Prepare RALUVAAA V43 share music

on:
  push:
    paths:
      - '.github/workflows/prepare-raluvaaa-v43-share-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Immersed share excerpt
        run: |
          set -e
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null)
          curl -L --fail --retry 3             'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Immersed.mp3'             -o /tmp/immersed-full.mp3
          ffmpeg -hide_banner -loglevel error             -i /tmp/immersed-full.mp3             -t 6.4             -af 'afade=t=in:st=0:d=0.45,afade=t=out:st=5.55:d=0.85'             -codec:a libmp3lame -b:a 128k             raluvaaa/solo-experience-v43/immersed-share-clip.mp3
          cat > raluvaaa/solo-experience-v43/SHARE-MUSIC-LICENSE.txt <<'EOF'
Immersed
Kevin MacLeod
Source: https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1600010
License: Creative Commons Attribution 4.0 International (CC BY 4.0)
License URL: https://creativecommons.org/licenses/by/4.0/

Used in RALUVAAA V43 as a short share-video excerpt with visible attribution.
EOF
          ls -lh raluvaaa/solo-experience-v43/immersed-share-clip.mp3
      - name: Commit share excerpt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raluvaaa/solo-experience-v43/immersed-share-clip.mp3 raluvaaa/solo-experience-v43/SHARE-MUSIC-LICENSE.txt
          git diff --cached --quiet && exit 0
          git commit -m 'RALUVAAA V43: add licensed Immersed share excerpt'
          git push
