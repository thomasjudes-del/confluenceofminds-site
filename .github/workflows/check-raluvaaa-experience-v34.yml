name: Check RALUVAAA Experience V34

on:
  push:
    paths:
      - 'raluvaaa/solo-experience-v34/**'
      - 'raluvaaa/solo-experience-v33/**'
      - 'raluvaaa/mvp-v26/app.js'
      - '.github/workflows/check-raluvaaa-experience-v34.yml'
  workflow_dispatch:

concurrency:
  group: raluvaaa-experience-v34-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          node --check raluvaaa/solo-experience-v34/experience-v34.js
          node --check raluvaaa/solo-experience-v34/create-sound-v34.js
          node --check raluvaaa/solo-experience-v34/qa-v34.cjs
          test -s raluvaaa/solo-experience-v33/create-a-wish.mp3
          grep -q 'data-ui-version="34"' raluvaaa/solo-experience-v34/index.html
          grep -q '../solo-experience-v33/experience-v33.css' raluvaaa/solo-experience-v34/index.html
          grep -q 'experience-v34.css' raluvaaa/solo-experience-v34/index.html
          grep -q 'experience-v34.js' raluvaaa/solo-experience-v34/index.html
          grep -q 'create-sound-v34.js' raluvaaa/solo-experience-v34/index.html
      - name: Install QA browsers
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Run V34 icon QA
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/raluvaaa-v34-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          sleep 2
          node raluvaaa/solo-experience-v34/qa-v34.cjs
