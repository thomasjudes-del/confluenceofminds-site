name: Patch AV preamble reprise

on:
  push:
    paths:
      - '.github/workflows/patch-av-preamble-reprise.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replace only the AV preamble excerpt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('authentiques-victimes/index.html')
          s = path.read_text(encoding='utf-8')
          marker = '<article class="preamble__text reveal"'
          start = s.index(marker)
          end = s.index('</article>', start) + len('</article>')

          article = '''<article class="preamble__text reveal" style="width:min(1060px,100%);padding-left:clamp(28px,5vw,76px);padding-right:clamp(28px,5vw,76px);">
          <p>Mais… il était déjà plus tout à fait là, papa.</p>
          <p>Les pensées de pierre s'étaient écrasées sur tout le reste, avalanche qui bouche pour toujours les accès aux sentiers fleuris.</p>
          <p>Il n'y avait plus de pensées heureuses.<br />Plus de pensées légères.</p>
          <p>Papa est écrivain.<br />Il dit que c'est son bonheur et sa malédiction.<br />Que l'écriture peut être la clef tout autant que la serrure.</p>
          <p>Il a toujours répété ça, et moi, je voyais pas trop le problème. Je veux dire s'il avait à la fois la clef et la serrure, ça semblait plutôt chouette, non ? Pouvoir entrouvrir la lourde herse quand il fallait aérer ou bien fermer à double tour pour garder tout bien à l'abri des regards. Joindre l'intime à l'ouverture. La caverne aux quatre vents.</p>
          <p>Papa, ton inspiration c'est la respiration des fées, des papillons, des libellules.<br />Si tes pensées sont lourdes, qu'elles retrouvent leur liberté pour s'envoler au loin ou s'enfoncer dans le sol et disparaître au plus profond de la terre.<br />C'est tout ce que je demande au ciel.</p>
          <p>Et comme ça,<br />Peut-être,<br />Oui – peut-être – que tu m'aimeras.</p>
          </article>'''

          new = s[:start] + article + s[end:]
          if new == s:
              raise SystemExit('No change made')
          path.write_text(new, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authentiques-victimes/index.html
          git commit -m "Replace AV preamble with revised Opaline reprise"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git pull --rebase
          rm .github/workflows/patch-av-preamble-reprise.yml
          git add .github/workflows/patch-av-preamble-reprise.yml
          git commit -m "Remove temporary AV preamble workflow"
          git push
