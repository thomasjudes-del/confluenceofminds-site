name: Install immersive hero V7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-immersive-hero-v7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify hero artwork
        shell: bash
        run: |
          mkdir -p assets
          cat .deploy/hero-v7.part* > /tmp/hero-v7.b64
          base64 --decode /tmp/hero-v7.b64 > assets/confluence-hero-organic.png
          python3 - <<'PY'
          from pathlib import Path
          import struct

          path = Path('assets/confluence-hero-organic.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Invalid PNG signature')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (800, 533):
              raise SystemExit(f'Unexpected dimensions: {width}x{height}')
          if len(data) < 45000:
              raise SystemExit(f'Unexpectedly small file: {len(data)} bytes')
          print(f'PNG verified: {width}x{height}, {len(data)} bytes')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/confluence-hero-organic.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add transparent organic hero artwork"
          git push
