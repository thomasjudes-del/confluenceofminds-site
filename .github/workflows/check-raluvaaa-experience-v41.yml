name: Check RALUVAAA Experience V41

on:
  push:
    paths:
      - 'raluvaaa/solo-experience-v41/**'
      - 'raluvaaa/ICON-ASSET-PROCEDURE.md'
      - 'raluvaaa/WORKFLOW-RULES-V41.md'
      - '.github/workflows/check-raluvaaa-experience-v41.yml'
  workflow_dispatch:

concurrency:
  group: raluvaaa-experience-v41-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          node --check raluvaaa/solo-experience-v41/app-v41.js
          node --check raluvaaa/solo-experience-v41/engine-runtime-v41.js
          node --check raluvaaa/solo-experience-v41/ui-v41.js
          node --check raluvaaa/solo-experience-v41/revive-sound-v41.js
          node --check raluvaaa/solo-experience-v41/qa-v41.cjs
          grep -q 'data-workflow-version="41"' raluvaaa/solo-experience-v41/index.html
          grep -q "raluvaaaSoloExperienceV41R1" raluvaaa/solo-experience-v41/index.html
          grep -q 'app-v41.js' raluvaaa/solo-experience-v41/index.html
          grep -q 'ui-v41.js' raluvaaa/solo-experience-v41/index.html
          grep -q 'revive-sound-v41.js' raluvaaa/solo-experience-v41/index.html
          grep -q '/raluvaaa/v41/icons/revive.svg' raluvaaa/solo-experience-v41/ui-v41.js
          grep -q '/raluvaaa/v41/icons/move-branch.svg' raluvaaa/solo-experience-v41/ui-v41.js
          grep -q '/raluvaaa/v41/audio/revive-water.wav' raluvaaa/solo-experience-v41/revive-sound-v41.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run V41 workflow QC
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/raluvaaa-v41-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          sleep 2
          node raluvaaa/solo-experience-v41/qa-v41.cjs
