                "read":"5 min read",
                "lead":"Strictly speaking, cinema is an art of moving images. But storytelling has never been particularly obedient to definitions. Sound can create rooms, distances, cuts, bodies, weather and entire worlds without showing a single frame.",
                "body":'''<p>Radio drama proved long ago that an audience can see with its ears. What changed with spatial audio, headphones and contemporary sound design is the degree of physical presence. The listener is no longer simply hearing a story from somewhere outside it; sound can place the listener <strong>inside the scene</strong>.</p>
                <p>Radio France has explicitly used the expression <strong>“cinéma sonore”</strong> — cinema for the ears — for immersive 3D sound sessions in Studio 105. Elsewhere, companies such as <strong>DARKFIELD</strong> build experiences in complete darkness using binaural or 360-degree sound, turning absence of light into part of the staging.</p>
                <h2>What is left when the screen goes black?</h2>
                <p>More than dialogue. A door closing behind the listener establishes geography. A voice moving from the left ear to the right creates blocking. Silence can become a cut. Distance becomes framing. A change in acoustic texture can do the work of a location change.</p>
                <div class="pullquote">Remove the image and the audience does not stop visualising. You simply lose control of the camera.<small>Confluence of Minds</small></div>
                <p>That loss of control is the interesting part. In conventional cinema, the director decides what the spectator sees. In sound-only fiction, the production supplies constraints — voices, rhythm, acoustic space, music, detail — and the listener completes the image using memory.</p>
                <h2>SILMEA and the idea of the sound-film</h2>
                <p><strong>Créations SILMEA</strong> explored this territory by making immersive works conceived as films made entirely from sound. Projects such as <em>Zone Aphotique</em>, <em>Sherlock Holmes</em> and <em>La Traversée</em> were not attempts to make podcasts behave more like cinema. The experiment was closer to the reverse: <strong>how much cinematic language survives when the image is removed?</strong></p>
                <p>The answer is surprisingly large. Pace, montage, off-screen space, suspense, point of view and scale can all be constructed acoustically. What changes is ownership of the final picture.</p>
                <p>So can a movie exist without images? If the definition requires projected moving pictures, probably not. If cinema is also a way of directing attention through time, space, rhythm and emotion, the border becomes much more interesting.</p>
                <p>Perhaps the image has not vanished at all. It has simply been outsourced to the most sophisticated rendering engine in the room: the listener.</p>''',
