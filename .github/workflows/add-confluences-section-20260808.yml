                "deck":"Retirez l’image d’un film et quelque chose d’étrange se produit : la scène ne disparaît pas forcément. Elle se déplace parfois dans la tête de celui qui écoute.",
                "read":"5 min de lecture",
                "lead":"Au sens strict, le cinéma est un art des images en mouvement. Mais les récits ont toujours eu assez peu de respect pour les définitions. Le son peut créer des pièces, des distances, des coupes, des corps, une météo et des mondes entiers sans montrer une seule image.",
                "body":'''<p>La fiction radiophonique a démontré depuis longtemps que nous pouvions voir avec nos oreilles. Ce que l’audio spatial, le casque et le sound design contemporain ont changé, c’est le degré de présence physique. L’auditeur n’entend plus seulement une histoire située quelque part devant lui : le son peut le placer <strong>à l’intérieur de la scène</strong>.</p>
                <p>Radio France a explicitement utilisé l’expression <strong>« cinéma sonore »</strong> — du cinéma pour les oreilles — pour des séances immersives en son 3D dans le Studio 105. Ailleurs, des compagnies comme <strong>DARKFIELD</strong> construisent des expériences dans l’obscurité complète en utilisant du son binaural ou à 360 degrés, transformant l’absence de lumière en élément de mise en scène.</p>
                <h2>Que reste-t-il lorsque l’écran devient noir ?</h2>
                <p>Beaucoup plus que des dialogues. Une porte qui se ferme derrière l’auditeur crée une géographie. Une voix qui passe de l’oreille gauche à l’oreille droite fabrique un déplacement. Le silence peut devenir une coupe. La distance devient un cadrage. Une modification de texture acoustique peut remplacer un changement de décor.</p>
                <div class="pullquote">Enlevez l’image et le public ne cesse pas de visualiser. Vous perdez simplement le contrôle de la caméra.<small>Confluence of Minds</small></div>
                <p>Cette perte de contrôle est précisément ce qui est intéressant. Au cinéma, le réalisateur choisit ce que voit le spectateur. Dans une fiction uniquement sonore, la production fournit des contraintes — voix, rythme, espace acoustique, musique, détails — puis l’auditeur termine l’image avec sa propre mémoire.</p>
                <h2>SILMEA et l’idée du film sonore</h2>
                <p><strong>Créations SILMEA</strong> a exploré ce territoire avec des œuvres immersives pensées comme des films fabriqués entièrement par le son. Des projets comme <em>Zone Aphotique</em>, <em>Sherlock Holmes</em> ou <em>La Traversée</em> ne cherchaient pas simplement à faire ressembler un podcast au cinéma. L’expérience consistait presque à poser la question inverse : <strong>combien de langage cinématographique survit lorsqu’on retire l’image ?</strong></p>
                <p>La réponse est : beaucoup. Rythme, montage, hors-champ, suspense, point de vue et échelle peuvent tous être construits acoustiquement. Ce qui change, c’est le propriétaire de l’image finale.</p>
                <p>Alors, un film peut-il exister sans images ? Si sa définition exige des images animées projetées, probablement pas. Si le cinéma est aussi une manière de diriger l’attention dans le temps, l’espace, le rythme et l’émotion, la frontière devient beaucoup plus intéressante.</p>
                <p>Peut-être que l’image n’a pas disparu. Elle a simplement été confiée au moteur de rendu le plus sophistiqué de la pièce : l’auditeur.</p>''',
