          articles = {
            "why-confluence-of-minds": {
              "class":"tagore",
              "en": {
                "title":"Why Confluence of Minds?",
                "desc":"The story behind the name: Rabindranath Tagore, Patrick Geddes and the value of putting radically different ways of thinking in the same room.",
                "kicker":"Origins · Education · Ecology",
                "deck":"An Indian poet and a Scottish polymath exchanged ideas about education, ecology and how knowledge should meet the world. A century later, their conversation still feels strangely current.",
                "read":"5 min read",
                "lead":"The name Confluence of Minds did not begin as a branding exercise. It echoes a real encounter between two people who had almost every reason to think differently — and chose to keep talking.",
                "body":'''<p><strong>Rabindranath Tagore</strong> was a poet, educator and Nobel laureate from Bengal. <strong>Patrick Geddes</strong> was a Scottish biologist, sociologist and pioneering town planner. They met while Geddes was working in India and exchanged letters from 1918 into 1930.</p>
                <p>The subjects moved freely: education, science, the environment, rural reconstruction, cities, universities and the relationship between local life and global knowledge. That freedom matters. Neither man seemed particularly interested in respecting the borders between disciplines simply because institutions had drawn them there.</p>
                <h2>They did not think alike. That was the point.</h2>
                <p>Geddes liked systems, surveys, diagrams and plans. Tagore was more suspicious of anything that made living things too tidy. He wanted education to remain connected to nature, intuition, culture and the inner development of the student. Their correspondence is interesting precisely because it is not a story of two identical thinkers discovering that they agree.</p>
                <p>It is a story of <strong>difference producing a third space</strong>.</p>
                <div class="pullquote">A confluence is not a blend. Two rivers keep their origins — but create a new current when they meet.<small>Confluence of Minds</small></div>
                <p>In 2017, Bashabi Fraser, Tapati Mukherjee and Amrit Sen edited a collection of their writings under a title that captures this beautifully: <em>A Confluence of Minds: The Rabindranath Tagore and Patrick Geddes Reader on Education and Environment</em>.</p>
                <h2>Why the phrase still works</h2>
                <p>Our own Confluence of Minds is not an academic continuation of Tagore and Geddes. It is a small creative echo of the same instinct: <strong>put things together that normally live in separate folders and see what happens.</strong></p>
                <p>A science-fiction decision game about Titan can sit beside a psychological novel about algorithmic authorship. A sound-only film can coexist with Japanese cultural exploration, fantasy, climate fiction and experiments made with artificial intelligence. The projects do not need a common visual style or even a common medium. The connection is the collision itself.</p>
                <p>That is also why the plural matters. Not one mind made larger, but several modes of thought allowed to interfere with one another: scientific and fictional, human and machine, serious and playful, archival and speculative.</p>
                <p>Tagore and Geddes were thinking about education and environment, not interactive fiction or generative AI. But their exchange carries a useful warning for the present: specialization gives us depth; <strong>confluence gives us unexpected questions.</strong></p>''',
                "related_title":"Explore the worlds",
                "related_text":"The name becomes concrete in a collection of stories, games, audio fiction and experiments that deliberately refuse a single format.",
                "related_href":"/#worlds",
                "related_cta":"Enter the worlds",
                "sources":[
                  ("Bashabi Fraser — books and background on the Tagore–Geddes reader","https://bashabifraser.co.uk/index.php/books"),
                  ("The Tagore-Geddes Correspondence — Google Books / Visva-Bharati","https://books.google.com/books/about/The_Tagore_Geddes_Correspondence.html?id=SnSaPQAACAAJ")
                ]
              },
              "fr": {
                "title":"Pourquoi Confluence of Minds ?",
                "desc":"L’histoire derrière le nom : Rabindranath Tagore, Patrick Geddes et l’intérêt de faire dialoguer des manières de penser radicalement différentes.",
                "kicker":"Origines · Éducation · Écologie",
                "deck":"Un poète indien et un polymathe écossais ont échangé sur l’éducation, l’écologie et la manière dont le savoir devrait rencontrer le monde. Un siècle plus tard, leur conversation paraît étrangement actuelle.",
                "read":"5 min de lecture",
                "lead":"Le nom Confluence of Minds n’est pas né d’un exercice de branding. Il fait écho à une rencontre réelle entre deux hommes qui avaient presque toutes les raisons de penser différemment — et qui ont choisi de continuer à se parler.",
                "body":'''<p><strong>Rabindranath Tagore</strong> était poète, éducateur et prix Nobel de littérature, originaire du Bengale. <strong>Patrick Geddes</strong> était biologiste, sociologue et urbaniste écossais. Ils se rencontrent alors que Geddes travaille en Inde et échangent des lettres de 1918 jusqu’aux années 1930.</p>
                <p>Les sujets circulent librement : éducation, science, environnement, reconstruction rurale, villes, universités, relation entre vie locale et connaissance globale. Cette liberté est essentielle. Aucun des deux ne semble très intéressé par les frontières disciplinaires simplement parce que les institutions les ont dessinées.</p>
                <h2>Ils ne pensaient pas pareil. C’était précisément l’intérêt.</h2>
                <p>Geddes aimait les systèmes, les enquêtes, les schémas et les plans. Tagore se méfiait davantage de ce qui rend le vivant trop propre et trop ordonné. Il voulait une éducation reliée à la nature, à l’intuition, à la culture et au développement intérieur de l’élève. Leur correspondance est intéressante parce qu’elle ne raconte pas l’histoire de deux penseurs identiques découvrant qu’ils sont d’accord.</p>
                <p>Elle raconte comment <strong>la différence peut créer un troisième espace</strong>.</p>
                <div class="pullquote">Une confluence n’est pas un mélange. Deux rivières gardent leur origine — mais créent un nouveau courant lorsqu’elles se rencontrent.<small>Confluence of Minds</small></div>
                <p>En 2017, Bashabi Fraser, Tapati Mukherjee et Amrit Sen ont réuni une partie de leurs textes dans un ouvrage dont le titre résume parfaitement cette idée : <em>A Confluence of Minds: The Rabindranath Tagore and Patrick Geddes Reader on Education and Environment</em>.</p>
                <h2>Pourquoi cette expression fonctionne encore</h2>
                <p>Notre Confluence of Minds n’est évidemment pas la continuation académique de Tagore et Geddes. C’est plutôt un petit écho créatif du même réflexe : <strong>mettre ensemble des choses qui vivent normalement dans des dossiers séparés et regarder ce qui se passe.</strong></p>
                <p>Un jeu de décision de science-fiction sur Titan peut côtoyer un thriller psychologique sur l’auteur et les algorithmes. Un film sans images peut vivre à côté d’explorations de la culture japonaise, de fantasy, de fiction climatique ou d’expériences faites avec l’intelligence artificielle. Les projets n’ont pas besoin d’un même style visuel ni même d’un même médium. Le lien, c’est la collision.</p>
                <p>C’est aussi pour cela que le pluriel compte. Pas un esprit agrandi, mais plusieurs manières de penser qui interfèrent : scientifique et fictionnelle, humaine et machine, sérieuse et ludique, archivistique et spéculative.</p>
                <p>Tagore et Geddes parlaient d’éducation et d’environnement, pas de fiction interactive ou d’IA générative. Mais leur échange porte une intuition toujours utile : la spécialisation nous donne de la profondeur ; <strong>la confluence nous donne des questions inattendues.</strong></p>''',
