              "fr": {
                "title":"Des livres générés par IA avant ChatGPT",
                "desc":"Du roman généré par code à la fiction personnalisée : pourquoi la machine à livres imaginée dans Authentiques Victimes en 2016 paraît beaucoup moins fictive en 2026.",
                "kicker":"Auteur · IA · Littérature",
                "deck":"En 2016, Authentiques Victimes imaginait des bornes produisant des livres à la demande à partir de profils, mots-clés et styles. Le plus étrange n’est pas que l’idée soit devenue plausible. C’est ce qui est arrivé à la notion d’auteur.",
                "read":"6 min de lecture",
                "lead":"Avant que ChatGPT devienne un réflexe quotidien, des machines écrivaient déjà. Ce que presque personne n’avait anticipé, c’est la vitesse à laquelle la littérature automatisée deviendrait une interaction grand public presque banale.",
                "body":'''<p><em>Authentiques Victimes</em> a commencé en 2016. Dans le roman apparaissaient des bornes jaunes <strong>ROBOTIQUES®</strong> : des machines capables de fabriquer des livres à la demande à partir de profils, de mots-clés et de préférences stylistiques. L’idée devait être légèrement inquiétante : un système éditorial où le lecteur peut de plus en plus demander le livre qu’il souhaite au lieu d’attendre qu’un auteur l’écrive.</p>
                <p>Cette idée ne sortait pas de nulle part. La littérature générée par ordinateur est bien plus ancienne que l’IA générative actuelle. Dès 2013, <strong>NaNoGenMo — National Novel Generation Month</strong> — proposait aux programmeurs d’écrire du code capable de générer un roman d’au moins 50 000 mots. Les résultats allaient de l’expérience procédurale à une littérature machine franchement surréaliste.</p>
                <p>Mais ces systèmes produisaient surtout des objets finis. Les grands modèles de langage ont changé la relation : le lecteur peut désormais être à la fois commanditaire, prompteur, éditeur et parfois co-auteur, dans une seule conversation.</p>
                <h2>Le point inconfortable n’est plus la qualité</h2>
                <p>Une étude publiée en 2026 par Sydney Sears et Deena Skolnick Weisberg a montré que les participants jugeaient les nouvelles générées par IA plus absorbantes et de meilleure qualité que les textes humains utilisés dans l’expérience. Dans le même temps, les évaluations s’amélioraient lorsqu’ils croyaient qu’un texte avait été écrit par un humain. Dans les expériences suivantes, les participants ne parvenaient pas de manière fiable à distinguer l’origine humaine ou machine des textes.</p>
                <div class="pullquote">La question glisse de « Une machine peut-elle écrire ? » vers « Qu’est-ce qu’on veut dire quand on affirme que quelqu’un a écrit ceci ? »<small>Confluence of Minds</small></div>
                <p>L’écart entre <strong>qualité perçue</strong> et <strong>authenticité perçue</strong> est plus intéressant qu’un simple match humain contre machine. Nous pouvons apprécier un texte tout en accordant énormément d’importance à celui — ou à ce qui — l’a produit.</p>
                <p>Les recherches sur les usages réels de la fiction générée pointent déjà vers autre chose : les utilisateurs ne demandent pas seulement une histoire terminée. Ils prolongent, remixent et personnalisent des mondes narratifs dans la durée. La frontière entre lecteur et auteur devient instable.</p>
                <h2>Une fiction que le réel a obligée à se relire</h2>
                <p><em>Authentiques Victimes</em> a été entièrement réécrit en 2026, dix ans après son commencement. Cela crée une boucle étrange. Un roman qui imaginait l’écriture machine industrialisée et personnalisée existe désormais dans un monde où le mécanisme de base tient dans un onglet de navigateur.</p>
                <p>La question intéressante du livre n’a jamais été seulement de savoir si un logiciel pouvait produire des phrases. Elle touche à l’auteur, à l’imitation, à la mémoire et à la possibilité qu’un texte original existe déjà sous le nom de quelqu’un d’autre.</p>
                <p>L’IA générative n’a pas résolu ces questions. Elle les a simplement rendues beaucoup moins hypothétiques.</p>''',
                "related_title":"Authentiques Victimes",
                "related_text":"Un thriller psychologique de science-fiction commencé en 2016 et entièrement réécrit en 2026 — après qu’une partie de son postulat a cessé de ressembler à de la science-fiction.",
