                "title":"AI-generated books before ChatGPT",
                "desc":"From code-generated novels to personalized fiction: why a machine-made book imagined in Authentiques Victimes in 2016 feels much less fictional in 2026.",
                "kicker":"Authorship · AI · Literature",
                "deck":"In 2016, Authentiques Victimes imagined kiosks producing books on demand from profiles, keywords and styles. The strange part is not that the idea came true. It is what happened to the idea of an author.",
                "read":"6 min read",
                "lead":"Before ChatGPT became a verb, machines were already writing. The difference is that almost nobody expected automated literature to become a normal consumer interaction quite this quickly.",
                "body":'''<p><em>Authentiques Victimes</em> began in 2016. Inside the novel were yellow <strong>ROBOTIQUES®</strong> kiosks: machines capable of manufacturing books on demand from profiles, keywords and stylistic preferences. At the time, it was deliberately uncanny — a publishing system in which a reader could increasingly request the book they wanted instead of waiting for an author to write it.</p>
                <p>That idea did not emerge in a vacuum. Computer-generated literature is much older than generative AI. In 2013, <strong>NaNoGenMo — National Novel Generation Month</strong> — began challenging programmers to write code that generates a novel of at least 50,000 words. Its output ranged from procedural experiments to surreal machine literature.</p>
                <p>But those systems mostly produced artifacts. Large language models changed the relationship: the reader can now become prompter, editor, commissioner and sometimes co-author, all inside the same conversation.</p>
                <h2>The uncomfortable part is not quality</h2>
                <p>A 2026 study by Sydney Sears and Deena Skolnick Weisberg found that participants rated AI-generated short stories as more absorbing and higher quality than the human-written stories used in the experiment. At the same time, the exact same kind of evaluation improved when people believed a story had been written by a human. In follow-up studies, participants were no better than chance at reliably identifying which stories were machine-generated.</p>
                <div class="pullquote">The question is moving from “Can a machine write?” to “What do we mean when we say somebody wrote this?”<small>Confluence of Minds</small></div>
                <p>That gap between <strong>perceived quality</strong> and <strong>perceived authenticity</strong> is more interesting than a simple human-versus-machine contest. We may enjoy a text and still care deeply about who — or what — made it.</p>
                <p>Research on real-world AI fiction use is already pointing toward another shift: people use conversational models not only to request finished stories, but to repeatedly extend, remix and personalize narrative worlds. The boundary between reader and writer becomes less stable.</p>
                <h2>A fiction that had to be rewritten by reality</h2>
                <p><em>Authentiques Victimes</em> was fully rewritten in 2026, ten years after it began. That creates an odd loop. A novel that imagined industrialized, personalized machine writing now exists in a world where the underlying mechanism has become ordinary enough to fit inside a browser tab.</p>
                <p>The interesting question for the book was never simply whether software could produce sentences. It was about authorship, imitation, memory and the possibility that an original text might already exist under someone else’s name.</p>
                <p>Generative AI has not resolved those questions. It has made them less hypothetical.</p>''',
