              return f'''<!doctype html>
          <html lang="{lang}"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>{title} | Confluence of Minds</title><meta name="description" content="{esc(desc)}" /><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />
            <link rel="canonical" href="{url}" /><link rel="alternate" hreflang="en" href="{ROOT}confluences/" /><link rel="alternate" hreflang="fr" href="{ROOT}fr/confluences/" /><link rel="alternate" hreflang="x-default" href="{ROOT}confluences/" />
            <meta property="og:site_name" content="Confluence of Minds" /><meta property="og:type" content="website" /><meta property="og:url" content="{url}" /><meta property="og:title" content="{esc(title)}" /><meta property="og:description" content="{esc(desc)}" /><meta property="og:image" content="{ROOT}assets/confluence-of-minds-social-preview-v2.jpg" />
            <meta name="twitter:card" content="summary_large_image" /><meta name="twitter:title" content="{esc(title)}" /><meta name="twitter:description" content="{esc(desc)}" /><meta name="twitter:image" content="{ROOT}assets/confluence-of-minds-social-preview-v2.jpg" />
            <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/confluences.css?v=20260808-v1" />
            <script type="application/ld+json">{schema}</script></head>
          <body><div class="grain" aria-hidden="true"></div><header class="editorial-top"><a class="editorial-brand" href="{home_url}">CONFLUENCE OF MINDS</a><nav class="editorial-nav"><a href="{home_url}#worlds">{'Worlds' if lang=='en' else 'Univers'}</a><a class="lang" href="{alt}">{alt_label}</a></nav></header>
          <main><section class="collection-hero"><p class="eyebrow">CONFLUENCES · EDITORIAL FIELD NOTES</p><h1>{heading}</h1><p>{intro}</p></section><section class="collection-grid">{''.join(cards)}</section></main>
          <footer class="editorial-footer"><span>© 2026 Confluence of Minds</span><span>{'Ideas · origins · experiments · unexpected connections' if lang=='en' else 'Idées · origines · expériences · connexions inattendues'}</span></footer></body></html>'''

          # Write styles and editorial pages.
          Path('confluences-home.css').write_text(home_css, encoding='utf-8')
          Path('confluences.css').write_text(editorial_css, encoding='utf-8')
          Path('confluences').mkdir(exist_ok=True)
          Path('fr/confluences').mkdir(parents=True, exist_ok=True)
          Path('confluences/index.html').write_text(collection_page('en'), encoding='utf-8')
          Path('fr/confluences/index.html').write_text(collection_page('fr'), encoding='utf-8')
          for i, slug in enumerate(order):
              next_slug = order[(i+1)%len(order)]
              Path('confluences', slug).mkdir(parents=True, exist_ok=True)
              Path('fr/confluences', slug).mkdir(parents=True, exist_ok=True)
              Path('confluences', slug, 'index.html').write_text(article_page(slug,'en',articles[slug]['en'],articles[slug]['class'],next_slug), encoding='utf-8')
              Path('fr/confluences', slug, 'index.html').write_text(article_page(slug,'fr',articles[slug]['fr'],articles[slug]['class'],next_slug), encoding='utf-8')

          # Homepage blocks.
          def home_block(lang):
              fr = lang == 'fr'
              prefix = '/fr' if fr else ''
              cards = [
                ("tagore", "CONFLUENCE 001 · " + ("Origines" if fr else "Origins"), "Pourquoi Confluence of Minds ?" if fr else "Why Confluence of Minds?", "Tagore, Geddes et l’étrange origine d’un nom devenu univers créatif." if fr else "Tagore, Geddes and the strange origin of a name that became a creative universe.", "why-confluence-of-minds"),
                ("ai", "CONFLUENCE 002 · IA + LITTÉRATURE" if fr else "CONFLUENCE 002 · AI + LITERATURE", "Des livres générés par IA avant ChatGPT" if fr else "AI-generated books before ChatGPT", "En 2016, Authentiques Victimes imaginait déjà la littérature personnalisée par machine." if fr else "In 2016, Authentiques Victimes was already imagining personalized machine-made literature.", "ai-generated-books-before-chatgpt"),
                ("sound", "CONFLUENCE 003 · SON + CINÉMA" if fr else "CONFLUENCE 003 · SOUND + CINEMA", "Un film peut-il exister sans images ?" if fr else "Can a movie exist without images?", "SILMEA, Radio France et les expériences où l’image se déplace dans la tête de l’auditeur." if fr else "SILMEA, Radio France and experiments where the image moves into the listener’s head.", "can-a-film-exist-without-images"),
              ]
              html_cards = []
              for cls, meta, title, desc, slug in cards:
                  html_cards.append(f'''<a class="confluence-card" href="{prefix}/confluences/{slug}/"><div class="confluence-card__visual confluence-card__visual--{cls}"><span class="confluence-card__stamp">{meta}</span></div><div class="confluence-card__body"><p class="confluence-card__meta">{meta}</p><h3>{title}</h3><p>{desc}</p><span class="confluence-card__cta">{'Lire' if fr else 'Read'} <b>↗</b></span></div></a>''')
              return f'''    <!-- CONFLUENCES HOME START -->
              <section id="confluences" class="confluences-home" aria-labelledby="confluences-title">
                <div class="confluences-home__head"><div><p class="confluences-home__label">{'Idées sous les mondes' if fr else 'Ideas beneath the worlds'}</p><h2 id="confluences-title">Confluences</h2></div><p class="confluences-home__intro">{'Des essais courts sur les origines, la science, la culture, la technologie et les connexions inattendues derrière nos projets.' if fr else 'Short essays on origins, science, culture, technology and the unexpected connections behind our projects.'}</p></div>
                <div class="confluences-grid">{''.join(html_cards)}</div>
                <div class="confluences-home__all"><a href="{prefix}/confluences/">{'Explorer toutes les Confluences' if fr else 'Explore all Confluences'} <span>→</span></a></div>
              </section>
              <!-- CONFLUENCES HOME END -->'''

          def patch_home(path, lang):
              html = Path(path).read_text(encoding='utf-8')
              # Stylesheet.
              if 'confluences-home.css' not in html:
                  html = html.replace('</head>', '  <link rel="stylesheet" href="/confluences-home.css?v=20260808-v1" />\n</head>', 1)
              # Nav item.
              if 'href="#confluences"' not in html:
                  html = html.replace('<a href="#about">', '<a href="#confluences">Confluences</a>\n      <a href="#about">', 1)
              # Replace/add block directly after the About section, before closing main.
              block = home_block(lang)
              pattern = r'\s*<!-- CONFLUENCES HOME START -->.*?<!-- CONFLUENCES HOME END -->'
              if re.search(pattern, html, flags=re.S):
                  html = re.sub(pattern, '\n' + block, html, count=1, flags=re.S)
              else:
                  marker = '\n  </main>\n\n  <footer'
                  if marker not in html:
                      raise SystemExit(f'Could not find homepage insertion point in {path}')
                  html = html.replace(marker, '\n' + block + marker, 1)
              Path(path).write_text(html, encoding='utf-8')

          patch_home('index.html','en')
          patch_home('fr/index.html','fr')

          # Sitemap: preserve existing URLs, add the editorial layer.
          sitemap_path = Path('sitemap.xml')
          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = {'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          existing = {el.text for el in root.findall('sm:url/sm:loc', ns)}
          urls = [ROOT+'confluences/', ROOT+'fr/confluences/']
          for slug in order:
              urls += [ROOT+'confluences/'+slug+'/', ROOT+'fr/confluences/'+slug+'/']
          ET.register_namespace('', 'http://www.sitemaps.org/schemas/sitemap/0.9')
          for url in urls:
              if url in existing: continue
              u = ET.SubElement(root, '{http://www.sitemaps.org/schemas/sitemap/0.9}url')
              ET.SubElement(u, '{http://www.sitemaps.org/schemas/sitemap/0.9}loc').text = url
              ET.SubElement(u, '{http://www.sitemaps.org/schemas/sitemap/0.9}lastmod').text = DATE
          tree.write(sitemap_path, encoding='utf-8', xml_declaration=True)

          # Validate JSON-LD and key architecture.
          pages = [Path('confluences/index.html'), Path('fr/confluences/index.html')]
          for slug in order:
              pages += [Path('confluences',slug,'index.html'), Path('fr/confluences',slug,'index.html')]
          for p in pages:
              text = p.read_text(encoding='utf-8')
              assert '<link rel="canonical"' in text and 'hreflang="fr"' in text and 'hreflang="en"' in text
              for raw in re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, flags=re.S):
                  json.loads(raw)
          ET.parse('sitemap.xml')
          root_home = Path('index.html').read_text(encoding='utf-8')
          fr_home = Path('fr/index.html').read_text(encoding='utf-8')
          assert root_home.count('CONFLUENCES HOME START') == 1
          assert fr_home.count('CONFLUENCES HOME START') == 1
          assert '/confluences/why-confluence-of-minds/' in root_home
          assert '/fr/confluences/why-confluence-of-minds/' in fr_home
          assert 'https://nanogenmo.github.io/' in Path('confluences/ai-generated-books-before-chatgpt/index.html').read_text(encoding='utf-8')
          PY

      - name: Commit Confluences editorial layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fr/index.html sitemap.xml confluences-home.css confluences.css confluences fr/confluences
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Launch Confluences editorial section with three essays"
          git push
