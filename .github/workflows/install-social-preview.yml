name: Install social sharing preview

on:
  push:
    paths:
      - '.github/workflows/install-social-preview.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Render Open Graph image
        run: |
          rsvg-convert -w 1200 -h 630 assets/confluence-of-minds-social-preview.svg -o /tmp/confluence-social.png
          convert /tmp/confluence-social.png -strip -quality 86 assets/confluence-of-minds-social-preview-v1.jpg
          identify assets/confluence-of-minds-social-preview-v1.jpg
          test "$(identify -format '%wx%h' assets/confluence-of-minds-social-preview-v1.jpg)" = "1200x630"

      - name: Add Open Graph and Twitter metadata
        run: python3 scripts/install_social_preview.py

      - name: Commit public preview and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/install-social-preview.yml scripts/install_social_preview.py
          git add index.html assets/confluence-of-minds-social-preview.svg assets/confluence-of-minds-social-preview-v1.jpg .github/workflows/install-social-preview.yml scripts/install_social_preview.py
          git commit -m 'Add social sharing image and Open Graph metadata'
          git push
