name: Check RALUVAAA Experience V44

on:
  push:
    paths:
      - 'raluvaaa/solo-experience-v44/**'
      - '.github/workflows/check-raluvaaa-experience-v44.yml'
  workflow_dispatch:

concurrency:
  group: raluvaaa-experience-v44-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          node --check raluvaaa/solo-experience-v44/features-v44.js
          node --check raluvaaa/solo-experience-v44/qa-v44.cjs
          grep -q 'data-feature-version="44"' raluvaaa/solo-experience-v44/index.html
          grep -q "raluvaaaSoloExperienceV44R1" raluvaaa/solo-experience-v44/index.html
          grep -q 'features-v44.js' raluvaaa/solo-experience-v44/index.html
          grep -q 'features-v44.css' raluvaaa/solo-experience-v44/index.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run V44 QC
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/raluvaaa-v44-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          sleep 2
          node raluvaaa/solo-experience-v44/qa-v44.cjs
