name: Apply supplied header logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-header-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace header logo only
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/apply-logo.py
          python /tmp/apply-logo.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Use supplied Confluence logo in header"
          git push
