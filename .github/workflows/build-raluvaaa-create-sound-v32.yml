name: Build V32 creation sound asset

on:
  push:
    paths:
      - '.github/workflows/build-raluvaaa-create-sound-v32.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded CREATE sound and convert for Safari
        run: |
          set -e
          mkdir -p raluvaaa/solo-experience-v32
          python3 - <<'PY'
          import base64,re,pathlib
          s=pathlib.Path('raluvaaa/solo-experience-v31/create-sound-v31.js').read_text()
          m=re.search(r"data:audio/ogg;base64,([^']+)",s)
          if not m:
              raise SystemExit('embedded V31 create sound not found')
          data=m.group(1); data += '='*((4-len(data)%4)%4); pathlib.Path('/tmp/create-a-wish.ogg').write_bytes(base64.b64decode(data))
          PY
          ffmpeg -y -i /tmp/create-a-wish.ogg -ac 1 -ar 44100 -b:a 128k raluvaaa/solo-experience-v32/create-a-wish.mp3
          file raluvaaa/solo-experience-v32/create-a-wish.mp3
      - name: Commit static audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raluvaaa/solo-experience-v32/create-a-wish.mp3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Safari-compatible V32 creation sound"
          git push
