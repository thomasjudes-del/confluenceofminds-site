name: Prepare RALUVAAA V45 share assets

on:
  push:
    paths:
      - 'raluvaaa/solo-experience-v45/generate-share-assets.py'
      - '.github/workflows/prepare-raluvaaa-v45-share-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raluvaaa-v45-share-assets
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          pip install --quiet pillow numpy
      - name: Generate five share templates
        run: python raluvaaa/solo-experience-v45/generate-share-assets.py
      - name: Verify MP4 audio and assets
        run: |
          set -e
          for i in 1 2 3 4 5; do
            test -s "raluvaaa/solo-experience-v45/share-assets/template-$i.mp4"
            test -s "raluvaaa/solo-experience-v45/share-assets/poster-$i.png"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "raluvaaa/solo-experience-v45/share-assets/template-$i.mp4" | grep -q aac
          done
      - name: Commit generated share assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raluvaaa/solo-experience-v45/share-assets/
          git diff --cached --quiet && exit 0
          git commit -m 'RALUVAAA V45: add five prebuilt share videos and posters'
          git push
