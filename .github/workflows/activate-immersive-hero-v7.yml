name: Activate immersive hero V7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-immersive-hero-v7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh hero assets and clean deployment files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html, count = re.subn(
              r'<script src="script\.js(?:\?[^\"]*)?"></script>',
              '<script src="script.js?v=20260805-hero-v7"></script>',
              html,
              count=1,
          )
          if count != 1:
              raise SystemExit('script.js reference not found exactly once')

          preload = '<link rel="preload" as="image" href="assets/confluence-hero-organic.png?v=20260805-hero-v7">'
          if preload not in html:
              html = html.replace('</head>', f'  {preload}\n</head>', 1)

          path.write_text(html, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .deploy/hero-v7.part* \
            .github/workflows/install-immersive-hero-v7.yml \
            .github/workflows/activate-immersive-hero-v7.yml
          git commit -m "Activate immersive hero and clean deployment files"
          git push
