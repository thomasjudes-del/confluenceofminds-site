name: Fix header logo direct

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-header-logo-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point header directly to PNG
        shell: bash
        run: |
          sed -i 's#assets/confluence-logo.svg#assets/confluence-logo.png?v=3#' index.html
          grep -F 'assets/confluence-logo.png?v=3' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Point header directly to supplied logo PNG"
          git push
