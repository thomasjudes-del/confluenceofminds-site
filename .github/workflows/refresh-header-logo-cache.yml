name: Refresh header logo cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-header-logo-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh logo URL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r'assets/confluence-logo\.png(?:\?v=[^\"]*)?', 'assets/confluence-logo.png?v=20260805-1029', s, count=1)
          if n != 1:
              raise SystemExit('logo reference not found exactly once')
          p.write_text(s2, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh transparent header logo cache key"
          git push
