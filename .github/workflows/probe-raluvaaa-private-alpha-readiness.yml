name: Probe RALUVAAA Private Alpha deployment readiness

on:
  push:
    paths:
      - '.github/workflows/probe-raluvaaa-private-alpha-readiness.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_CODE_SECRET: ${{ secrets.RALUVAAA_AUTH_CODE_SECRET }}
          RALUVAAA_EMAIL_FROM: ${{ secrets.RALUVAAA_EMAIL_FROM }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY AUTH_CODE_SECRET RALUVAAA_EMAIL_FROM; do
            eval "value=\${$name}"
            if [ -n "$value" ]; then
              echo "$name: configured"
            else
              echo "$name: MISSING"
              missing=1
            fi
          done
          exit "$missing"
