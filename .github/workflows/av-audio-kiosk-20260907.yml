name: AV kiosk and audio enhancements

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/av-audio-kiosk-20260907.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enhance Authentiques Victimes
        shell: bash
        run: |
          set -euo pipefail
          cat > authentiques-victimes/av-enhancements.css <<'CSS'
          .kiosk{position:relative}
          .kiosk-expand{position:absolute;z-index:8;right:14px;top:14px;width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(23,21,4,.35);border-radius:50%;background:rgba(255,245,188,.78);color:#171504;cursor:pointer;font:700 20px/1 var(--sans);backdrop-filter:blur(8px);box-shadow:0 5px 18px rgba(0,0,0,.16)}
          .kiosk-expand:hover{background:#fff3a3}.kiosk-expand svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
          body.kiosk-fullscreen{overflow:hidden}.kiosk-stage.is-fullscreen{position:fixed;z-index:2147483000;inset:0;margin:0;padding:clamp(12px,2vw,30px);display:grid;place-items:center;background:rgba(3,5,4,.94);backdrop-filter:blur(12px);perspective:none}.kiosk-stage.is-fullscreen .kiosk{width:min(1180px,96vw);height:min(94svh,980px);padding:22px 25px 34px;transform:none}.kiosk-stage.is-fullscreen .kiosk__screen{height:calc(100% - 145px);min-height:430px}.kiosk-stage.is-fullscreen .receipt{display:none}.kiosk-stage.is-fullscreen .kiosk-expand{position:fixed;right:22px;top:22px;background:#f7db43}
          .av-audio{padding:clamp(78px,9vw,125px) clamp(20px,7vw,108px);background:#090d0f;color:#f3f0e9}.av-audio__head{width:min(1120px,100%);margin:0 auto 38px}.av-audio__head h2{margin:0;font:500 clamp(43px,5vw,72px)/.96 var(--serif);letter-spacing:-.035em}.av-audio__head>p:last-child{max-width:760px;margin:17px 0 0;font:500 clamp(18px,1.5vw,23px)/1.45 var(--serif);color:#aeb5b3}.av-episodes{width:min(1120px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.av-episode{position:relative;min-height:190px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-decoration:none;border:1px solid rgba(255,255,255,.12);background:#111719}.av-episode:before{content:"";position:absolute;inset:0;background-image:linear-gradient(0deg,rgba(4,7,8,.96),rgba(4,7,8,.12) 78%),url('assets/av-hero-hq.webp');background-size:cover;background-position:center;filter:saturate(.2);transition:.3s ease}.av-episode>*{position:relative;z-index:1}.av-episode:hover:before{transform:scale(1.035);filter:saturate(.65)}.av-episode__n{font:600 9px/1 var(--mono);letter-spacing:.15em;color:#1ed760}.av-episode strong{margin-top:9px;font:500 22px/1.05 var(--serif)}.av-episode small{margin-top:10px;font:500 8px/1 var(--mono);letter-spacing:.12em;color:#b7bfbc}.silmea-more{width:min(1120px,100%);margin:30px auto 0;padding-top:26px;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between;gap:20px}.silmea-more p{margin:0;font:500 clamp(18px,1.5vw,23px)/1.4 var(--serif);color:#c3c9c7}.silmea-more a{flex:none;text-decoration:none;padding:13px 17px;border:1px solid rgba(255,255,255,.28);font:600 9px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase}
          @media(max-width:900px){.av-episodes{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:640px){.kiosk-expand{right:9px;top:9px;width:38px;height:38px}.kiosk-stage.is-fullscreen{padding:8px}.kiosk-stage.is-fullscreen .kiosk{width:100%;height:96svh;padding:18px 13px 25px}.kiosk-stage.is-fullscreen .kiosk__head{padding-right:35px}.kiosk-stage.is-fullscreen .kiosk__screen{height:calc(100% - 125px);min-height:0}.av-audio{padding-left:18px;padding-right:18px}.av-episodes{grid-template-columns:1fr 1fr;gap:9px}.av-episode{min-height:150px;padding:13px}.av-episode strong{font-size:19px}.silmea-more{display:block}.silmea-more a{display:inline-flex;margin-top:18px}}
          CSS

          cat > authentiques-victimes/av-enhancements.js <<'JS'
          (() => {
            const fragments = document.querySelector('.fragments__field');
            if (fragments) {
              const walker = document.createTreeWalker(fragments, NodeFilter.SHOW_TEXT);
              const bad = [];
              while (walker.nextNode()) {
                if (/^[\s\uFFFD❓?]+$/.test(walker.currentNode.nodeValue || '')) bad.push(walker.currentNode);
              }
              bad.forEach(node => node.remove());
              fragments.querySelectorAll('img,span,i').forEach(el => {
                const t = (el.textContent || '').trim();
                const alt = (el.getAttribute('alt') || '').trim();
                if (['?', '❓', '�'].includes(t) || ['?', '❓', '�'].includes(alt)) el.remove();
              });
            }

            const stage = document.querySelector('.kiosk-stage');
            const kiosk = stage?.querySelector('.kiosk');
            if (stage && kiosk && !kiosk.querySelector('.kiosk-expand')) {
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'kiosk-expand';
              button.setAttribute('aria-label', 'Agrandir le kiosque Robotiques');
              button.setAttribute('aria-pressed', 'false');
              button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
              kiosk.appendChild(button);
              const toggle = () => {
                const open = stage.classList.toggle('is-fullscreen');
                document.body.classList.toggle('kiosk-fullscreen', open);
                button.setAttribute('aria-pressed', String(open));
                button.setAttribute('aria-label', open ? 'Réduire le kiosque Robotiques' : 'Agrandir le kiosque Robotiques');
              };
              button.addEventListener('click', toggle);
              document.addEventListener('keydown', e => { if (e.key === 'Escape' && stage.classList.contains('is-fullscreen')) toggle(); });
            }
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          p = Path('authentiques-victimes/index.html')
          s = p.read_text(encoding='utf-8')
          css = '  <link rel="stylesheet" href="av-enhancements.css?v=20260907-v1" />\n'
          js = '  <script src="av-enhancements.js?v=20260907-v1"></script>\n'
          if 'av-enhancements.css' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          if 'av-enhancements.js' not in s:
              s = s.replace('</body>', js + '</body>', 1)

          if 'id="audio-av"' not in s:
              episodes = [
                  (1,'3szeCGxTper27FYj7WUKb1'),(2,'2wSna6CibJymt7oJIC5WRE'),(3,'5wJb9hMdHDbfDr8Thvjaag'),
                  (4,'5RkgjklhQBtsWpyPG9KTlq'),(5,'6Npd3mF3DpCo2hVYY7Eoqi'),(6,'5V8Nl28tqg0AlSwSDQ5arS'),
                  (7,'4Da0KfTKhibPPptRj6y2mm'),(8,'1EIQDcS4G5BTn8BehzrkfG'),(9,'5gjMqQvkIq81tGmfPsjAwM'),
                  (10,'2BjdErtHUTC3To9ROB8LJC'),(11,'7oiFEf7UBEGzf8M5Km0tfs')]
              cards = ''.join(f'''<a class="av-episode" href="https://open.spotify.com/episode/{eid}" target="_blank" rel="noopener"><span class="av-episode__n">CHAPITRE {n:02d}</span><strong>Authentiques Victimes</strong><small>ÉCOUTER SUR SPOTIFY ↗</small></a>''' for n,eid in episodes)
              block = f'''
    <section class="av-audio" id="audio-av" aria-labelledby="audio-av-title">
      <div class="av-audio__head reveal">
        <p class="section-index">05 / FICTION SONORE · SILMEA</p>
        <h2 id="audio-av-title">Les 11 chapitres audio</h2>
        <p>Retrouvez l’adaptation sonore originale d’<em>Authentiques Victimes</em>, chapitre par chapitre.</p>
      </div>
      <div class="av-episodes reveal">{cards}</div>
      <div class="silmea-more reveal"><p>Et pour explorer les autres créations sonores de SILMEA :</p><a href="https://smartlink.ausha.co/creations-silmea" target="_blank" rel="noopener">Créations SILMEA · Ausha ↗</a></div>
    </section>
'''
              marker = '  </main>'
              if marker not in s:
                  raise SystemExit('main closing marker missing')
              s = s.replace(marker, block + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'id="audio-av"' authentiques-victimes/index.html
          grep -q 'av-enhancements.css' authentiques-victimes/index.html
          grep -q '7oiFEf7UBEGzf8M5Km0tfs' authentiques-victimes/index.html
          grep -q 'smartlink.ausha.co/creations-silmea' authentiques-victimes/index.html

      - name: Commit AV enhancements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authentiques-victimes/index.html authentiques-victimes/av-enhancements.css authentiques-victimes/av-enhancements.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Improve AV kiosk reading and add complete audio edition"
          git push
