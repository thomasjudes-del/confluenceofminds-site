name: Clean homepage language routing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-home-language-routing-20260808.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep root English and French route French
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('i18n.js')
          s = p.read_text(encoding='utf-8')
          pattern = r'''  function initialLanguage\(\) \{.*?\n  \}\n\n  createSwitcher\(\);'''
          replacement = '''  function initialLanguage() {
            const path = window.location.pathname.replace(/index\\.html$/, '');
            return path === '/fr/' ? 'fr' : 'en';
          }

          createSwitcher();'''
          updated, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('initialLanguage block not found exactly once')
          p.write_text(updated, encoding='utf-8')
          assert "return path === '/fr/' ? 'fr' : 'en';" in updated
          PY
      - name: Commit routing cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep homepage language aligned with canonical routes"
          git push
