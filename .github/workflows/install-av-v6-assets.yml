name: Install AV V6 assets
on:
  push:
    branches: [main]
    paths:
      - '.av-assets/**'
      - '.github/workflows/install-av-v6-assets.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode AV assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authentiques-victimes/assets
          cat .av-assets/hero-* | base64 --decode > authentiques-victimes/assets/av-hero-hq.webp
          cat .av-assets/plag-* | base64 --decode > authentiques-victimes/assets/av-plagiarism-hq.webp
          rm -rf .av-assets
          rm -f .github/workflows/install-av-v6-assets.yml
      - name: Commit assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install AV V6 HQ assets"
          git push origin main
