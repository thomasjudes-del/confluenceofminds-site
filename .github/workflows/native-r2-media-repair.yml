name: Validate and install native R2 videos

on:
  push:
    paths:
      - '.github/workflows/native-r2-media-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate both R2 videos
        shell: bash
        run: |
          set -euo pipefail
          ABOUT_URL='https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/confluence-portal-1080.mp4.mp4'
          TITAN_URL='https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/incident-on-titan-preview.mp4.mp4'
          curl --fail --location --retry 3 --output /tmp/about.mp4 "$ABOUT_URL"
          curl --fail --location --retry 3 --output /tmp/titan.mp4 "$TITAN_URL"
          test "$(stat -c%s /tmp/about.mp4)" -gt 500000
          test "$(stat -c%s /tmp/titan.mp4)" -gt 1000000
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          echo 'ABOUT VIDEO'
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -show_entries format=duration,size,format_name -of default=noprint_wrappers=1 /tmp/about.mp4
          echo 'TITAN VIDEO'
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -show_entries format=duration,size,format_name -of default=noprint_wrappers=1 /tmp/titan.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/about.mp4)" = 'h264'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/titan.mp4)" = 'h264'

      - name: Replace fragile media integrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '20260806-native-v1'
          base = 'https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev'
          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          titan = f'''        <article class="world-card world-card--titan world-card--native reveal" data-portal="Incident on Titan" data-media-container>
          <a class="world-card__link" href="/titan/" aria-label="Enter Incident on Titan">
            <div class="world-cover">
              <img class="world-card__poster" src="assets/titan-poster-mobile.jpg?v={version}" alt="" aria-hidden="true" />
              <video class="world-card__preview" data-viewport-video autoplay muted loop playsinline preload="auto" poster="assets/titan-poster-mobile.jpg?v={version}" aria-hidden="true">
                <source src="{base}/incident-on-titan-preview.mp4.mp4" type="video/mp4" />
              </video>
              <span class="world-card__scrim" aria-hidden="true"></span>
              <div class="world-card__body">
                <h3>Incident on Titan</h3>
                <p>A weekly collaborative science-fiction game. Choose a role, face a shared incident, and protect the colony while Sybille keeps part of the score hidden.</p>
                <span class="world-card__cta">Enter Titan <span aria-hidden="true">↗</span></span>
              </div>
            </div>
          </a>
        </article>'''

          html, count = re.subn(
              r'\s*<article class="world-card world-card--titan\b.*?</article>',
              '\n' + titan,
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f'Titan card replacement count: {count}')

          about = f'''    <section id="about" class="about about--video about--native" aria-labelledby="about-title" data-media-container>
      <img class="about__poster" src="assets/about-poster-mobile.jpg?v={version}" alt="" aria-hidden="true" />
      <video class="about__background" data-viewport-video autoplay muted loop playsinline preload="auto" poster="assets/about-poster-mobile.jpg?v={version}" aria-hidden="true">
        <source src="{base}/confluence-portal-1080.mp4.mp4" type="video/mp4" />
      </video>
      <div class="about__veil" aria-hidden="true"></div>
      <div class="about-copy reveal">
        <p class="section-label">Different doors. One universe.</p>
        <h2 id="about-title">Come for one world.<br />Get lost in a universe.</h2>
        <p>Confluence of Minds brings together stories, games, visual series and sound worlds that were never meant to look alike. Each one opens its own door; together, they form a territory still expanding.</p>
      </div>
    </section>'''

          html, count = re.subn(
              r'\s*<section id="about" class="about about--video".*?</section>',
              '\n' + about,
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f'About replacement count: {count}')

          html = re.sub(r'\n\s*<link rel="stylesheet" href="cards-streaming-v1\.css[^"]*"\s*/>', '', html)
          html = re.sub(r'\n\s*<link rel="stylesheet" href="mobile-media-v3\.css[^"]*"\s*/>', '', html)
          html = re.sub(r'\n\s*<link rel="stylesheet" href="native-media-v4\.css[^"]*"\s*/>', '', html)
          html = re.sub(
              r'(<link rel="stylesheet" href="styles\.css[^"]*"\s*/>)',
              rf'\1\n  <link rel="stylesheet" href="native-media-v4.css?v={version}" />',
              html,
              count=1,
          )

          html = re.sub(r'\n\s*<script src="cards-streaming-v1\.js[^"]*"></script>', '', html)
          html = re.sub(r'\n\s*<script src="mobile-media-v3\.js[^"]*"></script>', '', html)
          html = re.sub(r'\n\s*<script src="native-media-v4\.js[^"]*"></script>', '', html)
          html = html.replace('</body>', f'  <script src="native-media-v4.js?v={version}"></script>\n</body>')
          html_path.write_text(html, encoding='utf-8')

          Path('native-media-v4.css').write_text(r'''/* Native, poster-backed video implementation. */
          .world-grid {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 28px !important;
          }

          .world-card__meta { display: none !important; }

          .world-card--native {
            position: relative !important;
            display: block !important;
            width: 100% !important;
            min-height: 0 !important;
            aspect-ratio: 16 / 9 !important;
            overflow: hidden !important;
            border-radius: 18px !important;
            background: #080d12 !important;
            isolation: isolate;
          }

          .world-card--native .world-card__link,
          .world-card--native .world-cover {
            position: relative !important;
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            color: inherit !important;
            text-decoration: none !important;
          }

          .world-card--native .world-card__poster,
          .world-card--native .world-card__preview {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            object-position: center !important;
          }

          .world-card--native .world-card__poster { z-index: 0 !important; }
          .world-card--native .world-card__preview {
            z-index: 1 !important;
            opacity: 0 !important;
            transition: opacity .25s ease, transform 1.2s ease !important;
            transform: scale(1.01);
          }
          .world-card--native.is-media-playing .world-card__preview {
            opacity: 1 !important;
            transform: scale(1.04);
          }

          .world-card--native .world-card__scrim {
            position: absolute !important;
            inset: 0 !important;
            z-index: 2 !important;
            background: linear-gradient(180deg, transparent 28%, rgba(3,7,10,.14) 50%, rgba(3,7,10,.9) 100%) !important;
            pointer-events: none !important;
          }

          .world-card--native .world-card__body {
            position: absolute !important;
            inset: auto 0 0 !important;
            z-index: 3 !important;
            display: block !important;
            min-height: 0 !important;
            padding: 24px 25px 22px !important;
            color: #fff !important;
            background: transparent !important;
            text-shadow: 0 2px 18px rgba(0,0,0,.52);
          }

          .world-card--native h3 {
            margin: 0 !important;
            color: #fff !important;
            font-size: clamp(32px, 3vw, 50px) !important;
            line-height: .98 !important;
          }

          .world-card--native p {
            display: -webkit-box !important;
            overflow: hidden !important;
            -webkit-box-orient: vertical !important;
            -webkit-line-clamp: 2 !important;
            max-width: 62ch !important;
            margin: 10px 0 14px !important;
            color: rgba(255,255,255,.87) !important;
            font-size: 14px !important;
            line-height: 1.43 !important;
          }

          .world-card__cta {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding-top: 12px !important;
            border-top: 1px solid rgba(255,255,255,.3) !important;
            color: #fff !important;
            font-family: var(--sans) !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            letter-spacing: .08em !important;
            text-transform: uppercase !important;
          }

          .about--native {
            position: relative !important;
            min-height: 82vh !important;
            overflow: hidden !important;
            display: flex !important;
            align-items: center !important;
            background: #101817 !important;
          }

          .about--native .about__poster,
          .about--native .about__background {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            object-position: center !important;
          }

          .about--native .about__poster { z-index: 0 !important; }
          .about--native .about__background {
            z-index: 1 !important;
            opacity: 0 !important;
            transition: opacity .25s ease !important;
          }
          .about--native.is-media-playing .about__background { opacity: 1 !important; }
          .about--native .about__veil { z-index: 2 !important; }
          .about--native .about-copy { position: relative !important; z-index: 3 !important; }

          @media (max-width: 760px) {
            .hero-sequence { height: auto !important; min-height: 0 !important; }
            .hero-sticky {
              position: relative !important;
              top: auto !important;
              height: auto !important;
              min-height: 0 !important;
              display: block !important;
              padding: 104px 24px 42px !important;
              overflow: hidden !important;
            }
            .hero-copy { max-width: 100% !important; opacity: 1 !important; transform: none !important; }
            .hero-copy h1 { max-width: 100% !important; font-size: clamp(46px, 13vw, 64px) !important; line-height: .91 !important; }
            .hero-lede { max-width: 100% !important; margin-top: 20px !important; font-size: 16px !important; line-height: 1.42 !important; }
            .hero-art.hero-art--immersive { position: relative !important; inset: auto !important; width: min(88vw, 480px) !important; margin: 22px auto 0 !important; transform: none !important; opacity: 1 !important; }
            .hero-art__image--echo, .hero-paper, .hero-orbit, .hero-cosmos, .hero-starfield, .hero-void, .scroll-cue { display: none !important; }
            .world-grid { grid-template-columns: 1fr !important; gap: 20px !important; }
            .world-card--native { aspect-ratio: 16 / 9 !important; border-radius: 14px !important; }
            .world-card--native .world-card__body { padding: 16px 17px 14px !important; }
            .world-card--native h3 { font-size: clamp(26px, 7.4vw, 34px) !important; }
            .world-card--native p { margin: 6px 0 8px !important; font-size: 11.5px !important; line-height: 1.34 !important; }
            .world-card__cta { padding-top: 8px !important; font-size: 10px !important; }
            .about--native { min-height: 78svh !important; padding: 82px 24px 58px !important; }
            .about--native h2 { font-size: clamp(50px, 14vw, 68px) !important; line-height: .92 !important; }
          }
          ''', encoding='utf-8')

          Path('native-media-v4.js').write_text(r'''(() => {
            const videos = [...document.querySelectorAll('[data-viewport-video]')];
            if (!videos.length) return;

            const containerFor = (video) => video.closest('[data-media-container]') || video.parentElement;

            const prepare = (video) => {
              video.muted = true;
              video.defaultMuted = true;
              video.loop = true;
              video.playsInline = true;
              video.autoplay = true;
              video.preload = 'auto';
              video.setAttribute('muted', '');
              video.setAttribute('autoplay', '');
              video.setAttribute('playsinline', '');
              video.setAttribute('webkit-playsinline', '');
              video.setAttribute('disablepictureinpicture', '');
            };

            const play = (video) => {
              prepare(video);
              const result = video.play();
              if (result?.catch) result.catch(() => {});
            };

            const pause = (video) => {
              video.pause();
              containerFor(video)?.classList.remove('is-media-playing');
            };

            videos.forEach((video) => {
              prepare(video);
              const container = containerFor(video);
              video.addEventListener('playing', () => container?.classList.add('is-media-playing'));
              video.addEventListener('pause', () => container?.classList.remove('is-media-playing'));
              video.addEventListener('ended', () => container?.classList.remove('is-media-playing'));
              video.addEventListener('error', () => container?.classList.remove('is-media-playing'));
            });

            const observer = new IntersectionObserver((entries) => {
              entries.forEach((entry) => {
                const video = entry.target.querySelector?.('[data-viewport-video]') || entry.target;
                if (!(video instanceof HTMLVideoElement)) return;
                if (entry.isIntersecting && entry.intersectionRatio > .01) play(video);
                else pause(video);
              });
            }, { threshold: [0, .01, .1, .25], rootMargin: '320px 0px 320px 0px' });

            videos.forEach((video) => observer.observe(containerFor(video)));

            const retryVisible = () => {
              videos.forEach((video) => {
                const rect = containerFor(video).getBoundingClientRect();
                if (rect.bottom > -320 && rect.top < window.innerHeight + 320) play(video);
              });
            };

            requestAnimationFrame(retryVisible);
            window.addEventListener('pageshow', retryVisible);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) retryVisible(); });
            window.addEventListener('pointerdown', retryVisible, { once: true, passive: true });
            window.addEventListener('touchstart', retryVisible, { once: true, passive: true });
            window.addEventListener('keydown', retryVisible, { once: true });
          })();
          ''', encoding='utf-8')
          PY

      - name: Commit repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/native-r2-media-repair.yml
          git add index.html native-media-v4.css native-media-v4.js .github/workflows/native-r2-media-repair.yml
          git commit -m 'Use validated native R2 videos'
          git push
