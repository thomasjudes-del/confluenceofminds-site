name: Validate and install native R2 videos

on:
  push:
    paths:
      - '.github/workflows/native-r2-media-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate both R2 videos
        shell: bash
        run: |
          set -euo pipefail
          ABOUT_URL='https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/confluence-portal-1080.mp4.mp4'
          TITAN_URL='https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/incident-on-titan-preview.mp4.mp4'
          curl --fail --location --retry 3 --output /tmp/about.mp4 "$ABOUT_URL"
          curl --fail --location --retry 3 --output /tmp/titan.mp4 "$TITAN_URL"
          test "$(stat -c%s /tmp/about.mp4)" -gt 500000
          test "$(stat -c%s /tmp/titan.mp4)" -gt 1000000
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          echo 'ABOUT VIDEO'
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -show_entries format=duration,size,format_name -of default=noprint_wrappers=1 /tmp/about.mp4
          echo 'TITAN VIDEO'
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -show_entries format=duration,size,format_name -of default=noprint_wrappers=1 /tmp/titan.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/about.mp4)" = 'h264'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/titan.mp4)" = 'h264'

      - name: Install native HTML integration
        run: python3 scripts/repair_native_media.py

      - name: Commit repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/native-r2-media-repair.yml scripts/repair_native_media.py
          git add index.html native-media-v4.css native-media-v4.js .github/workflows/native-r2-media-repair.yml scripts/repair_native_media.py
          git commit -m 'Use validated native R2 videos'
          git push
