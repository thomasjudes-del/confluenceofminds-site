name: Probe exact R2 object keys

on:
  push:
    paths:
      - '.github/workflows/native-r2-media-repair.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test candidate public URLs
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev'
          candidates=(
            'confluence-portal-1080.mp4'
            'confluence-portal-1080.mp4.mp4'
            'content_of_mind_portal_v6_hd_1920.mp4'
            'content_of_mind_portal_v6_hd_1920.mp4.mp4'
            'content_of_mind_portal_v6_hd_1920(1).mp4'
            'content_of_mind_portal_v6_hd_1920(1).mp4.mp4'
            'incident-on-titan-preview.mp4'
            'incident-on-titan-preview.mp4.mp4'
            'Incident_on_Titan_Promo_16x9.mp4'
            'Incident_on_Titan_Promo_16x9.mp4.mp4'
          )
          for key in "${candidates[@]}"; do
            encoded="${key// /%20}"
            code="$(curl --location --silent --output /dev/null --write-out '%{http_code}' "$BASE/$encoded")"
            echo "$code $key"
          done
