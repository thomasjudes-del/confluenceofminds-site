name: Refresh AV asset cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bump-hero-script-cache-20260808.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump Authentiques Victimes asset cache keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('authentiques-victimes/index.html')
          html = p.read_text(encoding='utf-8')
          html = html.replace('av-enhancements.css?v=20260907-v2', 'av-enhancements.css?v=20260907-v4')
          html = html.replace('av-enhancements.js?v=20260907-v2', 'av-enhancements.js?v=20260907-v4')
          html = html.replace('script.js?v=20260808-hero-wow1', 'script.js?v=20260907-v4')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit cache refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authentiques-victimes/index.html
          if git diff --cached --quiet; then
            echo "No cache key changes needed."
            exit 0
          fi
          git commit -m "Force refresh AV assets on mobile"
          git push
