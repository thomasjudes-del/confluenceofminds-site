name: Refresh hero script cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bump-hero-script-cache-20260808.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump hero script cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'fr/index.html']:
              p = Path(name)
              html = p.read_text(encoding='utf-8')
              html = html.replace('script.js?v=20260808-card-ctas-v1', 'script.js?v=20260808-fr-assets-v2')
              p.write_text(html, encoding='utf-8')
          PY

      - name: Commit cache refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fr/index.html
          if git diff --cached --quiet; then
            echo "No cache key changes needed."
            exit 0
          fi
          git commit -m "Refresh hero script after asset path fix"
          git push
