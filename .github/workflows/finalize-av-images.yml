name: Finalize AV images

on:
  push:
    paths:
      - '.github/workflows/finalize-av-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize the two supplied images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authentiques-victimes/assets/photos

          if [ ! -s authentiques-victimes/assets/photos/hero.webp ]; then
            : > /tmp/hero.b64
            for i in $(seq 0 9); do
              test -s "authentiques-victimes/assets/av-hero-user-${i}.txt"
              cat "authentiques-victimes/assets/av-hero-user-${i}.txt" >> /tmp/hero.b64
            done
            tr -d '\r\n ' < /tmp/hero.b64 | base64 --decode > authentiques-victimes/assets/photos/hero.webp
          fi

          if [ ! -s authentiques-victimes/assets/photos/plagiarism.webp ]; then
            : > /tmp/plagiarism.b64
            for i in $(seq 0 14); do
              test -s "authentiques-victimes/assets/av-plagiarism-user-${i}.txt"
              cat "authentiques-victimes/assets/av-plagiarism-user-${i}.txt" >> /tmp/plagiarism.b64
            done
            tr -d '\r\n ' < /tmp/plagiarism.b64 | base64 --decode > authentiques-victimes/assets/photos/plagiarism.webp
          fi

          test -s authentiques-victimes/assets/photos/hero.webp
          test -s authentiques-victimes/assets/photos/plagiarism.webp
          file authentiques-victimes/assets/photos/hero.webp | grep -qi 'Web/P'
          file authentiques-victimes/assets/photos/plagiarism.webp | grep -qi 'Web/P'

      - name: Point the page directly at repository images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('authentiques-victimes/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/av-hero-hq.webp', 'assets/photos/hero.webp')
          s = s.replace('assets/av-plagiarism-hq.webp', 'assets/photos/plagiarism.webp')
          s = re.sub(
              r'https://confluenceofminds\.com/authentiques-victimes/assets/[^"\']*hero[^"\']*',
              'https://confluenceofminds.com/authentiques-victimes/assets/photos/hero.webp',
              s,
          )
          s = re.sub(r'styles\.css\?v=[^"\']+', 'styles.css?v=20260807-av-v7', s)
          s = re.sub(r'script\.js\?v=[^"\']+', 'script.js?v=20260807-av-v7', s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Replace image hacks with clean front-end behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > authentiques-victimes/script.js <<'JS'
          (() => {
            'use strict';

            const header = document.querySelector('.topbar');
            const hero = document.querySelector('[data-hero]');
            const fragments = document.querySelector('[data-fragments]');
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const finePointer = window.matchMedia('(pointer: fine)').matches;
            let fragmentScroll = 0;
            let fragmentMouseX = 0;
            let fragmentMouseY = 0;

            function updateFragmentOffsets() {
              if (!fragments || reduced) return;
              fragments.querySelectorAll('.fragment').forEach((el, i) => {
                const scrollX = fragmentScroll * (((i % 4) - 1.5) * 7);
                const scrollY = fragmentScroll * (((i % 3) - 1) * 11);
                const mouseFactor = ((i % 5) + 1) * .8;
                el.style.setProperty('--sx', `${scrollX + fragmentMouseX * mouseFactor}px`);
                el.style.setProperty('--sy', `${scrollY + fragmentMouseY * mouseFactor}px`);
              });
            }

            const onScroll = () => {
              const y = window.scrollY || 0;
              header?.classList.toggle('is-scrolled', y > 35);
              if (reduced) return;
              if (hero) {
                const p = Math.max(0, Math.min(1, y / Math.max(1, hero.offsetHeight)));
                hero.style.setProperty('--hero-y', `${p * 8}px`);
              }
              if (fragments) {
                const r = fragments.getBoundingClientRect();
                fragmentScroll = Math.max(-1, Math.min(1, (innerHeight / 2 - (r.top + r.height / 2)) / innerHeight));
                fragments.style.setProperty('--frag-bg-y', `${fragmentScroll * 14}px`);
                updateFragmentOffsets();
              }
            };

            onScroll();
            addEventListener('scroll', onScroll, { passive: true });

            if (fragments && finePointer && !reduced) {
              fragments.addEventListener('pointermove', event => {
                const r = fragments.getBoundingClientRect();
                fragmentMouseX = ((event.clientX - r.left) / r.width - .5) * 2.4;
                fragmentMouseY = ((event.clientY - r.top) / r.height - .5) * 2.4;
                updateFragmentOffsets();
              }, { passive: true });
              fragments.addEventListener('pointerleave', () => {
                fragmentMouseX = 0;
                fragmentMouseY = 0;
                updateFragmentOffsets();
              });
            }

            const revealItems = document.querySelectorAll('.reveal');
            if (reduced || !('IntersectionObserver' in window)) {
              revealItems.forEach(el => el.classList.add('is-visible'));
            } else {
              const observer = new IntersectionObserver(entries => entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
              }), { threshold: .08, rootMargin: '0px 0px -5% 0px' });
              revealItems.forEach(el => observer.observe(el));
            }

            const interactiveStyle = document.createElement('style');
            interactiveStyle.textContent = `
              .fragment { transition: opacity .24s ease, color .24s ease, text-shadow .24s ease, filter .24s ease; }
              .fragments__field.has-focus .fragment:not(.is-focused) { opacity: .22 !important; filter: blur(.15px); }
              .fragment.is-focused { opacity: 1 !important; color: #fff0c8; font-weight: 600; text-shadow: 0 5px 32px rgba(0,0,0,.95), 0 0 24px rgba(216,182,125,.28); z-index: 12; }
              .fragment.is-focused::after { content: ''; display: block; width: 42px; height: 1px; margin-top: 12px; background: #d8b67d; box-shadow: 0 0 12px rgba(216,182,125,.5); }
              @media (pointer: fine) {
                html.av-pen-active, html.av-pen-active body, html.av-pen-active a, html.av-pen-active button, html.av-pen-active .fragment { cursor: none !important; }
                .av-pen-cursor { position: fixed; z-index: 9999; left: 0; top: 0; width: 31px; height: 48px; pointer-events: none; opacity: 0; transform: translate3d(-50px,-50px,0) rotate(-21deg); transform-origin: 50% 72%; transition: opacity .16s ease, filter .16s ease; filter: drop-shadow(0 3px 7px rgba(0,0,0,.55)); }
                .av-pen-cursor.is-visible { opacity: .96; }
                .av-pen-cursor.is-hot { filter: drop-shadow(0 3px 7px rgba(0,0,0,.55)) drop-shadow(0 0 7px rgba(216,182,125,.72)); }
                .av-pen-cursor svg { display: block; width: 100%; height: 100%; overflow: visible; }
              }
            `;
            document.head.appendChild(interactiveStyle);

            const fragmentField = fragments?.querySelector('.fragments__field');
            fragments?.querySelectorAll('.fragment').forEach(fragment => {
              fragment.addEventListener('pointerenter', () => {
                fragmentField?.classList.add('has-focus');
                fragment.classList.add('is-focused');
              });
              fragment.addEventListener('pointerleave', () => {
                fragment.classList.remove('is-focused');
                if (!fragmentField?.querySelector('.is-focused')) fragmentField?.classList.remove('has-focus');
              });
            });

            if (finePointer && !reduced) {
              document.documentElement.classList.add('av-pen-active');
              const pen = document.createElement('div');
              pen.className = 'av-pen-cursor';
              pen.setAttribute('aria-hidden', 'true');
              pen.innerHTML = `<svg viewBox="0 0 40 62" xmlns="http://www.w3.org/2000/svg"><path d="M20 2 35 18 27 49 20 59 13 49 5 18Z" fill="#d8b67d" stroke="#f4dfb4" stroke-width="1.2"/><path d="M20 2v42" stroke="#3a2b18" stroke-width="1.6"/><circle cx="20" cy="34" r="3.2" fill="#0b0d0d" stroke="#f4dfb4" stroke-width="1"/><path d="m5 18 15 8 15-8" fill="none" stroke="#70522e" stroke-width="1.2"/></svg>`;
              document.body.appendChild(pen);

              let x = -50;
              let y = -50;
              let raf = 0;
              const paint = () => {
                raf = 0;
                pen.style.transform = `translate3d(${x - 7}px,${y - 8}px,0) rotate(-21deg)`;
              };
              addEventListener('pointermove', event => {
                x = event.clientX;
                y = event.clientY;
                pen.classList.add('is-visible');
                const target = event.target instanceof Element ? event.target : null;
                pen.classList.toggle('is-hot', !!target?.closest('a, button, .fragment'));
                if (!raf) raf = requestAnimationFrame(paint);
              }, { passive: true });
              addEventListener('pointerleave', () => pen.classList.remove('is-visible'));
            }

            window.AV_BOTPRESS_TARGET = '#botpress-mount';
            window.AV_ROBOTIQUES = {
              mountId: 'botpress-mount',
              replacePlaceholder() { document.querySelector('.botpress-placeholder')?.remove(); }
            };

            const PREAMBLE_VIDEO_ID = 'orhk4WoPYfs';
            window.onYouTubeIframeAPIReady = () => {
              if (!window.YT?.Player || !document.getElementById('youtube-preamble')) return;
              new YT.Player('youtube-preamble', {
                width: '100%',
                height: '100%',
                videoId: PREAMBLE_VIDEO_ID,
                host: 'https://www.youtube-nocookie.com',
                playerVars: { controls: 1, rel: 0, playsinline: 1, hl: 'fr' }
              });
            };

            if (document.getElementById('youtube-preamble')) {
              const ytApi = document.createElement('script');
              ytApi.src = 'https://www.youtube.com/iframe_api';
              ytApi.async = true;
              document.head.appendChild(ytApi);
            }
          })();
          JS

      - name: Remove staging and one-off workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f authentiques-victimes/assets/av-hero-user-*.txt
          rm -f authentiques-victimes/assets/av-plagiarism-user-*.txt
          rm -f .github/workflows/materialize-av-images.yml
          rm -f .github/workflows/finalize-av-images.yml

      - name: Commit final AV image fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix AV hero and plagiarism artwork at source"
          git push
