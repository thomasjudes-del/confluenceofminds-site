name: Implement RALUVAAA gameplay and pigment iteration

on:
  push:
    paths:
      - '.github/workflows/iterate-raluvaaa-gameplay-v2.yml'

permissions:
  contents: write

jobs:
  iterate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Wish UX and historical renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('raluvaaa-wish-classic/app.js')
          eng_path=Path('raluvaaa-wish-classic/engine-v03.html')
          app=app_path.read_text()
          eng=eng_path.read_text()

          # Controls inside the historical renderer: magnifier +/- and a cycling own-wish focus target.
          needle="    function node(id){return world.nodes.find(n=>n.id===id)||null}\n"
          assert needle in app
          controls=needle+'''    function prepareControls(){
              const zin=document.getElementById('zin'),zout=document.getElementById('zout'),focusBtn=document.getElementById('focus');
              if(zin){zin.title='Zoom in';zin.innerHTML='<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg>';}
              if(zout){zout.title='Zoom out';zout.innerHTML='<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg>';}
              if(focusBtn){focusBtn.title='Cycle through my wishes';focusBtn.addEventListener('click',ev=>{ev.preventDefault();ev.stopImmediatePropagation();parent.postMessage({type:'raluvaaa-cycle-my-wish'},location.origin)},true);}
            }
            prepareControls();
'''
          app=app.replace(needle,controls,1)

          app=app.replace("  if(e.data?.type==='raluvaaa-wish-click'){const id=wishByNode.get(e.data.nodeId);if(id)openWish(id)}\n", "  if(e.data?.type==='raluvaaa-wish-click'){const id=wishByNode.get(e.data.nodeId);if(id)openWish(id)}\n  if(e.data?.type==='raluvaaa-cycle-my-wish')cycleMyWish();\n",1)

          # Restore 3 entrusted wishes for the test, but retain the neutral header. Precise countdown updates every second.
          entrusted_pattern=r"function makeEntrustedSlot\(now\)\{.*?setInterval\(\(\)=>\{if\(bridge\)ensureEntrusted\(\)\},60000\);"
          entrusted_repl="""function ensureEntrusted(){
            let slots=state.entrusted,now=Date.now(),bands=['hours','days','weeks'];
            if(!Array.isArray(slots)||slots.length!==3)slots=bands.map(b=>makeSlot(b,now));
            slots=slots.map((s,i)=>s.expires<=now?makeSlot(s.band||bands[i],now):s);state.entrusted=slots;save();renderEntrusted();
          }
          function makeSlot(band,now){const pool=wishes.filter(w=>w.state!=='closed');const w=pool[Math.floor(Math.random()*pool.length)];const ms=band==='hours'?(1+Math.random()*17)*3600000:band==='days'?(1+Math.random()*5)*86400000:(6+Math.random()*10)*86400000;return{wishId:w.id,band,expires:now+ms}}
          function remain(ms){const s=Math.max(0,Math.ceil(ms/1000));if(s<60)return s+'s';const m=Math.floor(s/60),sec=s%60;if(m<60)return m+'m '+String(sec).padStart(2,'0')+'s';const h=Math.floor(m/60),min=m%60;if(h<24)return h+'h '+String(min).padStart(2,'0')+'m';const d=Math.floor(h/24),hr=h%24;return d+'d '+hr+'h'}
          function renderEntrusted(){const now=Date.now();document.getElementById('entrustedGrid').innerHTML=state.entrusted.map(s=>{const w=wishById(s.wishId),r=s.expires-now;if(!w)return'';return `<button class="entrusted-item ${r<5*3600000?'urgent':''}" data-wish="${w.id}"><div class="t">${esc(w.text)}</div><div class="m">${remain(r)} left</div></button>`}).join('');document.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>focusWish(b.dataset.wish))}
          setInterval(()=>{if(!bridge)return;const now=Date.now();if(state.entrusted?.some(s=>s.expires<=now))ensureEntrusted();else renderEntrusted()},1000);"""
          app,n=re.subn(entrusted_pattern,entrusted_repl,app,flags=re.S)
          assert n==1,n

          # My focus target now cycles through every claimed living wish.
          own_needle="function isClaimedOwner(w){return !!w.owner&&(w.claimed||state.claimedWishIds.includes(w.id))}\n"
          assert own_needle in app
          own_insert=own_needle+"""let myFocusCursor=-1;
          function cycleMyWish(){const mine=wishes.filter(w=>isClaimedOwner(w)&&w.state!=='closed');if(!mine.length){toast('Release or claim a wish to return to it here.');return}myFocusCursor=(myFocusCursor+1)%mine.length;const w=mine[myFocusCursor];detail.classList.add('hidden');bridge.focus(w.nodeId);toast((myFocusCursor+1)+'/'+mine.length+' · '+w.text.slice(0,64)+(w.text.length>64?'…':''))}
          """
          app=app.replace(own_needle,own_insert,1)

          # Action states: encouragement is reversible; one-shot contributions become visibly completed.
          open_pattern=r"function openWish\(id\)\{.*?\n\}\nfunction requireIdentity"
          open_repl="""function openWish(id){
            const w=wishById(id);if(!w)return;const own=isClaimedOwner(w),enc=state.encouraged.includes(w.id);bridge.focus(w.nodeId);
            const helped=state.suggestions.some(s=>s.wishId===w.id&&s.type==='HELP');
            const connected=(state.events||[]).some(e=>e.type==='connect'&&(e.a===w.id||e.b===w.id));
            const pivotSuggested=!own&&state.suggestions.some(s=>s.wishId===w.id&&s.type==='PIVOT');
            const splitSuggested=!own&&state.suggestions.some(s=>s.wishId===w.id&&s.type==='SPLIT');
            detail.classList.remove('hidden');
            const label=w.simulated?'SIMULATED TEST WISH':own?'YOUR WISH':w.owner?'UNCLAIMED LOCAL WISH':'A HUMAN INTENTION';
            const status=w.state==='bloom'?'Bloomed':w.state==='closed'?'Trace · let go':own?'Your living wish':'Living wish';
            detail.innerHTML=`<div class="detail-top"><div><div class="eyebrow">${label}</div><div class="wishtext">${esc(w.text)}</div><div class="meta">${esc(w.loc)} · ${fmtDate(w.date)}</div><div class="state">${status}</div></div><button class="close" id="closeDetail">×</button></div><div class="actions"><button class="action ${enc?'active':''}" data-act="encourage"><span class="ico">${enc?'✦':'✧'}</span>${enc?'Encouraged':'Encourage'}</button><button class="action ${helped?'done':''}" data-act="help" ${helped?'disabled':''}><span class="ico">↟</span>${helped?'Helped':'Help'}</button><button class="action ${connected?'done':''}" data-act="connect" ${connected?'disabled':''}><span class="ico">⌁</span>${connected?'Connected':'Connect'}</button><button class="action ${pivotSuggested?'done':''}" data-act="pivot" ${pivotSuggested?'disabled':''}><span class="ico">↝</span>${pivotSuggested?'Pivot suggested':'Pivot'}</button><button class="action ${splitSuggested?'done':''}" data-act="split" ${splitSuggested?'disabled':''}><span class="ico">⑂</span>${splitSuggested?'Split suggested':'Split'}</button><button class="action" data-act="share"><span class="ico">↗</span>Share</button></div>${own?`<div class="owner"><h4>Only you decide what happens to this wish.</h4><div class="row"><button class="soft" data-act="bloom">Bloom</button><button class="soft" data-act="letgo">Let go</button></div></div>`:w.owner&&!own?`<div class="owner"><h4>This wish is not claimed yet.</h4><button class="soft" data-act="claim">Claim this wish</button></div>`:''}<div class="row"><button class="soft" data-act="report">Flag as inappropriate</button></div>`;
            document.getElementById('closeDetail').onclick=()=>detail.classList.add('hidden');detail.querySelectorAll('[data-act]:not(:disabled)').forEach(b=>b.onclick=()=>act(b.dataset.act,w));
          }
          function requireIdentity(next,actionLabel='continue'){if(state.identity)return next();showIdentity(next,actionLabel)}"""
          app,n=re.subn(open_pattern,open_repl,app,flags=re.S)
          assert n==1,n

          app=app.replace("if(a==='help'){requireIdentity(()=>proposal('HELP',w));return}","if(a==='help'){requireIdentity(()=>proposal('HELP',w),'help');return}")
          app=app.replace("if(a==='connect'){requireIdentity(()=>chooseConnection(w));return}","if(a==='connect'){requireIdentity(()=>chooseConnection(w),'connect');return}")
          app=app.replace("else requireIdentity(()=>proposal('PIVOT',w));return}","else requireIdentity(()=>proposal('PIVOT',w),'suggest a pivot');return}")
          app=app.replace("else requireIdentity(()=>proposal('SPLIT',w));return}","else requireIdentity(()=>proposal('SPLIT',w),'suggest a split');return}")

          identity_pattern=r"function showIdentity\(next\)\{.*?\nfunction showClaim"
          identity_repl="""function showIdentity(next,actionLabel='continue'){modal(`<div class="eyebrow">PRIVATE IDENTITY</div><h2>Continue to ${esc(actionLabel)}.</h2><p>Use an email so RALUVAAA can associate this action with you. It stays private and is never displayed on the wish.</p><label>Email</label><input class="field" id="idEmail" type="email" autocomplete="email" placeholder="you@example.com"><div class="note">Prototype: no email is sent. Once identified, you will not be asked again on this device.</div><div class="row"><button class="soft" id="cancelId">Not now</button><button class="soft primary" id="confirmId">Continue</button></div>`);document.getElementById('cancelId').onclick=closeModal;document.getElementById('confirmId').onclick=()=>{const v=document.getElementById('idEmail').value.trim();if(!/^\\S+@\\S+\\.\\S+$/.test(v))return toast('Enter a valid email.');state.identity={email:v,created:Date.now()};save();closeModal();next?.()}}
          function showClaim"""
          app,n=re.subn(identity_pattern,identity_repl,app,flags=re.S)
          assert n==1,n

          app=app.replace("state.suggestions.push({type,wishId:w.id,text,t:Date.now(),from:state.identity.email});save();closeModal();toast('Suggestion stored in this test.')", "state.suggestions.push({type,wishId:w.id,text,t:Date.now(),from:state.identity.email});save();closeModal();openWish(w.id);toast('Suggestion stored in this test.')")
          app=app.replace("save();closeModal();renderStats();toast('A human bridge now exists between these intentions.');", "save();closeModal();renderStats();openWish(from.id);toast('A human bridge now exists between these intentions.');")
          app=app.replace('<div class="eyebrow">REPORT</div><h2>Help keep the world safe.</h2>','<div class="eyebrow">FLAG AS INAPPROPRIATE</div><h2>Help keep the world safe.</h2>')

          # Renderer palette: lower saturation and deterministic pigment variation along each branch, not one flat tree colour.
          eng=eng.replace("const hues=[207,267,313,40,181,286,221,12,160];","const hues=[204,238,326,36,168,278,214,18,148];",1)
          eng=eng.replace("e.hue=(root.hue+parent.generation*.72+((hash('tone'+e.id)%1000)/1000-.5)*34+Math.sin(parent.generation*.9)*7+360)%360;","e.hue=(root.hue+parent.generation*.62+((hash('tone'+e.id)%1000)/1000-.5)*58+Math.sin(parent.generation*.9)*9+360)%360;",1)

          halo_pattern=r"function rootHalo\(r\)\{.*?\}\nfunction pathEdge"
          halo_repl="""function rootHalo(r){const s=camera.worldToScreen(r.x,r.y);if(s.x<-300||s.x>W+300||s.y<-300||s.y>H+300)return;const count=world.nodes.filter(n=>n.root===r).length,z=camera.zoom,breath=1+Math.sin(tNow*.0011+r.index*1.7)*.035;let rad=(68+Math.sqrt(count)*9.5)*z*breath;rad=clamp(rad,14,210);const gr=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,rad);gr.addColorStop(0,`hsla(${r.hue},38%,76%,.055)`);gr.addColorStop(.24,`hsla(${r.hue+11},34%,66%,.027)`);gr.addColorStop(.6,`hsla(${r.hue-13},30%,54%,.008)`);gr.addColorStop(1,`hsla(${r.hue},28%,45%,0)`);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(s.x,s.y,rad,0,TAU);ctx.fill();if(z<.27){const R=rng(hash('dust'+r.id));for(let i=0;i<Math.min(54,Math.floor(count/2));i++){const aa=R()*TAU,rr=R()*rad*.9,px=s.x+Math.cos(aa)*rr,py=s.y+Math.sin(aa)*rr,sz=.4+R()*1.15;ctx.fillStyle=`hsla(${r.hue+R()*58-29},38%,74%,${.035+R()*.11})`;ctx.shadowColor=`hsla(${r.hue},34%,70%,.18)`;ctx.shadowBlur=1.4;ctx.beginPath();ctx.arc(px,py,sz,0,TAU);ctx.fill();ctx.shadowBlur=0}}}
          function pathEdge"""
          eng,n=re.subn(halo_pattern,halo_repl,eng,flags=re.S)
          assert n==1,n

          edge_pattern=r"function drawEdge\(e,progress=1\)\{.*?\}\nfunction stateOfEdge"
          edge_repl="""function drawEdge(e,progress=1){if(!inView((e.x0+e.x1)/2,(e.y0+e.y1)/2,180/camera.zoom))return;const z=camera.zoom,state=stateOfEdge(e),alive=state==='alive'||e.encouraged,fossil=state==='fossil',tone=((hash('patina'+e.id)%1000)/1000-.5)*24,tone2=((hash('patina2'+e.id)%1000)/1000-.5)*22,h=(e.hue+tone+360)%360,h2=(e.hue+tone2+360)%360,sat=32+(hash('sat'+e.id)%15),light=65+(hash('light'+e.id)%8);const breath=alive?(1+Math.sin(tNow*.0016+e.seed*.00001)*.055):1;const macro=z<.11,mid=z<.38;if(macro&&e.generation>6)return;if(mid&&e.generation>12&&e.type==='bloom')return;ctx.lineCap='round';if(alive){const boost=e.encouraged?1:0,alpha=e.mine?.84:boost?.62:clamp(.17+.22*Math.min(1,z*.9),.17,.39);ctx.shadowColor=e.mine?'rgba(235,219,184,.62)':boost?'rgba(225,239,231,.62)':`hsla(${h},38%,70%,.14)`;ctx.shadowBlur=(e.mine?10:boost?8:2.1)*breath/Math.max(.44,z);const pigment=ctx.createLinearGradient(e.x0,e.y0,e.x1,e.y1);if(e.mine){pigment.addColorStop(0,'rgba(238,224,193,.82)');pigment.addColorStop(.55,'rgba(248,235,207,.88)');pigment.addColorStop(1,'rgba(220,211,190,.76)')}else{const hA=(h-22+360)%360,hB=(h+9)%360,hC=(h2+24)%360;pigment.addColorStop(0,`hsla(${hA},${Math.max(24,sat-7)}%,${Math.max(58,light-5)}%,${alpha*breath})`);pigment.addColorStop(.48,`hsla(${hB},${sat}%,${Math.min(78,light+4)}%,${alpha*breath})`);pigment.addColorStop(1,`hsla(${hC},${Math.max(22,sat-10)}%,${light}%,${alpha*.9*breath})`)}ctx.strokeStyle=pigment;ctx.lineWidth=(e.mine?1.95:1.18)/Math.max(.46,z);pathEdge(e,progress,0,.40/Math.max(.6,z));ctx.stroke();ctx.shadowBlur=0;const patina=ctx.createLinearGradient(e.x0,e.y0,e.x1,e.y1);patina.addColorStop(0,`hsla(${(h2+18)%360},28%,79%,${alpha*.20})`);patina.addColorStop(.55,`hsla(${(h-15+360)%360},24%,73%,${alpha*.29})`);patina.addColorStop(1,`hsla(${(h2+31)%360},30%,80%,${alpha*.17})`);ctx.strokeStyle=patina;ctx.lineWidth=.44/Math.max(.57,z);pathEdge(e,progress,(hash('side'+e.id)%2?1:-1)*.68/Math.max(.72,z),.19/Math.max(.84,z));ctx.stroke();if(z>.64){ctx.strokeStyle=`hsla(${(h-18+360)%360},26%,74%,${alpha*.055})`;ctx.lineWidth=.27/Math.max(.62,z);pathEdge(e,progress,-1.28/Math.max(.75,z),.18/Math.max(.88,z));ctx.stroke()}}else{ctx.shadowBlur=0;ctx.strokeStyle=fossil?'rgba(107,121,141,.065)':'rgba(144,158,178,.115)';ctx.lineWidth=.65/Math.max(.5,z);pathEdge(e,1);ctx.stroke();if(z>.24){ctx.strokeStyle=fossil?'rgba(116,128,146,.018)':'rgba(150,164,184,.036)';ctx.lineWidth=.30/Math.max(.56,z);pathEdge(e,1,1.05/Math.max(.68,z),.15/Math.max(.78,z));ctx.stroke()}}if(z>.85&&progress>.98){const microMax=z>3?e.micro.length:Math.min(e.micro.length,2);for(let i=0;i<microMax;i++){const m=e.micro[i];ctx.beginPath();ctx.moveTo(m.x0,m.y0);ctx.quadraticCurveTo(m.cx,m.cy,m.x1,m.y1);ctx.strokeStyle=alive?`hsla(${(h2+i*11)%360},34%,76%,${z>3?.16:.075})`:'rgba(130,150,176,.035)';ctx.lineWidth=.48/Math.max(.74,z);ctx.stroke();if(z>2&&alive){ctx.fillStyle=`hsla(${h},34%,80%,.34)`;ctx.beginPath();ctx.arc(m.x1,m.y1,.8/Math.max(.9,z),0,TAU);ctx.fill()}}}if(alive&&z>.22&&progress>.98){const phase=(tNow*.00018+e.seed*.0000007)%1,pp=qpt(e,phase),boost=e.encouraged?1:0;ctx.fillStyle=boost?'rgba(239,246,235,.82)':`hsla(${h2},36%,82%,.40)`;ctx.shadowColor=boost?'rgba(229,242,232,.78)':`hsla(${h},34%,72%,.22)`;ctx.shadowBlur=(boost?7:2.2)/Math.max(.62,z);ctx.beginPath();ctx.arc(pp.x,pp.y,(boost?1.22:.88)/Math.max(.68,z),0,TAU);ctx.fill();ctx.shadowBlur=0}}
          function stateOfEdge"""
          eng,n=re.subn(edge_pattern,edge_repl,eng,flags=re.S)
          assert n==1,n

          node_pattern=r"function drawNode\(n\)\{.*?\}\nfunction drawLabels"
          node_repl="""function drawNode(n){const z=camera.zoom;if(z<.15&&!n.rootNode&&!n.mine&&!n.encouraged)return;if(!inView(n.x,n.y,80))return;const st=stateOf(n),alive=st==='alive'||n.encouraged,pulse=1+(alive?Math.sin(tNow*.0018+hash(n.id)*.00001)*.06:0),tone=((hash('node-tone'+n.id)%1000)/1000-.5)*24,h=(n.root.hue+tone+360)%360;let r=(n.rootNode?3.45:(n.mine||n.received)?4.0:n.encouraged?2.28:alive?1.45:.92)*pulse/Math.max(.53,z);if(z>1.1)r*=1.1;ctx.fillStyle=(n.mine||n.received)?'#e8dec9':n.encouraged?'rgba(235,243,230,.88)':n.rootNode?`hsla(${h},40%,80%,.72)`:alive?`hsla(${h},38%,77%,.48)`:st==='dormant'?'rgba(161,175,195,.22)':'rgba(116,130,150,.11)';if(alive){ctx.shadowColor=(n.mine||n.received)?'rgba(233,216,180,.58)':n.encouraged?'rgba(228,241,231,.76)':`hsla(${h},36%,72%,.18)`;ctx.shadowBlur=((n.mine||n.received)?10:n.encouraged?12:2.2)/Math.max(.6,z)}ctx.beginPath();ctx.arc(n.x,n.y,r,0,TAU);ctx.fill();ctx.shadowBlur=0;if(world.selected?.id===n.id){ctx.strokeStyle='rgba(210,228,230,.34)';ctx.lineWidth=.64/Math.max(.6,z);ctx.beginPath();ctx.arc(n.x,n.y,r*2.25,0,TAU);ctx.stroke()}}
          function drawLabels"""
          eng,n=re.subn(node_pattern,node_repl,eng,flags=re.S)
          assert n==1,n

          # A visible but refined radar echo on every programmatic focus.
          eng=eng.replace("const world={roots:[],nodes:[],edges:[],tips:[],clock:0,next:1,humans:0,myTip:null,selected:null,history:[]};","const world={roots:[],nodes:[],edges:[],tips:[],clock:0,next:1,humans:0,myTip:null,selected:null,history:[],focusPing:null};",1)
          old_focus="focus(n,deep=false){this.x=n.x;this.y=n.y;if(deep)this.zoom=Math.max(this.zoom,2.4);else this.zoom=Math.max(this.zoom,.72);updateStats()}"
          new_focus="focus(n,deep=false){this.x=n.x;this.y=n.y;if(deep)this.zoom=Math.max(this.zoom,2.4);else this.zoom=Math.max(this.zoom,.72);world.focusPing={id:n.id,start:performance.now()};updateStats()}"
          assert old_focus in eng
          eng=eng.replace(old_focus,new_focus,1)
          marker="function drawScene(ts){"
          assert marker in eng
          ping="""function drawFocusPing(){const fp=world.focusPing;if(!fp)return;const n=world.nodes.find(v=>v.id===fp.id);if(!n){world.focusPing=null;return}const elapsed=tNow-fp.start,dur=2800;if(elapsed>dur){world.focusPing=null;return}const s=camera.worldToScreen(n.x,n.y),base=elapsed/dur;ctx.save();const discA=(1-base)*.045;ctx.fillStyle=`rgba(190,214,216,${discA})`;ctx.beginPath();ctx.arc(s.x,s.y,18+base*28,0,TAU);ctx.fill();for(let i=0;i<3;i++){const p=(base+i*.24)%1,alpha=(1-p)*.46,rad=12+p*82;ctx.strokeStyle=`rgba(192,221,223,${alpha})`;ctx.lineWidth=.85;ctx.beginPath();ctx.arc(s.x,s.y,rad,0,TAU);ctx.stroke()}ctx.restore()}
          """
          eng=eng.replace(marker,ping+marker,1)
          eng=eng.replace("ctx.restore();drawLabels();drawInspector();drawMini();requestAnimationFrame(drawScene)","ctx.restore();drawFocusPing();drawLabels();drawInspector();drawMini();requestAnimationFrame(drawScene)",1)

          app_path.write_text(app)
          eng_path.write_text(eng)
          PY

      - name: Validate
        run: |
          node --check raluvaaa-wish-classic/app.js
          grep -q 'function drawFocusPing' raluvaaa-wish-classic/engine-v03.html
          grep -q 'Cycle through my wishes' raluvaaa-wish-classic/app.js
          grep -q 'Flag as inappropriate' raluvaaa-wish-classic/app.js
          grep -q '22' raluvaaa-wish-classic/app.js

      - name: Commit iteration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raluvaaa-wish-classic/app.js raluvaaa-wish-classic/engine-v03.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refine RALUVAAA gameplay states and pigment rendering'
          git push
