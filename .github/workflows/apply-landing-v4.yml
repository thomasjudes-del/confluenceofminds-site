name: Apply illustrated landing V4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-landing-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install landing files
        shell: bash
        run: |
          cat > /tmp/site.b64 <<'ARCHIVE'

ARCHIVE
          base64 -d /tmp/site.b64 > /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js
          if git diff --cached --quiet; then
            echo "Landing already up to date."
            exit 0
          fi
          git commit -m "Rebuild landing with illustrated worlds and organic hero"
          git push
