name: Check RALUVAAA Experience V39

on:
  push:
    paths:
      - 'raluvaaa/solo-experience-v39/**'
      - '.github/workflows/check-raluvaaa-experience-v39.yml'
  workflow_dispatch:

concurrency:
  group: raluvaaa-experience-v39-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          node --check raluvaaa/solo-experience-v39/exact-icons-v39.js
          node --check raluvaaa/solo-experience-v39/qa-v39.cjs
          grep -q 'data-asset-version="39"' raluvaaa/solo-experience-v39/index.html
          grep -q "raluvaaaSoloExperienceV39R1" raluvaaa/solo-experience-v39/index.html
          grep -q 'exact-icons-v39.js' raluvaaa/solo-experience-v39/index.html
          grep -q 'exact-icons-v39.css' raluvaaa/solo-experience-v39/index.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run V39 exact-board QA
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/raluvaaa-v39-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          sleep 2
          node raluvaaa/solo-experience-v39/qa-v39.cjs
