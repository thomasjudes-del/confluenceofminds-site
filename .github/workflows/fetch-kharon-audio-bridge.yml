name: Temporary KHARON audio bridge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  TRACK_URL: 'https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_46bf31009f97a7a8/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260820%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260820T195119Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated track
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$TRACK_URL" -o kharon_background_music.mp3
          test -s kharon_background_music.mp3
          file kharon_background_music.mp3
          ls -lh kharon_background_music.mp3
      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharon-background-music
          path: kharon_background_music.mp3
          if-no-files-found: error
          retention-days: 1
