name: Check RALUVAAA v03 Wish build

on:
  push:
    paths:
      - 'raluvaaa-wish-classic/**'
      - '.github/workflows/check-raluvaaa-wish-classic.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check raluvaaa-wish-classic/app-v15.js
          node --check raluvaaa-wish-classic/seed.js
          node --check raluvaaa-wish-classic/ux-v2.js
          node --check raluvaaa-wish-classic/renderer-v15.js
      - name: Validate consolidated runtime and cache busting
        run: |
          test -s raluvaaa-wish-classic/index.html
          test -s raluvaaa-wish-classic/engine-v03.html
          test -s raluvaaa-wish-classic/app-v15.js
          test -s raluvaaa-wish-classic/renderer-v15.js
          grep -q 'RALUVAAA · Living artwork' raluvaaa-wish-classic/engine-v03.html
          grep -q 'a living map of <b>human intentions</b>' raluvaaa-wish-classic/index.html
          grep -q 'app-v15.js?build=v15-20260912-1518' raluvaaa-wish-classic/index.html
          grep -q 'renderer-v15.js?build=v15-20260912-1518' raluvaaa-wish-classic/index.html
          grep -q 'engine-v03.html?build=v15-20260912-1518' raluvaaa-wish-classic/index.html
          grep -q 'Entrusted to you' raluvaaa-wish-classic/index.html
          grep -q 'slots.length!==3' raluvaaa-wish-classic/app-v15.js
          grep -q "return h+'h '+String(mm).padStart(2,'0')+'m'" raluvaaa-wish-classic/app-v15.js
          grep -q 'raluvaaa-world-blank' raluvaaa-wish-classic/app-v15.js
          grep -q 'Flag as inappropriate' raluvaaa-wish-classic/app-v15.js
          grep -q 'Helped' raluvaaa-wish-classic/app-v15.js
          grep -q 'Connected' raluvaaa-wish-classic/app-v15.js
          grep -q 'raluvaaa-cycle-my-wish' raluvaaa-wish-classic/app-v15.js
          grep -q 'lensPlus' raluvaaa-wish-classic/renderer-v15.js
          grep -q '__raluvaaaFocusPing' raluvaaa-wish-classic/renderer-v15.js
          grep -q 'createLinearGradient' raluvaaa-wish-classic/renderer-v15.js
          ! grep -q 'patch-v2.js' raluvaaa-wish-classic/index.html
          ! grep -q 'patch-v3.js' raluvaaa-wish-classic/index.html
