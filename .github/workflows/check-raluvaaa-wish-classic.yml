name: Check RALUVAAA v03 Wish build

on:
  push:
    paths:
      - 'raluvaaa-wish-classic/**'
      - '.github/workflows/check-raluvaaa-wish-classic.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check raluvaaa-wish-classic/app-v16.js
          node --check raluvaaa-wish-classic/seed.js
          node --check raluvaaa-wish-classic/ux-v2.js
          node --check raluvaaa-wish-classic/renderer-v17.js
          node --check raluvaaa-wish-classic/ux-v17.js
      - name: Validate V17 runtime and cache busting
        run: |
          test -s raluvaaa-wish-classic/index.html
          test -s raluvaaa-wish-classic/engine-v03.html
          test -s raluvaaa-wish-classic/app-v16.js
          test -s raluvaaa-wish-classic/renderer-v17.js
          test -s raluvaaa-wish-classic/ux-v17.js
          test -s raluvaaa-wish-classic/ui-v17.css
          grep -q 'RALUVAAA · Living artwork' raluvaaa-wish-classic/engine-v03.html
          grep -q 'a living map of <b>human intentions</b>' raluvaaa-wish-classic/index.html
          grep -q 'renderer-v17.js?build=v17-20260912-1545' raluvaaa-wish-classic/index.html
          grep -q 'ux-v17.js?build=v17-20260912-1545' raluvaaa-wish-classic/index.html
          grep -q 'ui-v17.css?build=v17-20260912-1545' raluvaaa-wish-classic/index.html
          grep -q 'engine-v03.html?build=v17-20260912-1545' raluvaaa-wish-classic/index.html
          grep -q 'quickPulse' raluvaaa-wish-classic/index.html
          grep -q 'entrustedQuick' raluvaaa-wish-classic/index.html
          grep -q 'setManualEncouraged' raluvaaa-wish-classic/renderer-v17.js
          grep -q 'Math.min(W,H)\*.46' raluvaaa-wish-classic/renderer-v17.js
          grep -q 'targetY=W<=760?H\*.29:H\*.40' raluvaaa-wish-classic/renderer-v17.js
          grep -q 'locate-wish' raluvaaa-wish-classic/ux-v17.js
          grep -q 'raluvaaa-world-blank' raluvaaa-wish-classic/app-v16.js
          grep -q 'slots.length!==3' raluvaaa-wish-classic/app-v16.js
          grep -q 'Flag as inappropriate' raluvaaa-wish-classic/app-v16.js
