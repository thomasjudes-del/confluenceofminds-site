name: Compact world grid V6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/compact-world-grid-v6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact world grid
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); t="        <p>Each project keeps its own codes, atmosphere and form. The grid is the map; the worlds themselves do not have to match.</p>\n"; assert t in s; p.write_text(s.replace(t,"",1),encoding="utf-8")'
          cat >> styles.css <<'EOF'

/* Compact Worlds grid — client-facing V6 */
.worlds-heading {
  display: block;
  margin-bottom: 34px;
}
.worlds-heading > p { display: none; }
.world-grid {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 16px;
}
.world-card { border-radius: 12px; }
.world-card__body {
  min-height: 245px;
  padding: 17px 17px 15px;
}
.world-card__meta {
  gap: 8px;
  margin-bottom: 13px;
  font-size: 8px;
  letter-spacing: .08em;
}
.world-card h3 {
  font-size: clamp(21px, 1.55vw, 27px);
  line-height: 1.05;
}
.world-card p {
  margin: 13px 0 20px;
  font-size: 12.5px;
  line-height: 1.5;
}
.world-card button {
  padding-top: 11px;
  font-size: 10px;
}

@media (max-width: 1180px) {
  .world-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .world-card__body { min-height: 245px; }
}

@media (max-width: 820px) {
  .worlds-heading { margin-bottom: 28px; }
  .world-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .world-card__body { min-height: auto; padding: 17px; }
}

@media (max-width: 520px) {
  .world-grid { grid-template-columns: 1fr; }
  .world-card h3 { font-size: 27px; }
  .world-card p { font-size: 14px; }
}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Remove internal-facing copy and compact world cards"
          git push
