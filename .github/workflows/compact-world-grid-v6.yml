name: Compact world grid V6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compact-world-grid-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply client-facing copy and compact grid
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old = '''      <div class="worlds-heading reveal">
        <div>
          <p class="section-label">Choose an entrance</p>
          <h2 id="worlds-title">Worlds</h2>
        </div>
        <p>Each project keeps its own codes, atmosphere and form. The grid is the map; the worlds themselves do not have to match.</p>
      </div>'''
          new = '''      <div class="worlds-heading reveal">
        <div>
          <p class="section-label">Choose an entrance</p>
          <h2 id="worlds-title">Worlds</h2>
        </div>
      </div>'''
          if old not in html:
              raise SystemExit('Expected Worlds heading block not found')
          index.write_text(html.replace(old, new, 1), encoding='utf-8')

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          replacements = {
          '''.worlds-heading {
  display: grid;
  grid-template-columns: 1fr minmax(280px, 520px);
  gap: 50px;
  align-items: end;
  margin-bottom: 50px;
}''': '''.worlds-heading {
  margin-bottom: 34px;
}''',
          '''.worlds-heading > p {
  margin: 0 0 8px;
  font-family: var(--serif);
  font-size: clamp(17px, 1.3vw, 22px);
  line-height: 1.5;
  color: #5f6461;
}

''': '',
          '''.world-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
}''': '''.world-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 16px;
}''',
          '''  border-radius: 16px;''': '''  border-radius: 12px;''',
          '''.world-card__body { flex: 1; display: flex; flex-direction: column; min-height: 330px; padding: 24px 24px 20px; }''': '''.world-card__body { flex: 1; display: flex; flex-direction: column; min-height: 245px; padding: 17px 17px 15px; }''',
          '''.world-card__meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 19px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }''': '''.world-card__meta { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 13px; font-family: var(--mono); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }''',
          '''.world-card h3 { margin: 0; font-family: var(--serif); font-size: clamp(27px, 2vw, 36px); font-weight: 500; line-height: 1.03; letter-spacing: -.03em; }''': '''.world-card h3 { margin: 0; font-family: var(--serif); font-size: clamp(21px, 1.55vw, 27px); font-weight: 500; line-height: 1.05; letter-spacing: -.03em; }''',
          '''.world-card p { margin: 18px 0 28px; font-size: 15px; line-height: 1.65; color: #5c625f; }''': '''.world-card p { margin: 13px 0 20px; font-size: 12.5px; line-height: 1.5; color: #5c625f; }''',
          '''  padding: 14px 0 0;''': '''  padding: 11px 0 0;''',
          '''  font-size: 12px;''': '''  font-size: 10px;''',
          '''  .world-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .world-card__body { min-height: 310px; }''': '''  .world-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .world-card__body { min-height: 245px; }''',
          '''  .worlds-heading { grid-template-columns: 1fr; gap: 22px; margin-bottom: 34px; }
  .world-grid { grid-template-columns: 1fr; gap: 20px; }
  .world-card__body { min-height: auto; padding: 22px; }''': '''  .worlds-heading { margin-bottom: 28px; }
  .world-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .world-card__body { min-height: auto; padding: 17px; }''',
          '''  .worlds-heading h2 { font-size: 68px; }
  .world-card h3 { font-size: 29px; }
  .world-card p { font-size: 14px; }''': '''  .worlds-heading h2 { font-size: 68px; }
  .world-grid { grid-template-columns: 1fr; }
  .world-card h3 { font-size: 27px; }
  .world-card p { font-size: 14px; }'''
          }

          for old_css, new_css in replacements.items():
              if old_css not in css:
                  raise SystemExit(f'Expected CSS block not found: {old_css[:80]!r}')
              css = css.replace(old_css, new_css, 1)
          css_path.write_text(css, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Remove internal-facing copy and compact world cards"
          git push
