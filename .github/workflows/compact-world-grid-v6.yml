name: Compact world grid V6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/compact-world-grid-v6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact world grid
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/compact.py
          python /tmp/compact.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Remove internal-facing copy and compact world cards"
          git push
