name: Apply About background video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-about-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace only the About section
        shell: bash
        run: |
          test -s assets/content_of_mind_portal_v6_hd_960.webm
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          new_about = '''    <section id="about" class="about about--video" aria-labelledby="about-title">
      <video class="about__background" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="assets/content_of_mind_portal_v6_hd_960.webm?v=20260805-1240" type="video/webm" />
      </video>
      <div class="about__veil" aria-hidden="true"></div>
      <div class="about-copy reveal">
        <p class="section-label">Different doors. One universe.</p>
        <h2 id="about-title">Come for one world.<br />Get lost in a universe.</h2>
        <p>Confluence of Minds brings together stories, games, visual series and sound worlds that were never meant to look alike. Each one opens its own door; together, they form a territory still expanding.</p>
      </div>
    </section>'''

          pattern = re.compile(r'    <section id="about"\b.*?</section>', re.S)
          html, count = pattern.subn(new_about, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one About section, replaced {count}')

          html = re.sub(
              r'<link rel="stylesheet" href="styles\.css(?:\?[^\"]*)?"\s*/>',
              '<link rel="stylesheet" href="styles.css?v=20260805-about-video-v1" />',
              html,
              count=1,
          )
          index_path.write_text(html, encoding='utf-8')

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Full-width About background video — V1 */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip() + '\n'

          css += r'''

/* Full-width About background video — V1 */
.about.about--video {
  position: relative;
  z-index: 20;
  isolation: isolate;
  width: 100%;
  max-width: none;
  min-height: clamp(620px, 68vw, 920px);
  display: flex;
  align-items: center;
  overflow: hidden;
  padding: clamp(100px, 10vw, 170px) clamp(28px, 8vw, 140px);
  border-top: 1px solid rgba(248, 243, 234, .16);
  background: #111816;
}
.about__background {
  position: absolute;
  z-index: -2;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  pointer-events: none;
}
.about__veil {
  position: absolute;
  z-index: -1;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(9, 14, 13, .20) 0%, rgba(9, 14, 13, .38) 42%, rgba(9, 14, 13, .78) 100%),
    linear-gradient(180deg, rgba(9, 14, 13, .10) 0%, rgba(9, 14, 13, .42) 100%);
  pointer-events: none;
}
.about--video .about-copy {
  position: relative;
  z-index: 1;
  width: min(820px, 58vw);
  margin-left: auto;
}
.about--video .section-label {
  color: #df9b72;
  text-shadow: 0 2px 22px rgba(0, 0, 0, .45);
}
.about--video .about-copy h2 {
  color: #fff9ef;
  text-shadow: 0 8px 42px rgba(0, 0, 0, .48);
}
.about--video .about-copy > p:last-child {
  color: rgba(255, 249, 239, .88);
  text-shadow: 0 3px 24px rgba(0, 0, 0, .55);
}

@media (max-width: 820px) {
  .about.about--video {
    min-height: 720px;
    align-items: flex-end;
    padding: 110px 24px 84px;
  }
  .about__background { object-position: center; }
  .about__veil {
    background:
      linear-gradient(180deg, rgba(9, 14, 13, .12) 0%, rgba(9, 14, 13, .42) 40%, rgba(9, 14, 13, .86) 100%);
  }
  .about--video .about-copy {
    width: 100%;
    max-width: 680px;
    margin: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .about__background { display: none; }
  .about.about--video {
    background:
      linear-gradient(115deg, rgba(13, 23, 21, .80), rgba(13, 23, 21, .96)),
      url('assets/confluence-hero-organic.png?v=20260805-hero-v7') center / cover no-repeat;
  }
}
'''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit the targeted change
        shell: bash
        run: |
          rm -rf .video-upload
          rm -f .github/workflows/apply-about-video.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use full-width video background for About section"
          git push
