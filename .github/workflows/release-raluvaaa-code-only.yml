name: Release reviewed RALUVAAA Worker code only

# Only the separate, reviewed release-plan push may start the code-only release.
# Cleanup/diagnostic branches never match; disabled or incomplete plans fail before credentials.
on:
  workflow_dispatch:
  push:
    branches:
      - 'dot/raluvaaa-query-only-release-20261016'
    paths:
      - 'raluvaaa/alpha-api/release-plan.json'

permissions:
  contents: read

concurrency:
  group: raluvaaa-code-only-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/dot/raluvaaa-query-only-release-20261016' && github.repository == 'thomasjudes-del/confluenceofminds-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release guards without credentials
        run: |
          node --check raluvaaa/alpha-api/release-code-only.mjs
          node --test raluvaaa/alpha-api/release-code-only.test.mjs raluvaaa/alpha-api/inspect-release-runtime.test.mjs
          node --test raluvaaa/alpha-api/qa-security.mjs raluvaaa/alpha-api/qa-fixture-hiding.mjs raluvaaa/private-alpha/qa-bootstrap-security.cjs
      - name: Validate exact release plan before credentials
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { validatePlan } from './raluvaaa/alpha-api/release-code-only.mjs';
          validatePlan(JSON.parse(readFileSync('raluvaaa/alpha-api/release-plan.json', 'utf8')), {
            ref: process.env.GITHUB_REF, repository: process.env.GITHUB_REPOSITORY
          });
          JS
      - name: Release exact reviewed source after remote CI and drift checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node raluvaaa/alpha-api/release-code-only.mjs
      - name: Verify public Worker liveness without credentials
        run: |
          node --input-type=module <<'JS'
          try {
            const response = await fetch('https://raluvaaa-alpha-api.thomas-judes.workers.dev/v1/health', {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000)
            });
            if (response.status !== 200) throw new Error();
            const data = await response.json();
            if (data.ok !== true || data.service !== 'raluvaaa-alpha-api' || data.version !== 1) throw new Error();
            console.log(JSON.stringify({status: 200, service: data.service, version: data.version, liveness: 'passed'}));
          } catch {
            console.error('Public Worker liveness verification failed; no automatic retry or rollback.');
            process.exitCode = 1;
          }
          JS
