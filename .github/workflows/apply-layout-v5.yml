name: Apply corrected landing V5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-layout-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install corrected landing files
        shell: bash
        run: |
          printf '%s' '[... ELLIPSIZATION ...]' | base64 --decode > /tmp/site.tgz
          tar -xzf /tmp/site.tgz -C "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore hero-worlds-about structure and grounded project copy"
          git push
