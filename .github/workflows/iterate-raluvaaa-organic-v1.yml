name: Iterate RALUVAAA organic palette and interaction cues

on:
  push:
    paths:
      - '.github/workflows/iterate-raluvaaa-organic-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Wish interaction and historical renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              out, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          app_path = Path('raluvaaa-wish-classic/app.js')
          app = app_path.read_text()

          old = """    function touch(id){const n=node(id);if(!n)return false;n.lastActive=world.clock;const e=world.edges.find(x=>x.id===n.edgeId);if(e)e.lastActive=world.clock;return true}\n    function fossil(id){const n=node(id);if(!n)return false;n.lastActive=world.clock-120;const e=world.edges.find(x=>x.id===n.edgeId);if(e)e.lastActive=world.clock-120;return true}\n    function focus(id){const n=node(id);if(!n)return false;world.selected=n;camera.focus(n,false);return true}\n    function setWishNodes(ids){wishNodes.clear();ids.forEach(id=>wishNodes.add(id))}\n"""
          new = """    function touch(id){const n=node(id);if(!n)return false;n.lastActive=world.clock;const e=world.edges.find(x=>x.id===n.edgeId);if(e)e.lastActive=world.clock;return true}\n    function setEncouraged(id,on){const n=node(id);if(!n)return false;n.encouraged=!!on;const e=world.edges.find(x=>x.id===n.edgeId);if(e)e.encouraged=!!on;return true}\n    function fossil(id){const n=node(id);if(!n)return false;n.lastActive=world.clock-120;const e=world.edges.find(x=>x.id===n.edgeId);if(e)e.lastActive=world.clock-120;return true}\n    function focus(id){const n=node(id);if(!n)return false;world.selected=n;camera.focus(n,false);return true}\n    function setWishNodes(ids){wishNodes.clear();ids.forEach(id=>wishNodes.add(id))}\n"""
          if old not in app:
              raise SystemExit('bridge block not found')
          app = app.replace(old, new, 1)
          app = app.replace("window.RV_BRIDGE={seedNodes,growWish,connect,touch,fossil,focus,setWishNodes,", "window.RV_BRIDGE={seedNodes,growWish,connect,touch,setEncouraged,fossil,focus,setWishNodes,", 1)
          app = app.replace("for(const id of state.encouraged||[]){const w=wishById(id);if(w)bridge.touch(w.nodeId)}", "for(const id of state.encouraged||[]){const w=wishById(id);if(w)bridge.setEncouraged(w.nodeId,true)}", 1)

          app = sub_once(app,
              r"function ensureEntrusted\(\)\{.*?\n\}\nfunction makeSlot\(band,now\)",
              """function makeEntrustedSlot(now){const bands=['hours','days','weeks'];return makeSlot(bands[Math.floor(Math.random()*bands.length)],now)}\nfunction ensureEntrusted(){\n  let slots=state.entrusted,now=Date.now();\n  if(!Array.isArray(slots)||slots.length!==1)slots=[makeEntrustedSlot(now)];\n  slots=slots.map(s=>s.expires<=now?makeEntrustedSlot(now):s);state.entrusted=slots;save();renderEntrusted();\n}\nfunction makeSlot(band,now)""",
              'entrusted count', re.S)

          app = sub_once(app,
              r"function renderEntrusted\(\)\{.*?\}\nsetInterval",
              """function renderEntrusted(){const now=Date.now();document.getElementById('entrustedGrid').innerHTML=state.entrusted.map(s=>{const w=wishById(s.wishId),r=s.expires-now;if(!w)return'';return `<button class=\"entrusted-item ${r<5*3600000?'urgent':''}\" data-wish=\"${w.id}\"><div class=\"t\">${esc(w.text)}</div><div class=\"m\">${remain(r)} left</div></button>`}).join('');document.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>focusWish(b.dataset.wish))}\nsetInterval""",
              'entrusted renderer', re.S)

          app = app.replace('<button class="action" data-act="encourage">', '<button class="action ${enc?\'active\':\'\'}" data-act="encourage">', 1)

          old_enc = "if(a==='encourage'){if(!state.encouraged.includes(w.id)){state.encouraged.push(w.id);bridge.touch(w.nodeId);save();toast('Your encouragement keeps a little light on this wish.')}else toast('You already encouraged this wish.');openWish(w.id);return}"
          new_enc = "if(a==='encourage'){const i=state.encouraged.indexOf(w.id);if(i<0){state.encouraged.push(w.id);bridge.setEncouraged(w.nodeId,true);toast('You encouraged this wish.')}else{state.encouraged.splice(i,1);bridge.setEncouraged(w.nodeId,false);toast('Encouragement removed.')}save();openWish(w.id);return}"
          if old_enc not in app:
              raise SystemExit('encourage action not found')
          app = app.replace(old_enc, new_enc, 1)
          app = app.replace('Choose one of the three wishes currently entrusted to you.', 'Choose another wish currently entrusted to you.', 1)
          app_path.write_text(app)

          engine_path = Path('raluvaaa-wish-classic/engine-v03.html')
          engine = engine_path.read_text()
          engine = engine.replace('const hues=[207,267,313,40,181,286,221,12,160];', 'const hues=[204,254,324,36,166,288,218,18,145];', 1)
          engine = engine.replace("e.hue=(root.hue+parent.generation*1.2)%360;", "e.hue=(root.hue+parent.generation*.72+((hash('tone'+e.id)%1000)/1000-.5)*34+Math.sin(parent.generation*.9)*7+360)%360;", 1)

          organic_halo = """function rootHalo(r){const s=camera.worldToScreen(r.x,r.y);if(s.x<-300||s.x>W+300||s.y<-300||s.y>H+300)return;const count=world.nodes.filter(n=>n.root===r).length,z=camera.zoom,breath=1+Math.sin(tNow*.0011+r.index*1.7)*.045;let rad=(72+Math.sqrt(count)*10.5)*z*breath;rad=clamp(rad,16,230);const gr=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,rad);gr.addColorStop(0,`hsla(${r.hue},58%,78%,.085)`);gr.addColorStop(.22,`hsla(${r.hue+8},52%,67%,.045)`);gr.addColorStop(.58,`hsla(${r.hue-10},48%,55%,.012)`);gr.addColorStop(1,`hsla(${r.hue},45%,45%,0)`);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(s.x,s.y,rad,0,TAU);ctx.fill();if(z<.27){const R=rng(hash('dust'+r.id));for(let i=0;i<Math.min(62,Math.floor(count/2));i++){const aa=R()*TAU,rr=R()*rad*.88,px=s.x+Math.cos(aa)*rr,py=s.y+Math.sin(aa)*rr,sz=.45+R()*1.35;ctx.fillStyle=`hsla(${r.hue+R()*42-21},58%,76%,${.055+R()*.16})`;ctx.shadowColor=`hsla(${r.hue},55%,72%,.28)`;ctx.shadowBlur=2;ctx.beginPath();ctx.arc(px,py,sz,0,TAU);ctx.fill();ctx.shadowBlur=0}}}"""
          engine = sub_once(engine, r"function rootHalo\(r\)\{.*?\}\nfunction pathEdge", organic_halo + "\nfunction pathEdge", 'root halo', re.S)

          organic_edge = """function drawEdge(e,progress=1){if(!inView((e.x0+e.x1)/2,(e.y0+e.y1)/2,180/camera.zoom))return;const z=camera.zoom,state=stateOfEdge(e),alive=state==='alive'||e.encouraged,fossil=state==='fossil',tone=((hash('patina'+e.id)%1000)/1000-.5)*18,tone2=((hash('patina2'+e.id)%1000)/1000-.5)*14,h=(e.hue+tone+360)%360,h2=(e.hue+tone2+360)%360,sat=48+(hash('sat'+e.id)%16),light=68+(hash('light'+e.id)%9);const breath=alive?(1+Math.sin(tNow*.0016+e.seed*.00001)*.07):1;const macro=z<.11,mid=z<.38;if(macro&&e.generation>6)return;if(mid&&e.generation>12&&e.type==='bloom')return;ctx.lineCap='round';if(alive){const boost=e.encouraged?1:0,alpha=e.mine?.88:boost?.68:clamp(.20+.24*Math.min(1,z*.9),.20,.44);ctx.shadowColor=e.mine?'rgba(255,226,175,.72)':boost?'rgba(225,242,236,.72)':`hsla(${h},55%,72%,.24)`;ctx.shadowBlur=(e.mine?12:boost?10:3.2)*breath/Math.max(.42,z);ctx.strokeStyle=e.mine?'rgba(245,232,204,.88)':`hsla(${h},${sat}%,${light}%,${alpha*breath})`;ctx.lineWidth=(e.mine?2.05:1.28)/Math.max(.45,z);pathEdge(e,progress,0,.46/Math.max(.58,z));ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle=e.mine?'rgba(255,246,225,.42)':`hsla(${h2},${Math.max(36,sat-8)}%,${Math.min(82,light+7)}%,${alpha*.34})`;ctx.lineWidth=.48/Math.max(.55,z);pathEdge(e,progress,(hash('side'+e.id)%2?1:-1)*.72/Math.max(.7,z),.24/Math.max(.82,z));ctx.stroke();if(z>.62){ctx.strokeStyle=`hsla(${h-12},42%,76%,${alpha*.08})`;ctx.lineWidth=.30/Math.max(.6,z);pathEdge(e,progress,-1.35/Math.max(.72,z),.24/Math.max(.85,z));ctx.stroke()}}else{ctx.shadowBlur=0;ctx.strokeStyle=fossil?'rgba(110,127,149,.07)':'rgba(150,166,187,.13)';ctx.lineWidth=.68/Math.max(.48,z);pathEdge(e,1);ctx.stroke();if(z>.24){ctx.strokeStyle=fossil?'rgba(118,132,152,.022)':'rgba(154,171,194,.042)';ctx.lineWidth=.32/Math.max(.54,z);pathEdge(e,1,1.1/Math.max(.66,z),.18/Math.max(.75,z));ctx.stroke()}}if(z>.85&&progress>.98){const microMax=z>3?e.micro.length:Math.min(e.micro.length,2);for(let i=0;i<microMax;i++){const m=e.micro[i];ctx.beginPath();ctx.moveTo(m.x0,m.y0);ctx.quadraticCurveTo(m.cx,m.cy,m.x1,m.y1);ctx.strokeStyle=alive?`hsla(${h2+(i*8)},52%,77%,${z>3?.22:.10})`:'rgba(130,150,176,.04)';ctx.lineWidth=.52/Math.max(.72,z);ctx.stroke();if(z>2&&alive){ctx.fillStyle=`hsla(${h},54%,82%,.46)`;ctx.beginPath();ctx.arc(m.x1,m.y1,.9/Math.max(.9,z),0,TAU);ctx.fill()}}}if(alive&&z>.22&&progress>.98){const phase=(tNow*.00018+e.seed*.0000007)%1,pp=qpt(e,phase),boost=e.encouraged?1:0;ctx.fillStyle=boost?'rgba(240,248,236,.86)':`hsla(${h2},58%,84%,.52)`;ctx.shadowColor=boost?'rgba(229,244,233,.86)':`hsla(${h},55%,75%,.36)`;ctx.shadowBlur=(boost?8:3.5)/Math.max(.6,z);ctx.beginPath();ctx.arc(pp.x,pp.y,(boost?1.28:1.0)/Math.max(.66,z),0,TAU);ctx.fill();ctx.shadowBlur=0}}"""
          engine = sub_once(engine, r"function drawEdge\(e,progress=1\)\{.*?\}\nfunction stateOfEdge", organic_edge + "\nfunction stateOfEdge", 'edge renderer', re.S)

          organic_node = """function drawNode(n){const z=camera.zoom;if(z<.15&&!n.rootNode&&!n.mine&&!n.encouraged)return;if(!inView(n.x,n.y,80))return;const st=stateOf(n),alive=st==='alive'||n.encouraged,pulse=1+(alive?Math.sin(tNow*.0018+hash(n.id)*.00001)*.08:0),tone=((hash('node-tone'+n.id)%1000)/1000-.5)*18,h=(n.root.hue+tone+360)%360;let r=(n.rootNode?3.7:(n.mine||n.received)?4.25:n.encouraged?2.35:alive?1.55:.95)*pulse/Math.max(.52,z);if(z>1.1)r*=1.12;ctx.fillStyle=(n.mine||n.received)?'#eee2c8':n.encouraged?'rgba(236,245,231,.90)':n.rootNode?`hsla(${h},62%,82%,.82)`:alive?`hsla(${h},58%,78%,.58)`:st==='dormant'?'rgba(166,181,202,.25)':'rgba(118,133,154,.13)';if(alive){ctx.shadowColor=(n.mine||n.received)?'rgba(239,220,178,.70)':n.encouraged?'rgba(229,244,233,.82)':`hsla(${h},55%,74%,.28)`;ctx.shadowBlur=((n.mine||n.received)?12:n.encouraged?13:3.5)/Math.max(.58,z)}ctx.beginPath();ctx.arc(n.x,n.y,r,0,TAU);ctx.fill();ctx.shadowBlur=0;if(world.selected?.id===n.id){const base=(tNow*.00042)%1;for(let i=0;i<3;i++){const p=(base+i/3)%1,rr=(12+p*48)/Math.max(.58,z),a=(1-p)*.24;ctx.strokeStyle=`rgba(195,224,228,${a})`;ctx.lineWidth=.72/Math.max(.58,z);ctx.beginPath();ctx.arc(n.x,n.y,rr,0,TAU);ctx.stroke()}ctx.strokeStyle='rgba(218,237,238,.50)';ctx.lineWidth=.72/Math.max(.58,z);ctx.beginPath();ctx.arc(n.x,n.y,r*2.35,0,TAU);ctx.stroke()}}"""
          engine = sub_once(engine, r"function drawNode\(n\)\{.*?\}\nfunction drawLabels", organic_node + "\nfunction drawLabels", 'node renderer', re.S)
          engine_path.write_text(engine)
          PY

      - name: Validate patched files
        run: |
          set -euo pipefail
          node --check raluvaaa-wish-classic/app.js
          grep -q 'setEncouraged' raluvaaa-wish-classic/app.js
          grep -q 'slots.length!==1' raluvaaa-wish-classic/app.js
          grep -q 'r<5\*3600000' raluvaaa-wish-classic/app.js
          grep -q 'node-tone' raluvaaa-wish-classic/engine-v03.html
          grep -q 'patina2' raluvaaa-wish-classic/engine-v03.html

      - name: Commit iteration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raluvaaa-wish-classic/app.js raluvaaa-wish-classic/engine-v03.html
          git commit -m 'Refine RALUVAAA organic palette and encouragement feedback'
          git push
