name: Install staged transparent logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-staged-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and install PNG
        shell: bash
        run: |
          base64 --decode assets/confluence-logo-final.b64 > assets/confluence-logo.png
          file assets/confluence-logo.png | grep 'PNG image data, 180 x 180'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/confluence-logo.png
          git commit -m "Install final transparent Confluence logo"
          git push
