name: Apply shared CoM typography layer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/typography-system-20260808.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach shared typography stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          link = '  <link rel="stylesheet" href="/typography-v1.css?v=20260808-v1" />'
          pages = [Path('index.html'), Path('fr/index.html')]
          pages += list(Path('confluences').rglob('*.html'))
          pages += list(Path('fr/confluences').rglob('*.html'))

          if len(pages) < 10:
              raise SystemExit(f'Expected CoM and Confluences pages, found only {len(pages)}')

          for page in pages:
              html = page.read_text(encoding='utf-8')
              if '/typography-v1.css?' not in html:
                  if '</head>' not in html:
                      raise SystemExit(f'Missing head close in {page}')
                  html = html.replace('</head>', link + '\n</head>', 1)
                  page.write_text(html, encoding='utf-8')

          for page in pages:
              html = page.read_text(encoding='utf-8')
              if '/typography-v1.css?v=20260808-v1' not in html:
                  raise SystemExit(f'Typography stylesheet missing from {page}')
          PY
      - name: Commit typography activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fr/index.html confluences fr/confluences
          if git diff --cached --quiet; then
            echo "Typography layer already active."
            exit 0
          fi
          git commit -m "Activate readable typography across CoM editorial pages"
          git push
