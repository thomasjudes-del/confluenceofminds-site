name: Materialize verified homepage trailer fallbacks
on:
  push:
    branches: [fix/com-real-trailer-fallback-20261022]
    paths: ['data/home-trailer-fallbacks.json', 'scripts/materialize-home-trailers.py', '.github/workflows/materialize-home-trailer-fallbacks.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/materialize-home-trailers.py
      - name: Commit only verified fallback assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/trailer-fallbacks/
          git diff --cached --quiet || git commit -m 'Materialize hash-verified original trailer fallbacks and real posters'
          git push origin HEAD:fix/com-real-trailer-fallback-20261022
