name: Check RALUVAAA Shared Alpha API

on:
  push:
    paths:
      - 'raluvaaa/alpha-api/**'
      - '.github/workflows/check-raluvaaa-alpha-api.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker and client syntax and invariants
        run: |
          node --check raluvaaa/alpha-api/worker.mjs
          node --check raluvaaa/alpha-api/client.mjs
          node --check raluvaaa/alpha-api/qa-shared.mjs
          grep -q "owner_required" raluvaaa/alpha-api/worker.mjs
          grep -q "proposal_consents" raluvaaa/alpha-api/worker.mjs
          grep -q "public_payload_json" raluvaaa/alpha-api/worker.mjs
          grep -q "already_encouraged" raluvaaa/alpha-api/worker.mjs
          grep -q "RaluvaaaAlphaClient" raluvaaa/alpha-api/client.mjs
      - name: Validate D1 schema with SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          schema = Path('raluvaaa/alpha-api/schema.sql').read_text()
          db = sqlite3.connect(':memory:')
          db.executescript(schema)
          names = {r[0] for r in db.execute("select name from sqlite_master where type='table'")}
          expected = {'actors','sessions','wishes','wish_events','encouragements','proposals','proposal_consents','notifications','reports'}
          missing = expected - names
          assert not missing, f'missing tables: {sorted(missing)}'
          print('RALUVAAA shared alpha D1 schema passed')
          PY
      - name: Run real two-client Worker + D1 QA locally
        working-directory: raluvaaa/alpha-api
        run: |
          npm init -y >/dev/null 2>&1
          npm install wrangler@4 >/dev/null 2>&1
          npx wrangler d1 execute raluvaaa-alpha --local --file=schema.sql --config=wrangler.ci.toml >/tmp/raluvaaa-d1.log 2>&1
          npx wrangler dev --local --config=wrangler.ci.toml --ip 127.0.0.1 --port 8787 >/tmp/raluvaaa-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $WORKER_PID || true' EXIT
          if ! node qa-shared.mjs; then
            echo '--- Worker log ---'
            cat /tmp/raluvaaa-worker.log || true
            echo '--- D1 log ---'
            cat /tmp/raluvaaa-d1.log || true
            exit 1
          fi
          if ! node qa-contract.mjs; then
            echo '--- Worker log ---'
            cat /tmp/raluvaaa-worker.log || true
            echo '--- D1 log ---'
            cat /tmp/raluvaaa-d1.log || true
            exit 1
          fi
