name: Install social preview v2

on:
  push:
    paths:
      - '.github/workflows/install-social-preview-v2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Render public social preview
        run: |
          rsvg-convert -w 1200 -h 630 assets/confluence-of-minds-social-preview-v2.svg -o /tmp/confluence-social-v2.png
          convert /tmp/confluence-social-v2.png -strip -quality 88 assets/confluence-of-minds-social-preview-v2.jpg
          test "$(identify -format '%wx%h' assets/confluence-of-minds-social-preview-v2.jpg)" = "1200x630"

      - name: Point metadata to v2
        run: python3 scripts/install_social_preview_v2.py

      - name: Commit social preview v2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/install-social-preview-v2.yml scripts/install_social_preview_v2.py
          git add index.html assets/confluence-of-minds-social-preview-v2.svg assets/confluence-of-minds-social-preview-v2.jpg .github/workflows/install-social-preview-v2.yml scripts/install_social_preview_v2.py
          git commit -m 'Use light social preview v2 for sharing'
          git push
