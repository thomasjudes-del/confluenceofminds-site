name: Generate SILMEA vertical social asset

on:
  push:
    paths:
      - "scripts/generate_silmea_vertical.py"
      - ".github/workflows/generate-silmea.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/generate_silmea_vertical.py
      - run: |
          mkdir -p assets/social/2026-09-19
          ffmpeg -y -framerate 30 -i tmp_silmea_frames/f%04d.jpg             -f lavfi -i "sine=frequency=110:sample_rate=48000:duration=12"             -f lavfi -i "sine=frequency=164.81:sample_rate=48000:duration=12"             -f lavfi -i "anoisesrc=color=pink:amplitude=0.015:duration=12:sample_rate=48000"             -filter_complex "[1:a]volume=0.055[a1];[2:a]volume=0.03[a2];[3:a]lowpass=f=900,volume=0.3[a3];[a1][a2][a3]amix=inputs=3:duration=longest,afade=t=in:st=0:d=1.2,afade=t=out:st=10.4:d=1.6[a]"             -map 0:v -map "[a]" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p             -c:a aac -b:a 160k -movflags +faststart -t 12             assets/social/2026-09-19/silmea-sound-cinema-vertical-1080x1920.mp4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/2026-09-19/silmea-sound-cinema-vertical-1080x1920.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add SILMEA vertical social asset"
          git pull --rebase origin main
          git push
