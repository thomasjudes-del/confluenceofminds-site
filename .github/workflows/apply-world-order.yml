name: Apply world order and R2 backgrounds

on:
  push:
    paths:
      - '.github/workflows/apply-world-order.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate R2 video objects
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/incident-on-titan-preview.mp4'
            'https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/Anjin_of_the_Shogun_Teaser_27s_HD.mp4'
            'https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/0%20Kashgar_Teaser_V3.mp4'
            'https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/Shattered_Dragons_Recap_Teaser_16x9.mp4'
            'https://pub-4af364e5f0b8401cade14d4e21fb0e19.r2.dev/A_la_recherche_de_Katephomi_Kitembe_Teaser.mp4'
          )
          for url in "${urls[@]}"; do
            headers=$(curl -fsSIL --retry 2 --retry-delay 1 "$url")
            printf '%s\n' "$headers" | grep -qi '^content-type: video/mp4'
            echo "Validated $url"
          done

      - name: Reorder cards and add video backgrounds
        run: python3 scripts/reorder_world_cards.py

      - name: Commit final page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-world-order.yml scripts/reorder_world_cards.py
          git add index.html .github/workflows/apply-world-order.yml scripts/reorder_world_cards.py
          git commit -m 'Reorder worlds and add R2 video backgrounds'
          git push
