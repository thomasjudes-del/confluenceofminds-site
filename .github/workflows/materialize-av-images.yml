name: Materialize AV images

on:
  push:
    paths:
      - 'authentiques-victimes/assets/av-hero-user-*.txt'
      - 'authentiques-victimes/assets/av-plagiarism-user-*.txt'
      - '.github/workflows/materialize-av-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode AV artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authentiques-victimes/assets/photos

          : > /tmp/hero.b64
          for i in $(seq 0 9); do
            cat "authentiques-victimes/assets/av-hero-user-${i}.txt" >> /tmp/hero.b64
          done
          tr -d '\r\n ' < /tmp/hero.b64 | base64 --decode > authentiques-victimes/assets/photos/hero.webp

          : > /tmp/plagiarism.b64
          for i in $(seq 0 14); do
            cat "authentiques-victimes/assets/av-plagiarism-user-${i}.txt" >> /tmp/plagiarism.b64
          done
          tr -d '\r\n ' < /tmp/plagiarism.b64 | base64 --decode > authentiques-victimes/assets/photos/plagiarism.webp

          test -s authentiques-victimes/assets/photos/hero.webp
          test -s authentiques-victimes/assets/photos/plagiarism.webp

          rm -f authentiques-victimes/assets/av-hero-user-*.txt
          rm -f authentiques-victimes/assets/av-plagiarism-user-*.txt

      - name: Commit binary artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authentiques-victimes/assets/photos
          git add -u authentiques-victimes/assets
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize AV artwork assets"
          git push
