name: Apply RALUVAAA V15 runtime corrections

on:
  push:
    paths:
      - '.github/workflows/fix-raluvaaa-v15.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('raluvaaa-wish-classic/app.js')
          s=p.read_text()
          def rep(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new)

          rep("""      if(best)parent.postMessage({type:'raluvaaa-wish-click',nodeId:best},location.origin);
    });""",
              """      if(best){
        parent.postMessage({type:'raluvaaa-wish-click',nodeId:best},location.origin);
      }else{
        world.selected=null;
        parent.postMessage({type:'raluvaaa-world-blank'},location.origin);
      }
    });""", 'blank canvas click')

          rep("""  if(e.data?.type==='raluvaaa-engine-ready'){bridge=frame.contentWindow.RV_BRIDGE;initWorld()}
  if(e.data?.type==='raluvaaa-wish-click'){const id=wishByNode.get(e.data.nodeId);if(id)openWish(id)}
});""",
              """  if(e.data?.type==='raluvaaa-engine-ready'){bridge=frame.contentWindow.RV_BRIDGE;initWorld()}
  if(e.data?.type==='raluvaaa-wish-click'){const id=wishByNode.get(e.data.nodeId);if(id)openWish(id)}
  if(e.data?.type==='raluvaaa-world-blank'){detail.classList.add('hidden')}
  if(e.data?.type==='raluvaaa-cycle-my-wish')cycleOwnWish()
  if(e.data?.type==='raluvaaa-control-hint')toast(e.data.label)
  if(e.data?.type==='raluvaaa-renderer-error')console.error('RALUVAAA renderer:',e.data.message)
});""", 'message handlers')

          old="""function makeEntrustedSlot(now){const bands=['hours','days','weeks'];return makeSlot(bands[Math.floor(Math.random()*bands.length)],now)}
function ensureEntrusted(){
  let slots=state.entrusted,now=Date.now();
  if(!Array.isArray(slots)||slots.length!==1)slots=[makeEntrustedSlot(now)];
  slots=slots.map(s=>s.expires<=now?makeEntrustedSlot(now):s);state.entrusted=slots;save();renderEntrusted();
}
function makeSlot(band,now){const pool=wishes.filter(w=>w.state!=='closed');const w=pool[Math.floor(Math.random()*pool.length)];const ms=band==='hours'?(1+Math.random()*17)*3600000:band==='days'?(1+Math.random()*5)*86400000:(6+Math.random()*10)*86400000;return{wishId:w.id,band,expires:now+ms}}
function remain(ms){if(ms<3600000)return Math.max(1,Math.ceil(ms/60000))+' min';if(ms<86400000)return Math.ceil(ms/3600000)+' h';return Math.ceil(ms/86400000)+' d'}
function renderEntrusted(){const now=Date.now();document.getElementById('entrustedGrid').innerHTML=state.entrusted.map(s=>{const w=wishById(s.wishId),r=s.expires-now;if(!w)return'';return `<button class=\"entrusted-item ${r<5*3600000?'urgent':''}\" data-wish=\"${w.id}\"><div class=\"t\">${esc(w.text)}</div><div class=\"m\">${remain(r)} left</div></button>`}).join('');document.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>focusWish(b.dataset.wish))}
setInterval(()=>{if(bridge)ensureEntrusted()},60000);
function focusWish(id){const w=wishById(id);if(!w)return;bridge.focus(w.nodeId);openWish(id)}
"""
          new="""const HOUR=3600000;
function ensureEntrusted(){
  const now=Date.now(),bands=['hours','days','weeks'];
  let slots=state.entrusted;
  if(!Array.isArray(slots)||slots.length!==3)slots=bands.map(b=>makeSlot(b,now));
  slots=slots.map((slot,i)=>slot.expires<=now?makeSlot(slot.band||bands[i],now):slot);
  state.entrusted=slots;save();renderEntrusted();
}
function makeSlot(band,now){const pool=wishes.filter(w=>w.state!=='closed');const w=pool[Math.floor(Math.random()*pool.length)];const ms=band==='hours'?(1+Math.random()*17)*HOUR:band==='days'?(1+Math.random()*5)*86400000:(6+Math.random()*10)*86400000;return{wishId:w.id,band,expires:now+ms}}
function remain(ms){
  const total=Math.max(0,Math.floor(ms/1000));
  if(total<60)return total+'s';
  const minutes=Math.floor(total/60),seconds=total%60;
  if(minutes<60)return minutes+'m '+String(seconds).padStart(2,'0')+'s';
  const hours=Math.floor(minutes/60),mins=minutes%60;
  if(hours<24)return hours+'h '+String(mins).padStart(2,'0')+'m';
  const days=Math.floor(hours/24),hrs=hours%24;
  return days+'d '+hrs+'h';
}
function renderEntrusted(){
  const now=Date.now(),grid=document.getElementById('entrustedGrid');
  grid.innerHTML=(state.entrusted||[]).map(slot=>{const w=wishById(slot.wishId),r=slot.expires-now;if(!w)return'';return `<button class=\"entrusted-item ${r<5*HOUR?'urgent':''}\" data-wish=\"${w.id}\"><div class=\"t\">${esc(w.text)}</div><div class=\"m\">${remain(r)} left</div></button>`}).join('');
  grid.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>focusWish(b.dataset.wish));
}
setInterval(()=>{if(!bridge)return;const now=Date.now();if((state.entrusted||[]).some(s=>s.expires<=now))ensureEntrusted();else renderEntrusted()},1000);
function focusWish(id){const w=wishById(id);if(!w)return;bridge.focus(w.nodeId);openWish(id)}
let ownWishCursor=-1;
function cycleOwnWish(){
  const mine=wishes.filter(w=>isClaimedOwner(w)&&w.state!=='closed');
  if(!mine.length){toast('Release or claim a wish first.');return;}
  ownWishCursor=(ownWishCursor+1)%mine.length;
  openWish(mine[ownWishCursor].id);
  toast((ownWishCursor+1)+'/'+mine.length+' · '+mine[ownWishCursor].text.slice(0,56)+(mine[ownWishCursor].text.length>56?'…':''));
}
"""
          rep(old,new,'entrusted timers')

          start=s.index('function openWish(id){')
          end=s.index('\nfunction requireIdentity',start)
          old=s[start:end]
          new="""function openWish(id){
  const w=wishById(id);if(!w)return;
  const own=isClaimedOwner(w),enc=state.encouraged.includes(w.id);
  const helped=state.suggestions.some(s=>s.wishId===w.id&&s.type==='HELP');
  const connected=(state.events||[]).some(e=>e.type==='connect'&&(e.a===w.id||e.b===w.id));
  const pivotSuggested=!own&&state.suggestions.some(s=>s.wishId===w.id&&s.type==='PIVOT');
  const splitSuggested=!own&&state.suggestions.some(s=>s.wishId===w.id&&s.type==='SPLIT');
  bridge.focus(w.nodeId);detail.classList.remove('hidden');
  const label=w.simulated?'SIMULATED TEST WISH':own?'YOUR WISH':w.owner?'UNCLAIMED LOCAL WISH':'A HUMAN INTENTION';
  const status=w.state==='bloom'?'Bloomed':w.state==='closed'?'Trace · let go':own?'Your living wish':'Living wish';
  detail.innerHTML=`<div class=\"detail-top\"><div><div class=\"eyebrow\">${label}</div><div class=\"wishtext\">${esc(w.text)}</div><div class=\"meta\">${esc(w.loc)} · ${fmtDate(w.date)}</div><div class=\"state\">${status}</div></div><button class=\"close\" id=\"closeDetail\">×</button></div><div class=\"actions\"><button class=\"action ${enc?'active':''}\" data-act=\"encourage\"><span class=\"ico\">${enc?'✦':'✧'}</span>${enc?'Encouraged':'Encourage'}</button><button class=\"action ${helped?'done':''}\" data-act=\"help\" ${helped?'disabled':''}><span class=\"ico\">↟</span>${helped?'Helped':'Help'}</button><button class=\"action ${connected?'done':''}\" data-act=\"connect\" ${connected?'disabled':''}><span class=\"ico\">⌁</span>${connected?'Connected':'Connect'}</button><button class=\"action ${pivotSuggested?'done':''}\" data-act=\"pivot\" ${pivotSuggested?'disabled':''}><span class=\"ico\">↝</span>${pivotSuggested?'Pivot suggested':'Pivot'}</button><button class=\"action ${splitSuggested?'done':''}\" data-act=\"split\" ${splitSuggested?'disabled':''}><span class=\"ico\">⑂</span>${splitSuggested?'Split suggested':'Split'}</button><button class=\"action\" data-act=\"share\"><span class=\"ico\">↗</span>Share</button></div>${own?`<div class=\"owner\"><h4>Only you decide what happens to this wish.</h4><div class=\"row\"><button class=\"soft\" data-act=\"bloom\">Bloom</button><button class=\"soft\" data-act=\"letgo\">Let go</button></div></div>`:w.owner&&!own?`<div class=\"owner\"><h4>This wish is not claimed yet.</h4><button class=\"soft\" data-act=\"claim\">Claim this wish</button></div>`:''}<div class=\"row\"><button class=\"soft\" data-act=\"report\">Flag as inappropriate</button></div>`;
  document.getElementById('closeDetail').onclick=()=>detail.classList.add('hidden');
  detail.querySelectorAll('[data-act]:not(:disabled)').forEach(b=>b.onclick=()=>act(b.dataset.act,w));
}"""
          s=s[:start]+new+s[end:]

          rep("""function showIdentity(next){modal(`<div class=\"eyebrow\">LIGHT IDENTITY</div><h2>Keep your place in the world.</h2><p>You can explore and encourage anonymously. To send text, manage wishes or help someone, RALUVAAA needs a private way to recognise you.</p><label>Email</label><input class=\"field\" id=\"idEmail\" type=\"email\" autocomplete=\"email\" placeholder=\"you@example.com\"><div class=\"note\">Test mode: no email is sent. The identity stays on this device. The shared version will use a persistent verified session.</div><div class=\"row\"><button class=\"soft\" id=\"cancelId\">Not now</button><button class=\"soft primary\" id=\"confirmId\">Continue</button></div>`);document.getElementById('cancelId').onclick=closeModal;document.getElementById('confirmId').onclick=()=>{const v=document.getElementById('idEmail').value.trim();if(!/^\\S+@\\S+\\.\\S+$/.test(v))return toast('Enter a valid email.');state.identity={email:v,created:Date.now()};save();closeModal();toast('Identity kept privately on this device.');next?.()}}""",
              """function showIdentity(next){modal(`<div class=\"eyebrow\">PRIVATE IDENTITY</div><h2>Identify privately to continue.</h2><p>Your email is used only to associate actions and wishes with you. It is never shown on a public wish.</p><label>Email</label><input class=\"field\" id=\"idEmail\" type=\"email\" autocomplete=\"email\" placeholder=\"you@example.com\"><div class=\"note\">Prototype: no email is sent. Once identified, this device remembers you.</div><div class=\"row\"><button class=\"soft\" id=\"cancelId\">Not now</button><button class=\"soft primary\" id=\"confirmId\">Continue</button></div>`);document.getElementById('cancelId').onclick=closeModal;document.getElementById('confirmId').onclick=()=>{const v=document.getElementById('idEmail').value.trim();if(!/^\\S+@\\S+\\.\\S+$/.test(v))return toast('Enter a valid email.');state.identity={email:v,created:Date.now()};save();closeModal();next?.()}}""", 'identity copy')

          rep("""state.suggestions.push({type,wishId:w.id,text,t:Date.now(),from:state.identity.email});save();closeModal();toast('Suggestion stored in this test.')""",
              """state.suggestions.push({type,wishId:w.id,text,t:Date.now(),from:state.identity.email});save();closeModal();openWish(w.id);toast('Suggestion stored in this test.')""", 'proposal refresh')

          rep("""state.events.push(ev);bridge.connect(from.nodeId,to.nodeId,ev.seed);save();closeModal();renderStats();toast('A human bridge now exists between these intentions.');""",
              """state.events.push(ev);bridge.connect(from.nodeId,to.nodeId,ev.seed);save();closeModal();renderStats();openWish(from.id);toast('A human bridge now exists between these intentions.');""", 'connect refresh')

          rep("""function reportWish(w){modal(`<div class=\"eyebrow\">REPORT</div><h2>Help keep the world safe.</h2><div class=\"choices\" id=\"reasons\"><button class=\"chip\">Hate or harassment</button><button class=\"chip\">Personal information</button><button class=\"chip\">Money or solicitation</button><button class=\"chip\">Sexual or violent content</button><button class=\"chip\">Spam</button><button class=\"chip\">Other</button></div><div class=\"row\"><button class=\"soft\" id=\"cancelR\">Cancel</button><button class=\"soft primary\" id=\"sendR\">Report</button></div>`);let reason='';document.querySelectorAll('#reasons .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#reasons .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');reason=c.textContent});document.getElementById('cancelR').onclick=closeModal;document.getElementById('sendR').onclick=()=>{if(!reason)return toast('Choose a reason.');state.reports.push({wishId:w.id,reason,t:Date.now()});save();closeModal();toast('Report stored for this test.')}}""",
              """function reportWish(w){modal(`<div class=\"eyebrow\">FLAG AS INAPPROPRIATE</div><h2>Help keep the world safe.</h2><div class=\"choices\" id=\"reasons\"><button class=\"chip\">Hate or harassment</button><button class=\"chip\">Personal information</button><button class=\"chip\">Money or solicitation</button><button class=\"chip\">Sexual or violent content</button><button class=\"chip\">Spam</button><button class=\"chip\">Other</button></div><div class=\"row\"><button class=\"soft\" id=\"cancelR\">Cancel</button><button class=\"soft primary\" id=\"sendR\">Flag</button></div>`);let reason='';document.querySelectorAll('#reasons .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#reasons .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');reason=c.textContent});document.getElementById('cancelR').onclick=closeModal;document.getElementById('sendR').onclick=()=>{if(!reason)return toast('Choose a reason.');state.reports.push({wishId:w.id,reason,t:Date.now()});save();closeModal();toast('Flag stored for this test.')}}""", 'flag wording')

          p.write_text(s)
          PY
          node --check raluvaaa-wish-classic/app.js

      - name: Commit runtime patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raluvaaa-wish-classic/app.js
          git commit -m 'Fix RALUVAAA interaction runtime'
          git push
