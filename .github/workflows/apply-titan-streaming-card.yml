name: Apply Titan streaming card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-titan-streaming-card.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify Titan preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          {
            head -c 8000 .titan-preview-upload/part00
            cat .titan-preview-upload/part01 .titan-preview-upload/part02 .titan-preview-upload/part03 .titan-preview-upload/part04
          } > /tmp/titan-preview.b64
          base64 --decode /tmp/titan-preview.b64 > assets/incident-on-titan-preview.mp4
          echo "6a7a0d82f5f795befbbe2a3a09a7dc22aaac25e8619d1a0f9b42d8b5c03becee  assets/incident-on-titan-preview.mp4" | sha256sum --check --strict
          test -s assets/incident-on-titan-preview.mp4

      - name: Add streaming card styles
        shell: bash
        run: |
          cat > cards-streaming-v1.css <<'CSS'
          /* Streaming-style Worlds cards — Titan pilot */
          .world-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            gap: 24px !important;
          }

          .world-card__meta [hidden] { display: none !important; }

          .world-card--streaming {
            position: relative;
            color: #fff;
            background: #070b10;
            border-color: rgba(23, 32, 31, .2);
            box-shadow: 0 22px 60px rgba(9, 14, 17, .18);
          }

          .world-card--streaming:hover {
            transform: translateY(-8px) scale(1.006);
            box-shadow: 0 34px 82px rgba(9, 14, 17, .28);
          }

          .world-card--streaming .world-cover {
            position: relative;
            aspect-ratio: 16 / 10;
            min-height: 0;
            overflow: hidden;
            isolation: isolate;
          }

          .world-card--streaming .world-cover > svg,
          .world-card--streaming .world-card__preview {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
          }

          .world-card--streaming .world-cover > svg {
            z-index: 0;
            transition: opacity .42s ease, transform 1.1s cubic-bezier(.2,.75,.2,1), filter .7s ease;
          }

          .world-card--streaming .world-card__preview {
            z-index: 1;
            display: block;
            opacity: 0;
            transform: scale(1.015);
            transition: opacity .42s ease, transform 1.4s cubic-bezier(.2,.75,.2,1);
            pointer-events: none;
          }

          .world-card--streaming.is-previewing .world-card__preview {
            opacity: 1;
            transform: scale(1.055);
          }

          .world-card--streaming.is-previewing .world-cover > svg {
            opacity: 0;
            transform: scale(1.025);
          }

          .world-card--streaming .world-card__scrim {
            position: absolute;
            z-index: 2;
            inset: 0;
            pointer-events: none;
            background:
              linear-gradient(180deg, rgba(3,7,10,.02) 0%, rgba(3,7,10,.04) 28%, rgba(3,7,10,.55) 62%, rgba(3,7,10,.97) 100%),
              linear-gradient(90deg, rgba(3,7,10,.18), transparent 55%);
          }

          .world-card--streaming .world-card__body {
            position: absolute;
            z-index: 3;
            inset: auto 0 0;
            min-height: 0 !important;
            padding: 22px 23px 19px !important;
            color: #fff;
            background: transparent;
            text-shadow: 0 2px 20px rgba(0,0,0,.4);
          }

          .world-card--streaming .world-card__meta {
            justify-content: flex-start;
            margin-bottom: 9px;
            color: rgba(255,255,255,.72);
          }

          .world-card--streaming h3 {
            color: #fff;
            font-size: clamp(29px, 2.15vw, 39px);
            line-height: .98;
          }

          .world-card--streaming p {
            display: -webkit-box;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            margin: 12px 0 15px;
            color: rgba(255,255,255,.82);
            font-size: 13px;
            line-height: 1.45;
          }

          .world-card--streaming button {
            color: #fff;
            border-top-color: rgba(255,255,255,.25);
            text-shadow: none;
          }

          @media (max-width: 980px) {
            .world-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
          }

          @media (max-width: 620px) {
            .world-grid { grid-template-columns: 1fr !important; }
            .world-card--streaming .world-cover { aspect-ratio: 4 / 3; }
            .world-card--streaming .world-card__body { padding: 20px !important; }
          }

          @media (prefers-reduced-motion: reduce) {
            .world-card--streaming .world-card__preview { display: none; }
          }
          CSS

      - name: Add Titan preview behaviour
        shell: bash
        run: |
          cat > cards-streaming-v1.js <<'JS'
          (() => {
            const titanCard = document.querySelector('.world-card--titan');
            if (!titanCard) return;

            document.querySelectorAll('.world-card__meta span').forEach((status) => {
              const value = status.textContent.trim().toLowerCase();
              if (['live', 'archive', 'instagram'].includes(value)) status.hidden = true;
            });

            const cover = titanCard.querySelector('.world-cover');
            const body = titanCard.querySelector('.world-card__body');
            if (!cover || !body || cover.querySelector('.world-card__preview')) return;

            titanCard.classList.add('world-card--streaming');

            const video = document.createElement('video');
            video.className = 'world-card__preview';
            video.muted = true;
            video.loop = true;
            video.playsInline = true;
            video.preload = 'metadata';
            video.setAttribute('aria-hidden', 'true');
            video.innerHTML = '<source src="assets/incident-on-titan-preview.mp4?v=20260805-1625" type="video/mp4">';

            const scrim = document.createElement('span');
            scrim.className = 'world-card__scrim';
            scrim.setAttribute('aria-hidden', 'true');

            cover.append(video, scrim, body);

            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reducedMotion) return;

            const startPreview = () => {
              const play = video.play();
              if (play && typeof play.then === 'function') {
                play.then(() => titanCard.classList.add('is-previewing')).catch(() => {});
              } else {
                titanCard.classList.add('is-previewing');
              }
            };

            const stopPreview = (reset = true) => {
              video.pause();
              titanCard.classList.remove('is-previewing');
              if (reset) {
                try { video.currentTime = 0; } catch (_) {}
              }
            };

            const desktopPointer = window.matchMedia('(hover: hover) and (pointer: fine)');
            if (desktopPointer.matches) {
              titanCard.addEventListener('pointerenter', startPreview);
              titanCard.addEventListener('pointerleave', () => stopPreview(true));
              titanCard.addEventListener('focusin', startPreview);
              titanCard.addEventListener('focusout', () => stopPreview(true));
              return;
            }

            const observer = new IntersectionObserver((entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting && entry.intersectionRatio >= .65) startPreview();
                else stopPreview(false);
              });
            }, { threshold: [0, .35, .65, 1] });

            observer.observe(titanCard);
          })();
          JS

      - name: Activate Titan streaming card
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = '  <link rel="stylesheet" href="cards-streaming-v1.css?v=20260805-1625" />\n'
          if 'cards-streaming-v1.css' not in html:
              marker = '  <link rel="stylesheet" href="styles.css?v=20260805-about-video-v1" />\n'
              if marker not in html:
                  raise SystemExit('Main stylesheet marker not found')
              html = html.replace(marker, marker + css, 1)

          script = '  <script src="cards-streaming-v1.js?v=20260805-1625"></script>\n'
          if 'cards-streaming-v1.js' not in html:
              marker = '</body>'
              if marker not in html:
                  raise SystemExit('Body closing tag not found')
              html = html.replace(marker, script + marker, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit focused card update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .titan-preview-upload
          rm -f .github/workflows/apply-titan-streaming-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add streaming-style Titan card preview"
          git push
