name: Apply exact 2026 AV preamble

on:
  push:
    paths:
      - '.github/workflows/av-preamble-2026.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replace only preamble text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('authentiques-victimes/index.html')
          s = path.read_text(encoding='utf-8')
          start = s.index('      <article class="preamble__text reveal"')
          end = s.index('      </article>', start) + len('      </article>')
          article = """      <article class="preamble__text reveal" style="width:min(1060px,100%);padding-left:clamp(28px,5vw,76px);padding-right:clamp(28px,5vw,76px);">
          <p>J'ai longtemps cru qu'une tête ça pesait lourd à cause de toutes les pensées qu'on mettait à l'intérieur.</p>
          <p>En dedans.</p>
          <p>Ça me semble même sacrément logique.</p>
          <p>Souvent, quand je voyais encore papa, il répétait « j'ai la tête lourde », quand il était fatigué de réfléchir et qu'il avait le front soucieux, trop occupé par ce qu'il voulait écrire.</p>
          <p>Ou dire.</p>
          <p>Ovaire-fine-king, elle appelait ça, maman. Je vous le dis comme elle le disait. Me demandez pas exactement ce que ça signifie. Ça veut dire « penser de trop », quelque chose comme ça.</p>
          <p>En gros.</p>
          <p>Maman disait que ça faisait de papa une sorte de génie. Mais moi, je vous avouerai que je m'en fiche pas mal. Je veux juste qu'il soit mon papa. Un génie, ça peut franchement pas être plus utile qu'un papa. Ça n'a pas de sens. Il faut avoir conscience des priorités. Remettre les choses à leur place.</p>
          <p>Bref – pour être sûr quand même, j'ai demandé à l'école pourquoi c'était lourd une tête.</p>
          <p>La maîtresse, elle a paru surprise, puis elle m'a expliqué en détail ce qui faisait le poids en dedans de la tête.</p>
          <p>Elle me l'a expliqué avec les mots de la Science.</p>
          <p>Une tête, ça pèse quelque chose comme 4 ou 5 kilos, pour votre gouverne. Et je dois avouer que quand j'ai dit ça à Lucien, il était bigrement étonné ! Qu'on puisse trouver un critère (en l'occurrence, le poids) qui permette de réunir une tête humaine et un sac de pommes de terre dans le même panier, c'est quand même sacrément fort.</p>
          <p>Le cerveau lui-même, ça fait dans les 1,5 kilos. Environ. Paraît même que celui-là des femmes est plus léger que celui-là des hommes. Mais aucun lien de cause à effet avec une différence d'intelligence qui pourrait exister entre les deux sexes.</p>
          <p>C'est que je vous vois venir.</p>
          <p>Bref – ce cerveau du poids d'un petit haltère, il est constitué de plusieurs lobes, protégés par le crâne, et il baigne bien gentiment dans le liquide CEPHALORACHIDIEN.</p>
          <p>(J'ai pris des notes, vous pouvez me croire sur parole).</p>
          <p>Donc – une tête, ça pèse diablement lourd à cause de l'os, du liquide, de la matière, de ça et de ça, et patati et patata. Je ne me rappelle pas de tout non plus, faut pas croire, j’suis pas sténo, comme disait maman.</p>
          <p>J'ai quand même que 9 ans et demi.</p>
          <p>Bientôt 10.</p>
          <p>En tout cas : céphalorachidien, ça m'a fait de l'effet.</p>
          <p>Faut quand même avouer que la Science elle en sait sacrément des choses, mais elle a toujours un peu de mal à le dire avec des mots simples.</p>
          <p>Bref – Une tête c'était lourd pour des tas de raisons, mais pas à cause des pensées, car, ça – d'après la maîtresse – ça, c'est très très très léger.</p>
          <p class="pause">Pause.</p>
          <p>Moi, j'ai du mal à m'en remettre. Je trouve ça vraiment vraiment paxadoral. (C'est Tristan, l'ami de papa qui m'a appris le mot !).</p>
          <p>Ouais, c'est paxadoral toute cette histoire.</p>
          <p>C'est pas possible que ce que l'on pense ne pèse rien alors que ça contient tellement ! Non ?</p>
          <p>Je veux dire… si vous me lisez, ça crée nécessairement des pensées que vous n’aviez pas forcément jusque-là, et c’est forcément plus lourd que si vous ne pensiez à rien juste avant ça ? Vous me suivez ?</p>
          <p>Ça n'a pas de sens. Mais alors pas du tout !</p>
          <p class="pause">Pause.</p>
          <p>Je pense que la maîtresse se trompe et que la Science dit parfois de grosses bêtises.</p>
          <p>Que c'est même à se demander si elle cherche pas à se convaincre elle-même en s'enfumant toute seule avec des mots compliqués. En se réfugiant derrière des concepts sans se demander s'il pourrait y avoir d'autres explications que ce qu'on a connu jusque-là.</p>
          <p>Attendez.</p>
          <p>Je vous arrête tout de suite.</p>
          <p>Les pensées d'une enfant c'est peut-être léger.</p>
          <p>Ça, j'dis pas. Faut avouer !</p>
          <p>Moi, souvent, c'est vrai, je pense quelque chose et puis, pfiou, un souffle, un courant d'air, et hop, ça s'est envolé.</p>
          <p>La pensée d'un enfant, c'est léger comme de la poussière de fée, fragile comme une bulle de savon. Ça éclate avant même d'avoir véritablement éclos. C'est même frustrant des fois, faut dire ce qui est. Je veux dire, tu veux faire une belle bulle de savon, la plus grosse de tout l’univers, et te regarder dans ses reflets arc-en-ciel tellement c’est beau, et puis, au moment où tu croyais vraiment y être arrivé… Clac… ça explose en pleine croissance et ça retombe en gouttelettes savonneuses qui collent aux mains et piquent les yeux.</p>
          <p>Bref – Je disais – les pensées des enfants, je veux bien que ça pèse des clopinettes.</p>
          <p>C'est normal aussi, faut y réfléchir !</p>
          <p>C'est parce qu’on est insouciants !</p>
          <p>C'est pour ça que la tête d'un enfant pèse pas des masses. Faut se servir de sa caboche !</p>
          <p>Et puis.</p>
          <p>Et puis…</p>
          <p>On grandit.</p>
          <p>Et, plus on grandit, plus ça devient pesant, parce que ça se remplit de plein de choses d'adultes.</p>
          <p>C'est logique.</p>
          <p>Liquide céphalorachidien ou pas.</p>
          <p>Moi, les rares fois où j'ai eu la sensation d'avoir la « tête lourde », maman disait comme ça qu'il fallait savoir se-changer-les-idées.</p>
          <p>C'est rigolo comme expression, je trouve.</p>
          <p>Qu'on puisse… changer… les idées.</p>
          <p>Comme ça.</p>
          <p>D'un coup de baguette magique.</p>
          <p>J'imagine que ça veut dire qu'on doit trouver le moyen de… de les… transformer. Qu'elles changent de forme et de nature profonde, comme les personnages de mes contes de fées.</p>
          <p>Métamorphosés.</p>
          <p class="pause">Pause.</p>
          <p>Je pense que papa, lui, il devait avoir des pensées terribles.</p>
          <p>Terribles.</p>
          <p>Glaciales.</p>
          <p>Des trucs affreux qu'il faut même pas essayer d'imaginer, que ça t'empêcherait de trouver le sommeil même en plein jour dans un pré fleuri de coquelicots.</p>
          <p>Ouais.</p>
          <p>Des pensées vraiment lourdes.</p>
          <p>Pesantes comme les pierres.</p>
          <p>Des pensées qui me font tellement de peine pour lui que j'en frissonne en vous l'écrivant.</p>
          <p class="pause">Pause.</p>
          <p>Bon, je suis têtue, faut dire ce qui est. Alors, j'ai encore creusé le sujet !</p>
          <p>C'est là que ça m'est venu.</p>
          <p>J'ai pensé que ce que maman pouvait vouloir dire par « changer les idées », c'était peut-être pas une transformation mais une histoire de… comment dire… une histoire de mouvement.</p>
          <p>D'échange !</p>
          <p>De migration et de remplacement !</p>
          <p>Me prenez pas pour une folle, hein !</p>
          <p>Je veux dire que, dans « changer », y a sûrement une notion d'échange.</p>
          <p>De substitution.</p>
          <p>Vous pigez le truc ?</p>
          <p>Alors, moi, une fois, je lui ai dit à papa.</p>
          <p>Ouais !</p>
          <p>Comme ça !</p>
          <p>Droit dans les yeux !</p>
          <p>Du haut de mes 9 ans.</p>
          <p>Parce que ça me semblait vraiment - vachement - super - hyper important de lui dire.</p>
          <p>Et que je pouvais peut-être le conseiller, moi aussi.</p>
          <p>Enfant ou pas.</p>
          <p>Cerveau léger ou pas.</p>
          <p>Je lui ai dit qu'il fallait qu'il apprenne à… « s'échanger les idées ! ».</p>
          <p>Il m'a regardé bizarrement, je vous raconte pas !</p>
          <p>J’ai agité les mains, je lui ai dit qu'il fallait du mouvement pour changer tout ça.</p>
          <p>Il fallait qu'il fasse de… l'exercice… du sport… pour que les méchantes pensées sortent par sa bouche en expirant fort - fort - fort comme quand on joue sans fin à la marelle.</p>
          <p>Et qu'il en inspire de nouvelles.</p>
          <p>Des idées plus pures.</p>
          <p>Que, peut-être, les mauvaises pensées pouvaient glisser sur sa peau et chevaucher sur le dos des gouttes de sueur avant de s'évaporer dans le vent.</p>
          <p>Pour laisser l'air pur et frais en déposer de plus jolies !</p>
          <p>Ouais… ça doit forcément être ça…</p>
          <p>Un mouvement.</p>
          <p>Une migration.</p>
          <p>Les pensées lourdes il faut qu'elles aillent ailleurs, qu'elles fassent la navette avec d'autres pensées qui prennent leur place. Les pensées pesantes s'envolent sur le dos de petits papillons très costauds qui les dispersent aux quatre vents, tandis que des nuées de libellules, invisibles aux yeux de la Science, larguent une fine bruine de pensées toutes gracieuses et légères. Fragiles comme le cristal. Douces comme des pétales de roses qu'on ose à peine effleurer du bout des doigts, de peur d'en faire disparaître la magie.</p>
          <p class="pause">Pause.</p>
          <p>Papa il a écouté.</p>
          <p>Et puis il a souri.</p>
          <p>Et ça… ça… ça m'a fait bigrement plaisir.</p>
          <p>Parce que je l'avais pas vu sourire comme ça depuis des milliards d'années.</p>
          <p>Depuis notre big bang à nous.</p>
          <p>Depuis le départ de maman.</p>
          <p>La fin d'un monde, le début d'un autre.</p>
          <p>Mais… il était déjà plus tout à fait là, papa.</p>
          <p>Les pensées de pierre s'étaient écrasées sur tout le reste, avalanche qui bouche pour toujours les accès aux sentiers fleuris.</p>
          <p>Il n'y avait plus de pensées heureuses.</p>
          <p>Plus de pensées légères.</p>
          <p class="pause">Pause.</p>
          <p>Papa est écrivain.</p>
          <p>Il dit que c'est son bonheur et sa malédiction.</p>
          <p>Que l'écriture peut être la clef tout autant que la serrure.</p>
          <p>Il a toujours répété ça… Et moi, je voyais pas trop le problème. Je veux dire s'il avait à la fois la clef et la serrure, ça semblait plutôt chouette, non ? Pouvoir entrouvrir le lourd portail quand il fallait aérer, ou bien fermer à double tour pour garder tout bien à l'abri des regards.</p>
          <p>Joindre l'intime à l'ouverture, unir l’intérieur à l’extérieur.</p>
          <p>La caverne aux quatre vents.</p>
          <p>Ça me semblait plutôt chouette.</p>
          <p class="pause">Pause.</p>
          <p>Papa, ton inspiration c'est la respiration des fées, des papillons, des libellules.</p>
          <p>Si tes pensées sont lourdes, qu'elles retrouvent leur liberté pour s'envoler au loin ou qu’elles s’enfoncent dans le sol et disparaissent au plus profond de la terre.</p>
          <p>C'est tout ce que je demande au ciel.</p>
          <p>Et comme ça,</p>
          <p>Peut-être,</p>
          <p>Oui – peut-être – que tu m'aimeras.</p>
          <p>Journal d'Opaline. 26 juillet 2019</p>
          <p>Au loin, sur des collines croulant sous le poids des fleurs, par-delà des chemins de pruniers éclatants et des tunnels d'orchidées, se referment des allées de rosiers. Elles laissent s'échapper l'ultime envol des cigales de l'été, qui s'élevant vers le firmament dans leur ballet désespéré, font fleurir dans leur sillage les roches et les pensées de pierre, trouant de sombres nuages, offrant au ciel triste une apothéose sous forme de reflets mordorés, au parfum subtil de Jade et au goût lumineux d'Opaline.</p>
          </article>"""
          path.write_text(s[:start] + article + s[end:], encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authentiques-victimes/index.html
          git diff --cached --quiet || git commit -m "Use exact 2026 AV preamble"
          git push
