name: Prepare RALUVAAA V46 share audio

on:
  push:
    paths:
      - '.github/workflows/prepare-raluvaaa-v46-share-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raluvaaa-v46-share-audio
  cancel-in-progress: true

jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build short Immersed excerpt
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl >/dev/null
          mkdir -p raluvaaa/solo-experience-v46/share-assets
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/carolcarriazo/incarnation-game/main/public/music/Immersed.mp3 \
            -o /tmp/Immersed.mp3
          ffmpeg -y -hide_banner -loglevel error \
            -ss 18 -t 4 -i /tmp/Immersed.mp3 \
            -vn -c:a aac -b:a 96k -movflags +faststart \
            raluvaaa/solo-experience-v46/share-assets/immersed-share.m4a
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 \
            raluvaaa/solo-experience-v46/share-assets/immersed-share.m4a | grep -q aac
      - name: Commit share audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raluvaaa/solo-experience-v46/share-assets/immersed-share.m4a
          git diff --cached --quiet && exit 0
          git commit -m 'RALUVAAA V46: add lightweight Immersed share audio'
          git push
