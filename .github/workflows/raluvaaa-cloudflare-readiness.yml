name: RALUVAAA Cloudflare readiness

on:
  push:
    paths:
      - '.github/workflows/raluvaaa-cloudflare-readiness.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN: missing"
            missing=1
          else
            echo "CLOUDFLARE_API_TOKEN: present"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID: missing"
            missing=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID: present"
          fi
          if [ "$missing" -ne 0 ]; then
            exit 2
          fi
          echo "RALUVAAA Cloudflare deployment credentials are available."
