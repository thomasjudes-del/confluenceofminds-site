name: Update AV preamble layout

on:
  push:
    paths:
      - '.github/workflows/av-preamble-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch preamble and audio only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('authentiques-victimes/index.html')
          s = path.read_text(encoding='utf-8')
          s = s.replace('<div class="preamble__head reveal">', '<div class="preamble__head reveal" style="max-width:980px;">', 1)
          s = s.replace('<article class="preamble__text reveal">', '<article class="preamble__text reveal" style="width:min(1060px,100%);padding-left:clamp(28px,5vw,76px);padding-right:clamp(28px,5vw,76px);">', 1)
          s = s.replace('<div class="youtube reveal" aria-label="Version audio du préambule">', '<div class="youtube reveal" aria-label="Version audio du préambule" style="display:block;width:min(1120px,100%);">', 1)
          s = s.replace('<div class="youtube__copy">', '<div class="youtube__copy" style="max-width:820px;margin:0 0 30px;">', 1)
          s = s.replace('<div class="youtube__player">', '<div class="youtube__player" style="width:100%;">', 1)
          path.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/av-preamble-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authentiques-victimes/index.html .github/workflows/av-preamble-layout.yml
          git commit -m "Widen AV preamble and audio player"
          git push
