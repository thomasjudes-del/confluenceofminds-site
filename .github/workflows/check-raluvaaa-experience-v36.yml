name: Check RALUVAAA Experience V36
on:
  push:
    paths:
      - 'raluvaaa/solo-experience-v36/**'
      - '.github/workflows/check-raluvaaa-experience-v36.yml'
  workflow_dispatch:
concurrency:
  group: raluvaaa-experience-v36-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          node --check raluvaaa/solo-experience-v36/experience-v36.js
          node --check raluvaaa/solo-experience-v36/qa-v36.cjs
          grep -q 'data-ui-version="36"' raluvaaa/solo-experience-v36/index.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run V36 QA
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/raluvaaa-v36-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          sleep 2
          node raluvaaa/solo-experience-v36/qa-v36.cjs
