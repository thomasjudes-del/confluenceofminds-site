<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020610">
<meta name="robots" content="noindex,nofollow">
<title>RALUVAAA · Wish World</title>
<link rel="stylesheet" href="ui.css?v=3">
<link rel="stylesheet" href="ui-v2.css?v=3">
</head>
<body>
<iframe id="engine" src="about:blank" title="RALUVAAA living world" allow="clipboard-write; web-share"></iframe>

<section id="brand" class="glass">
  <div class="logo">RALUVAAA</div>
  <div class="tag">a living map of <b>human intentions</b></div>
  <div class="pulse-head"><span>WORLD PULSE · TEST</span><button id="pulseMore">24H</button></div>
  <div id="stats" class="stats"></div>
  <div id="pulseNews" class="pulse-news"></div>
</section>

<div id="quickActions" aria-label="Wish actions">
  <button id="quickMyWorld" class="quickbtn" title="My world" aria-label="My world" data-tooltip="My world">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M6.5 19c.8-3.4 2.7-5.2 5.5-5.2s4.7 1.8 5.5 5.2"/></svg>
  </button>
  <button id="quickRelease" class="quickbtn" title="Release a wish" aria-label="Release a wish" data-tooltip="Release a wish">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<section id="entrusted" class="glass">
  <div class="entrusted-head">
    <strong>Entrusted to you</strong>
    <button id="entrustedCollapse" aria-label="Collapse entrusted wish" aria-expanded="true">
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div id="entrustedGrid" class="entrusted-grid"></div>
</section>

<nav id="dock" aria-hidden="true">
  <button id="myWorldBtn" class="soft">My world</button>
  <button id="createBtn" class="soft primary">+ Release a wish</button>
</nav>

<section id="detail" class="glass hidden" aria-live="polite"></section>
<div id="toastWrap"></div>
<div id="overlay"></div>

<script>
(function(){
  const marker='raluvaaaWishClassicV03Fresh';
  if(!localStorage.getItem(marker)){
    localStorage.removeItem('raluvaaaWishClassicV1');
    localStorage.setItem(marker,'1');
  }
})();
</script>
<script src="seed.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="ux-v2.js?v=3"></script>
<script>document.getElementById('engine').src='engine-v03.html?v=4';</script>
</body>
</html>
