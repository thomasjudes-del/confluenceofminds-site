<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020610">
<meta name="robots" content="noindex,nofollow">
<title>RALUVAAA · Wish World</title>
<link rel="stylesheet" href="ui.css?v=1">
</head>
<body>
<iframe id="engine" src="about:blank" title="RALUVAAA living world" allow="clipboard-write; web-share"></iframe>
<div id="veil"></div>
<section id="brand" class="glass">
  <div class="logo">RALUVAAA</div>
  <div class="tag">a living map of <b>human intentions</b></div>
  <div class="pulse-head"><span>WORLD PULSE · TEST</span><button id="pulseMore">24H</button></div>
  <div id="stats" class="stats"></div>
  <div id="pulseNews" class="pulse-news"></div>
</section>
<section id="entrusted" class="glass">
  <div class="entrusted-head"><strong>3 wishes entrusted to you</strong><span>random · temporary</span></div>
  <div id="entrustedGrid" class="entrusted-grid"></div>
</section>
<nav id="dock">
  <button id="myWorldBtn" class="soft">My world</button>
  <button id="createBtn" class="soft primary">+ Release a wish</button>
</nav>
<section id="detail" class="glass hidden" aria-live="polite"></section>
<div id="toastWrap"></div>
<div id="overlay"></div>
<script src="seed.js?v=1"></script>
<script src="app.js?v=1"></script>
<script>document.getElementById('engine').src='engine.html?v=1';</script>
</body>
</html>
