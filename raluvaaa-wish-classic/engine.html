<script>
const $=s=>document.querySelector(s), TAU=Math.PI*2; const canvas=$('#world'),ctx=canvas.getContext('2d'),mini=$('#mini'),mctx=mini.getContext('2d'); let W=0,H=0,DPR=1,tNow=0,anim=null,statusTimer=null,lastFrame=0; const hues=[207,267,313,40,181,286,221,12,160]; const rootNames=['Root A','Root B','Root C','Root D','Root E','Root F','Root G','Root H'];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function lerp(a,b,t){return a+(b-a)*t}function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function rng(seed){return()=>{let t=seed+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}function qpt(e,t){const u=1-t;return{x:u*u*e.x0+2*u*t*e.cx+t*t*e.x1,y:u*u*e.y0+2*u*t*e.cy+t*t*e.y1}}function setStatus(html){$('#status').innerHTML=html;clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('#status').innerHTML='Explore · grow · <strong>pass it on</strong>',3500)}function ageLabel(h){if(h<1)return Math.max(1,Math.round(h*60))+'m ago';if(h<24)return (Math.round(h*10)/10)+'h ago';return (Math.round(h/2.4)/10)+'d ago'}function edgeGeom(x,y,a,len,curve){const x1=x+Math.cos(a)*len,y1=y+Math.sin(a)*len,mx=(x+x1)/2,my=(y+y1)/2;return{x0:x,y0:y,cx:mx-Math.sin(a)*len*curve,cy:my+Math.cos(a)*len*curve,x1,y1}}
const world={roots:[],nodes:[],edges:[],tips:[],clock:0,next:1,humans:0,myTip:null,selected:null,history:[]}; function addNode(n){world.nodes.push(n);return n}function addEdge(e){world.edges.push(e);return e}function rootNode(root){return world.nodes.find(n=>n.id===root.nodeId)}
function addRoot(x,y,label){const idx=world.roots.length,hue=hues[idx%hues.length],id='r'+world.next++;const root={id,index:idx,label:label||rootNames[idx]||('Root '+(idx+1)),x,y,hue,nodeId:id};world.roots.push(root);const n=addNode({id,root,parentId:null,x,y,angle:0,generation:0,created:world.clock,lastActive:world.clock,children:[],mutation:'root',rootNode:true});const R=rng(hash(id));for(let k=0;k<12;k++){const stub={...n,id:id+'s'+k,angle:k*TAU/12+(R()-.5)*.42,generation:0};grow(stub,R()<.48?'bend':R()<.82?'split':'bloom',R,false)}return root}
function grow(parent,type,R=rng(hash(parent.id+world.next)),mine=false){const root=parent.root;let radial=Math.atan2(parent.y-root.y,parent.x-root.x);if(parent.generation<2)radial=parent.angle;let dev=(R()-.5)*(type==='split'?1.65:type==='bloom'?1.18:.92);if(type==='bend')dev+=(R()<.5?-1:1)*(.08+R()*.34);let a=parent.angle*.42+radial*.28+(radial+dev)*.30;let len=(67+R()*54)*Math.pow(.968,Math.max(0,parent.generation-4));if(type==='bloom')len*=.68;const e=edgeGeom(parent.x,parent.y,a,len,(R()-.5)*.44);e.id='e'+world.next++;e.root=root;e.parentId=parent.id;e.hue=(root.hue+parent.generation*1.05+(R()-.5)*12)%360;e.generation=parent.generation+1;e.created=world.clock;e.lastActive=world.clock;e.mine=mine;e.type=type;e.seed=hash(e.id);e.micro=[];const microN=type==='bloom'?10:type==='split'?6:3;for(let i=0;i<microN;i++){const tt=.42+R()*.54,p=qpt(e,tt),side=(i%2?1:-1),aa=a+side*(.28+R()*(type==='bloom'?1.45:.82))+(R()-.5)*.25,ll=(type==='bloom'?11:7)+R()*(type==='bloom'?31:20);e.micro.push(edgeGeom(p.x,p.y,aa,ll,(R()-.5)*.65))}addEdge(e);const n=addNode({id:'n'+world.next++,root,parentId:parent.id,edgeId:e.id,x:e.x1,y:e.y1,angle:a,generation:parent.generation+1,created:world.clock,lastActive:world.clock,children:[],mutation:type,mine});const pn=world.nodes.find(v=>v.id===parent.id);if(pn)pn.children.push(n.id);world.tips=world.tips.filter(v=>v.id!==parent.id);world.tips.push(n);if(R()<.39)world.tips.push({...parent});world.humans++;return{node:n,edge:e}}
function pickTip(R){if(!world.tips.length)return null;let best=null,sum=0,arr=[];for(const n of world.tips){const w=(1.15+Math.max(0,13-n.generation)*.06)*(n.children?.length?0.65:1.35);sum+=w;arr.push([n,w])}let v=R()*sum;for(const [n,w] of arr){v-=w;if(v<=0){best=n;break}}return best||arr[arr.length-1][0]}function stateOf(n){if(n.rootNode)return'alive';const age=world.clock-n.lastActive;return age<28||n.mine?'alive':age<86?'dormant':'fossil'}
function buildCluster(root,count,seed){const R=rng(seed);for(let i=0;i<count;i++){world.clock+=.035+R()*.035;const p=pickTipForRoot(root,R);if(!p)continue;const r=R(),type=r<.39?'bend':r<.73?'split':'bloom';const out=grow(p,type,R,false);if(type==='split'&&R()<.52){const ghost={...out.node,id:out.node.id+'x',angle:out.node.angle+(R()<.5?-1:1)*(.62+R()*.72),generation:Math.max(0,out.node.generation-1)};grow(ghost,R()<.58?'bend':R()<.82?'split':'bloom',R,false)}if(R()<.05&&i>35){const fork={...p,id:p.id+'f'+i,angle:p.angle+(R()<.5?-1:1)*(.75+R()*.65)};grow(fork,R()<.6?'bend':'bloom',R,false)}}}
function pickTipForRoot(root,R){const a=world.tips.filter(t=>t.root===root);if(!a.length)return rootNode(root);return a[Math.floor(R()*a.length)]}
function simulate(n,animate=true){const R=rng(hash('sim'+world.clock+n+world.edges.length)),before=world.edges.length;for(let i=0;i<n;i++){world.clock+=.08+R()*.08;const p=pickTip(R);if(!p)break;const r=R(),type=r<.45?'bend':r<.79?'split':'bloom';grow(p,type,R,false)}if(animate)anim={edges:world.edges.slice(before,Math.min(world.edges.length,before+30)),start:performance.now(),dur:1450};updateStats()}
function reset(){world.roots=[];world.nodes=[];world.edges=[];world.tips=[];world.clock=0;world.next=1;world.humans=0;world.history=[];world.selected=null;anim=null;const positions=[[-520,-160],[-920,390],[40,-590],[820,-250],[650,520],[-110,650]];for(let i=0;i<positions.length;i++){const r=addRoot(positions[i][0],positions[i][1],rootNames[i]);buildCluster(r,182+i*12,9137+i*111)}world.clock+=38;for(const e of world.edges){const q=(hash('age-e-'+e.id)%1000)/1000;const age=q<.46?q/0.46*24:q<.82?32+(q-.46)/.36*46:94+(q-.82)/.18*72;e.lastActive=world.clock-age}for(const n of world.nodes){if(n.rootNode){n.lastActive=world.clock;continue}const q=(hash('age-n-'+n.id)%1000)/1000;const age=q<.46?q/0.46*24:q<.82?32+(q-.46)/.36*46:94+(q-.82)/.18*72;n.lastActive=world.clock-age}const R=rng(711);world.myTip=pickTipForRoot(world.roots[0],R);world.myTip.lastActive=world.clock;const myEdge=world.edges.find(e=>e.id===world.myTip.edgeId);if(myEdge)myEdge.lastActive=world.clock;world.selected=world.myTip;camera.fit();updateStats();showMutations();setStatus('You received one living branch. <strong>Change one thing.</strong>')}
function addNewRoot(){const R=rng(hash('newroot'+world.roots.length+world.clock)),a=R()*TAU,rad=1050+R()*500,r=addRoot(Math.cos(a)*rad,Math.sin(a)*rad,rootNames[world.roots.length]||('Root '+(world.roots.length+1)));buildCluster(r,95,hash(r.id));camera.fit();updateStats();setStatus('A new independent root entered the world.')}function ageWorld(){world.clock+=38;updateStats();setStatus('Time advanced. <strong>Living color recedes, fossil memory remains.</strong>')}
function myMutate(type){if(anim)return;const p={...world.myTip},beforeE=world.edges.length,beforeN=world.nodes.length;world.clock+=.1;const out=grow(p,type,rng(hash('mine'+type+world.clock)),true);world.myTip=out.node;world.selected=out.node;world.history.push({prev:p,edgeIds:world.edges.slice(beforeE).map(e=>e.id),nodeIds:world.nodes.slice(beforeN).map(n=>n.id)});anim={edges:world.edges.slice(beforeE),start:performance.now(),dur:1250};$('#mutations').style.display='none';$('#after').classList.add('show');camera.focus(out.node,false);updateStats();setStatus(`You changed it: <strong>${type.toUpperCase()}</strong>. Now another human must continue it.`)}function undo(){const h=world.history.pop();if(!h)return;world.edges=world.edges.filter(e=>!h.edgeIds.includes(e.id));world.nodes=world.nodes.filter(n=>!h.nodeIds.includes(n.id));world.tips=world.tips.filter(n=>!h.nodeIds.includes(n.id));world.myTip=h.prev;world.selected=h.prev;world.tips.push(h.prev);world.humans=Math.max(0,world.humans-h.nodeIds.length);anim=null;showMutations();camera.focus(world.myTip,false);updateStats();setStatus('Back to the received point. Try another mutation.')}function showMutations(){$('#mutations').style.display='grid';$('#after').classList.remove('show')}
const camera={x:0,y:0,zoom:.5,min:.025,max:18,worldToScreen(x,y){return{x:(x-this.x)*this.zoom+W/2,y:(y-this.y)*this.zoom+H/2}},screenToWorld(x,y){return{x:(x-W/2)/this.zoom+this.x,y:(y-H/2)/this.zoom+this.y}},zoomAt(f,sx=W/2,sy=H/2){const a=this.screenToWorld(sx,sy);this.zoom=clamp(this.zoom*f,this.min,this.max);const b=this.screenToWorld(sx,sy);this.x+=a.x-b.x;this.y+=a.y-b.y;updateStats()},focus(n,deep=false){this.x=n.x;this.y=n.y;if(deep)this.zoom=Math.max(this.zoom,2.4);else this.zoom=Math.max(this.zoom,.72);updateStats()},fit(){if(!world.nodes.length)return;let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;for(const n of world.nodes){minx=Math.min(minx,n.x);maxx=Math.max(maxx,n.x);miny=Math.min(miny,n.y);maxy=Math.max(maxy,n.y)}const px=220,py=180;this.x=(minx+maxx)/2;this.y=(miny+maxy)/2;this.zoom=clamp(Math.min(W/(maxx-minx+px*2),H/(maxy-miny+py*2)),this.min,.85);updateStats()}}
function resize(){const r=canvas.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.6);W=r.width;H=r.height;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);mini.width=Math.max(1,Math.round((mini.clientWidth||200)*DPR));mini.height=Math.max(1,Math.round((mini.clientHeight||110)*DPR));updateStats()}function updateStats(){const gen=Math.max(0,...world.nodes.map(n=>n.generation||0));$('#sHumans').textContent=world.humans.toLocaleString();$('#sNodes').textContent=world.nodes.length.toLocaleString();$('#sRoots').textContent=world.roots.length;$('#sGen').textContent=gen;$('#sAge').textContent=(Math.round(world.clock*10)/10)+'h';$('#sZoom').textContent=camera.zoom<1?camera.zoom.toFixed(2)+'x':camera.zoom.toFixed(1)+'x';$('#scaleLabel').textContent=Math.round(160/camera.zoom).toLocaleString()+' world units';const z=camera.zoom;$('#lod').textContent=z<.10?'CONSTELLATION':z<.30?'ROOTS + MEMORY':z<1.15?'LINEAGES':z<3?'NODES + FIBERS':'MICROFILAMENTS'}
function drawBackground(){const g=ctx.createRadialGradient(W*.52,H*.44,0,W*.52,H*.44,Math.max(W,H)*.78);g.addColorStop(0,'#071728');g.addColorStop(.42,'#04101d');g.addColorStop(.72,'#020b15');g.addColorStop(1,'#01050d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<230;i++){const x=(hash('sx'+i)%10000)/10000*W,y=(hash('sy'+i*11)%10000)/10000*H,a=.018+((hash('sa'+i)%100)/100)*.055;ctx.fillStyle=`rgba(196,222,255,${a})`;ctx.fillRect(x,y,i%29===0?1.5:.7,i%29===0?1.5:.7)}}
function rootHalo(r){const s=camera.worldToScreen(r.x,r.y);if(s.x<-420||s.x>W+420||s.y<-420||s.y>H+420)return;const count=world.nodes.filter(n=>n.root===r).length,z=camera.zoom,breath=1+Math.sin(tNow*.00105+r.index*1.7)*.075;let rad=(138+Math.sqrt(count)*18)*z*breath;rad=clamp(rad,34,390);ctx.save();ctx.globalCompositeOperation='lighter';for(let layer=0;layer<4;layer++){const ox=Math.cos(r.index*2.3+layer)*rad*.07,oy=Math.sin(r.index*1.7+layer)*rad*.06,rr=rad*(1-layer*.14);const gr=ctx.createRadialGradient(s.x+ox,s.y+oy,0,s.x+ox,s.y+oy,rr);gr.addColorStop(0,`hsla(${r.hue+layer*7},100%,84%,${.23-layer*.028})`);gr.addColorStop(.14,`hsla(${r.hue+layer*5},100%,72%,${.15-layer*.018})`);gr.addColorStop(.42,`hsla(${r.hue},96%,58%,${.065-layer*.008})`);gr.addColorStop(.72,`hsla(${r.hue},92%,50%,.018)`);gr.addColorStop(1,`hsla(${r.hue},80%,45%,0)`);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(s.x+ox,s.y+oy,rr,0,TAU);ctx.fill()}const coreR=clamp(rad*.28,26,96),core=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,coreR);core.addColorStop(0,'rgba(255,255,250,.78)');core.addColorStop(.12,`hsla(${r.hue},100%,88%,.62)`);core.addColorStop(.42,`hsla(${r.hue},100%,68%,.21)`);core.addColorStop(1,`hsla(${r.hue},95%,60%,0)`);ctx.fillStyle=core;ctx.beginPath();ctx.arc(s.x,s.y,coreR,0,TAU);ctx.fill();const R=rng(hash('dust'+r.id));const dustN=Math.min(160,72+Math.floor(count/2.8));for(let i=0;i<dustN;i++){const aa=R()*TAU,rr=Math.pow(R(),.68)*rad*.98,px=s.x+Math.cos(aa)*rr,py=s.y+Math.sin(aa)*rr*(.7+R()*.55),sz=.4+R()*(z<.25?2.1:1.45),tw=.48+.52*Math.sin(tNow*.00135+i*1.7+r.index);ctx.fillStyle=`hsla(${r.hue+R()*50-25},100%,84%,${.08+R()*.28*tw})`;ctx.shadowColor=`hsla(${r.hue},100%,72%,.72)`;ctx.shadowBlur=3+R()*6;ctx.beginPath();ctx.arc(px,py,sz,0,TAU);ctx.fill();ctx.shadowBlur=0}const rays=z<.12?18:34;for(let i=0;i<rays;i++){const a=(i/rays)*TAU+(hash(r.id+i)%100)/900,rr=rad*(.24+((hash('rr'+r.id+i)%100)/100)*.5),x2=s.x+Math.cos(a)*rr,y2=s.y+Math.sin(a)*rr;ctx.strokeStyle=`hsla(${r.hue+(i%3-1)* function inView(x,y,pad=0){const s=camera.worldToScreen(x,y);return s.x>-pad&&s.x<W+pad&&s.y>-pad&&s.y<H+pad}
function drawMemoryField(){const z=camera.zoom;if(z<.045)return;ctx.save();ctx.lineCap='round';for(const r of world.roots){if(!inView(r.x,r.y,780))continue;const R=rng(hash('memory-'+r.id)),count=z<.11?32:z<.45?72:96;for(let i=0;i<count;i++){const a=R()*TAU,inner=24+R()*135,outer=inner+90+R()*410,bend=(R()-.5)*1.45;const x0=r.x+Math.cos(a)*inner,y0=r.y+Math.sin(a)*inner;const a2=a+bend*.48,ex=r.x+Math.cos(a+bend*.28)*outer,ey=r.y+Math.sin(a+bend*.28)*outer;const cx=r.x+Math.cos(a2)*(inner+outer)*.52,cy=r.y+Math.sin(a2)*(inner+outer)*.52;const alpha=(.052+R()*.072)*(z<.2?.9:1);ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(cx,cy,ex,ey);ctx.strokeStyle=R()<.22?`hsla(${r.hue},38%,65%,${alpha*.72})`:`rgba(125,147,178,${alpha})`;ctx.lineWidth=(.36+R()*.46)/Math.max(.42,z);ctx.stroke();if(z>.38&&R()<.4){const t=.45+R()*.4,p={x:lerp(x0,ex,t),y:lerp(y0,ey,t)},aa=a+bend+(R()<.5?-1:1)*(.7+R()*.7),ll=18+R()*58;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x+Math.cos(aa)*ll*.5,p.y+Math.sin(aa)*ll*.5,p.x+Math.cos(aa)*ll,p.y+Math.sin(aa)*ll);ctx.strokeStyle='rgba(128,148,174,.052)';ctx.lineWidth=.34/Math.max(.5,z);ctx.stroke()}}}ctx.restore()}
function pathEdge(e,progress=1,offset=0,wobble=0){const ph=hash(e.id)%628/100,tt=tNow*.0012+ph;const nx=-(e.y1-e.y0),ny=(e.x1-e.x0),len=Math.hypot(nx,ny)||1,ox=nx/len*offset,oy=ny/len*offset;const wc=Math.sin(tt)*wobble;ctx.beginPath();ctx.moveTo(e.x0+ox,e.y0+oy);if(progress>=.999)ctx.quadraticCurveTo(e.cx+ox+wc,e.cy+oy+wc*.3,e.x1+ox,e.y1+oy);else{const p=qpt(e,progress),c={x:lerp(e.x0,e.cx,progress),y:lerp(e.y0,e.cy,progress)};ctx.quadraticCurveTo(c.x+ox+wc,c.y+oy+wc*.3,p.x+ox,p.y+oy)}}
function drawEdge(e,progress=1){if(!inView((e.x0+e.x1)/2,(e.y0+e.y1)/2,220/camera.zoom))return;const z=camera.zoom,state=stateOfEdge(e),alive=state==='alive',fossil=state==='fossil';const breath=alive?(1+Math.sin(tNow*.00165+e.seed*.000011)*.11):1;const macro=z<.11,mid=z<.38;if(macro&&e.generation>7)return;if(mid&&e.generation>14&&e.type==='bloom')return;ctx.lineCap='round';if(alive){const alpha=e.mine?.96:clamp(.38+.30*Math.min(1,z*.85),.38,.68);if(e.generation<6||e.mine||e.seed%5===0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=e.mine?'rgba(255,226,170,.12)':`hsla(${e.hue},96%,64%,${.085*breath})`;ctx.lineWidth=(e.mine?8:5.2)/Math.max(.36,z);ctx.shadowColor=e.mine?'rgba(255,222,155,.8)':`hsla(${e.hue},100%,67%,.65)`;ctx.shadowBlur=(e.mine?24:18)/Math.max(.42,z);pathEdge(e,progress,0,.55/Math.max(.55,z));ctx.stroke();ctx.restore()}ctx.shadowColor=e.mine?'rgba(255,226,175,.92)':`hsla(${e.hue},96%,72%,.7)`;ctx.shadowBlur=(e.mine?18:9)*breath/Math.max(.4,z);ctx.strokeStyle=e.mine?'rgba(255,240,208,.95)':`hsla(${e.hue},94%,77%,${alpha*breath})`;ctx.lineWidth=(e.mine?2.05:1.15)/Math.max(.45,z);pathEdge(e,progress,0,.52/Math.max(.6,z));ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle=`rgba(236,246,255,${alpha*.32})`;ctx.lineWidth=.44/Math.max(.55,z);pathEdge(e,progress);ctx.stroke();if(z>.48){for(let f=0;f<3;f++){const side=f===0?-1:f===1?1:0;ctx.strokeStyle=`hsla(${e.hue+(f-1)*13},82%,72%,${alpha*(f===2?.035:.075)})`;ctx.lineWidth=.30/Math.max(.6,z);pathEdge(e,progress,side*(1.2+f*.55)/Math.max(.72,z),.34/Math.max(.8,z));ctx.stroke()}}}else{ctx.shadowBlur=0;const base=fossil?.082:.17;for(let f=-2;f<=2;f++){ctx.strokeStyle=fossil?`rgba(108,128,155,${base*(f===0?1:.58)})`:`rgba(137,158,188,${base*(f===0?1:.62)})`;ctx.lineWidth=(f===0?.68:.38)/Math.max(.48,z);pathEdge(e,1,f*1.05/Math.max(.68,z),.32/Math.max(.75,z));ctx.stroke()}}if(z>.46&&progress>.98){const microMax=z>2.7?e.micro.length:Math.min(e.micro.length,alive?4:2);for(let i=0;i<microMax;i++){const m=e.micro[i];ctx.beginPath();ctx.moveTo(m.x0,m.y0);ctx.quadraticCurveTo(m.cx,m.cy,m.x1,m.y1);ctx.strokeStyle=alive?`hsla(${e.hue+(i%3-1)*10},84%,76%,${z>2.7?.20:.095})`:`rgba(116,137,164,${fossil?.025:.045})`;ctx.lineWidth=.48/Math.max(.7,z);ctx.stroke();if(z>2.2&&alive&&i%2===0){ctx.fillStyle=`hsla(${e.hue},96%,84%,.46)`;ctx.beginPath();ctx.arc(m.x1,m.y1,.9/Math.max(.9,z),0,TAU);ctx.fill()}}}if(alive&&z>.24&&progress>.98&&(e.mine||e.seed%11===0)){const phase=(tNow*.00018+e.seed*.0000007)%1,pp=qpt(e,phase);ctx.fillStyle=e.mine?'rgba(255,247,220,.92)':`hsla(${e.hue},98%,88%,.74)`;ctx.shadowColor=e.mine?'rgba(255,226,165,.95)':`hsla(${e.hue},100%,75%,.85)`;ctx.shadowBlur=12/Math.max(.58,z);ctx.beginPath();ctx.arc(pp.x,pp.y,(e.mine?1.5:1.05)/Math.max(.66,z),0,TAU);ctx.fill();ctx.shadowBlur=0}}
function stateOfEdge(e){const a=world.clock-e.lastActive;return a<28||e.mine?'alive':a<86?'dormant':'fossil'}
function drawNode(n){const z=camera.zoom;if(!inView(n.x,n.y,70))return;const st=stateOf(n),alive=st==='alive';if(z<.16&&!n.rootNode&&!n.mine)return;if(z<.42&&!n.rootNode&&!n.mine&&hash(n.id)%7!==0)return;if(z<.9&&!n.rootNode&&!n.mine&&hash(n.id)%3!==0)return;const pulse=1+(alive?Math.sin(tNow*.0019+hash(n.id)*.000013)*.10:0);let r=(n.rootNode?4.8:n.mine?4.7:alive?1.35:.92)*pulse/Math.max(.52,z);if(z>1.1)r*=1.12;ctx.fillStyle=n.mine?'#fff0c9':n.rootNode?`hsla(${n.root.hue},100%,88%,.96)`:alive?`hsla(${n.root.hue},96%,84%,.68)`:st==='dormant'?'rgba(166,184,210,.22)':'rgba(112,132,160,.12)';if(n.rootNode||n.mine){ctx.shadowColor=n.mine?'rgba(255,222,156,.98)':`hsla(${n.root.hue},100%,76%,.92)`;ctx.shadowBlur=(n.mine?22:20)/Math.max(.55,z)}else if(alive&&z>.7){ctx.shadowColor=`hsla(${n.root.hue},100%,75%,.55)`;ctx.shadowBlur=6/Math.max(.6,z)}ctx.beginPath();ctx.arc(n.x,n.y,r,0,TAU);ctx.fill();ctx.shadowBlur=0;if(world.selected?.id===n.id){ctx.strokeStyle='rgba(164,246,255,.92)';ctx.lineWidth=1.1/Math.max(.55,z);ctx.beginPath();ctx.arc(n.x,n.y,r*2.8,0,TAU);ctx.stroke()}}
function drawLabels(){const z=camera.zoom;if(z<.075)return;ctx.save();ctx.textBaseline='middle';for(const r of world.roots){const s=camera.worldToScreen(r.x,r.y);if(s.x<-80||s.x>W+80||s.y<-60||s.y>H+60)continue;const count=world.nodes.filter(n=>n.root===r).length;ctx.fillStyle='rgba(205,221,244,.68)';ctx.font=(z<.2?'10':'11')+'px Inter,system-ui';ctx.fillText(`${r.label} (${count})`,s.x+12,s.y-15)}if(z>2.1){ctx.fillStyle='rgba(220,232,248,.48)';ctx.font='9px Inter,system-ui';let shown=0;for(const n of world.nodes){if(shown>60)break;if(n.rootNode||!inView(n.x,n.y,20))continue;const s=camera.worldToScreen(n.x,n.y);ctx.fillText(`g${n.generation} · ${ageLabel(world.clock-n.created)}`,s.x+7,s.y-7);shown++}}ctx.restore()}
function drawScene(ts){if(ts-lastFrame<28){requestAnimationFrame(drawScene);return}lastFrame=ts;tNow=ts;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawBackground();for(const r of world.roots)rootHalo(r);ctx.save();ctx.translate(W/2,H/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);drawMemoryField();let p=1,animated=[];if(anim){p=clamp((ts-anim.start)/anim.dur,0,1);p=1-Math.pow(1-p,3);animated=anim.edges;if(p>=.999)anim=null}for(const e of world.edges)drawEdge(e,animated.includes(e)?p:1);for(const n of world.nodes)drawNode(n);ctx.restore();drawLabels();drawInspector();drawMini();requestAnimationFrame(drawScene)}
function drawInspector(){const c=$('#nodeCard'),n=world.selected;if(!n){c.classList.remove('show');return}const s=camera.worldToScreen(n.x,n.y);if(s.x<-40||s.x>W+40||s.y<-40||s.y>H+40){c.classList.remove('show');return}c.style.left=clamp(s.x+22,10,W-230)+'px';c.style.top=clamp(s.y-20,78,H-180)+'px';c.classList.add('show');$('#nodeTitle').textContent=n.rootNode?n.root.label:`Node ${n.id}`;const st=stateOf(n);$('#nodeMeta').innerHTML=`<span>Created</span><b>${ageLabel(world.clock-n.created)}</b><span>Generation</span><b>${n.generation}</b><span>Lineage</span><b>${n.root.label} → g${n.generation}</b><span>State</span><b class="${st}">${st[0].toUpperCase()+st.slice(1)}</b><span>Root</span><b>${n.root.label}</b><span>Children</span><b>${n.children?.length||0}</b>`}
function worldBounds(){let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;for(const n of world.nodes){minx=Math.min(minx,n.x);maxx=Math.max(maxx,n.x);miny=Math.min(miny,n.y);maxy=Math.max(maxy,n.y)}return{minx,maxx,miny,maxy}}
function drawMini(){const rw=mini.clientWidth||220,rh=mini.clientHeight||116;mctx.setTransform(DPR,0,0,DPR,0,0);mctx.clearRect(0,0,rw,rh);const b=worldBounds(),pad=100,s=Math.min(rw/(b.maxx-b.minx+pad*2),rh/(b.maxy-b.miny+pad*2));for(const n of world.nodes){if(n.generation%2&&!n.mine)continue;const x=(n.x-b.minx+pad)*s,y=(n.y-b.miny+pad)*s;mctx.fillStyle=n.mine?'#fff0c8':`hsla(${n.root.hue},95%,75%,${stateOf(n)==='alive'?.65:.16})`;mctx.fillRect(x,y,n.mine?2.6:1.2,n.mine?2.6:1.2)}const left=(camera.x-W/2/camera.zoom-b.minx+pad)*s,top=(camera.y-H/2/camera.zoom-b.miny+pad)*s,vw=W/camera.zoom*s,vh=H/camera.zoom*s;mctx.strokeStyle='rgba(196,245,255,.88)';mctx.lineWidth=1;mctx.strokeRect(left,top,vw,vh)}

let pointers=new Map(),drag=null,lastDist=null,moved=false,press=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){drag={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y};press={x:e.clientX,y:e.clientY,t:performance.now()};moved=false;canvas.classList.add('dragging')}else{const a=[...pointers.values()];lastDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;camera.x=drag.cx-dx/camera.zoom;camera.y=drag.cy-dy/camera.zoom}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;if(lastDist)camera.zoomAt(d/lastDist,mx,my);lastDist=d}});function done(e){pointers.delete(e.pointerId);if(press&&!moved&&performance.now()-press.t<280){const n=nearestNode(e.clientX,e.clientY);if(n){world.selected=n;setStatus(`Inspecting <strong>${n.rootNode?n.root.label:n.id}</strong> · generation ${n.generation}`)}}press=null;lastDist=null;if(!pointers.size){drag=null;canvas.classList.remove('dragging')}else{const p=[...pointers.values()][0];drag={x:p.x,y:p.y,cx:camera.x,cy:camera.y}}}canvas.addEventListener('pointerup',done);canvas.addEventListener('pointercancel',done);canvas.addEventListener('wheel',e=>{e.preventDefault();camera.zoomAt(Math.exp(-e.deltaY*.00135),e.clientX,e.clientY)},{passive:false});
mini.addEventListener('pointerdown',e=>{const r=mini.getBoundingClientRect(),b=worldBounds(),pad=100,s=Math.min(r.width/(b.maxx-b.minx+pad*2),r.height/(b.maxy-b.miny+pad*2));camera.x=(e.clientX-r.left)/s+b.minx-pad;camera.y=(e.clientY-r.top)/s+b.miny-pad;updateStats()});
