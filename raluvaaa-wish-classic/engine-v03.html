*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020610;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}.app{position:fixed;inset:0;overflow:hidden;background:#020610}#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}#world.dragging{cursor:grabbing}.glass{border:1px solid var(--line);background:linear-gradient(180deg,rgba(7,16,29,.78),rgba(3,9,18,.64));backdrop-filter:blur(16px) saturate(130%);box-shadow:0 14px 45px rgba(0,0,0,.28);border-radius:16px}.top-left{position:absolute;z-index:12;top:max(14px,env(safe-area-inset-top));left:16px;width:208px;padding:14px 14px 13px}.title{font-size:17px;letter-spacing:.27em;font-weight:560;margin:0 0 4px}.version{font-size:9px;letter-spacing:.20em;color:rgba(210,225,246,.58);margin-bottom:12px}.stats{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:10px;color:var(--muted)}.stats b{color:#eaf7ff;font-weight:620}.motto{margin-top:13px;font-size:10px;line-height:1.55;color:rgba(230,240,253,.62);letter-spacing:.04em}.top-center{position:absolute;z-index:12;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:999px;font-size:10px;color:rgba(235,243,255,.75);white-space:nowrap}.top-center strong{color:#fff}.minimap{position:absolute;z-index:12;right:16px;top:max(14px,env(safe-area-inset-top));width:235px;height:132px;padding:8px}.minimap canvas{width:100%;height:100%;display:block;border-radius:11px;background:rgba(255,255,255,.016);cursor:crosshair}.side{position:absolute;z-index:12;right:16px;top:170px;display:grid;gap:7px}.iconbtn{width:43px;height:43px;border:1px solid var(--line);border-radius:12px;background:rgba(3,10,20,.75);backdrop-filter:blur(12px);display:grid;place-items:center;cursor:pointer}.iconbtn:hover{border-color:rgba(119,230,255,.32);background:rgba(12,31,50,.75)}.iconbtn:active,.sim:active,.mutation:active,.smallbtn:active{transform:scale(.97)}.iconbtn svg{width:19px;height:19px;stroke:#eaf5ff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.node-card{position:absolute;z-index:11;display:none;width:214px;padding:12px}.node-card.show{display:block}.node-card .node-title{font-size:12px;font-weight:650;letter-spacing:.04em;margin-bottom:8px}.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 11px;font-size:10px;color:var(--muted)}.meta b{font-weight:570;color:#eaf5ff}.meta .alive{color:#68ffe0}.meta .dormant{color:#b4c3d8}.meta .fossil{color:#778397}.bottom-left{position:absolute;z-index:12;left:16px;bottom:max(16px,env(safe-area-inset-bottom));width:500px;padding:11px}.lab-title{display:flex;align-items:center;gap:8px;color:#74ffd8;font-size:11px;letter-spacing:.12em;margin:0 0 9px}.led{width:10px;height:10px;border-radius:50%;background:#71ffd4;box-shadow:0 0 16px rgba(113,255,212,.95)}.simrow{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.sim{min-height:66px;border:1px solid rgba(181,215,255,.12);border-radius:12px;background:rgba(255,255,255,.025);cursor:pointer;display:grid;place-items:center;gap:3px;padding:7px 4px}.sim:hover{background:rgba(89,206,255,.05);border-color:rgba(116,226,255,.28)}.sim b{font-size:15px;line-height:1;color:#eef9ff}.sim span{font-size:9px;color:var(--muted);text-align:center}.bottom-right{position:absolute;z-index:12;right:16px;bottom:max(16px,env(safe-area-inset-bottom));width:330px;padding:11px}.mut-head{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:rgba(229,238,250,.68);letter-spacing:.06em}.mut-head strong{color:#edf7ff;font-weight:600}.mutations{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.mutation{min-height:76px;border:1px solid rgba(181,215,255,.12);border-radius:12px;background:rgba(255,255,255,.025);cursor:pointer;display:grid;place-items:center;gap:4px}.mutation:hover{border-color:rgba(119,230,255,.34);background:rgba(109,227,255,.06)}.mutation svg{width:30px;height:30px;stroke:#d9efff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(127,222,255,.25))}.mutation span{font-size:9px;letter-spacing:.14em;color:rgba(229,239,252,.72)}.after{display:none;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.after.show{display:grid}.smallbtn{height:40px;border-radius:11px;border:1px solid rgba(181,215,255,.12);background:rgba(255,255,255,.03);cursor:pointer;font-size:9px;letter-spacing:.08em}.smallbtn.primary{grid-column:1/-1;border:0;background:#edf4f7;color:#08111c;font-weight:750}.scale{position:absolute;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);font-size:9px;color:rgba(218,231,250,.42);text-align:center;pointer-events:none}.scale-bar{width:125px;height:1px;background:rgba(218,231,250,.26);position:relative;margin:0 auto 6px}.scale-bar:before,.scale-bar:after{content:"";position:absolute;top:-4px;height:9px;width:1px;background:rgba(218,231,250,.32)}.scale-bar:before{left:0}.scale-bar:after{right:0}.lod{position:absolute;z-index:10;left:50%;top:58px;transform:translateX(-50%);font-size:9px;letter-spacing:.12em;color:rgba(205,220,240,.45);pointer-events:none}

<script>
const $=s=>document.querySelector(s), TAU=Math.PI*2;
const canvas=$('#world'),ctx=canvas.getContext('2d'),mini=$('#mini'),mctx=mini.getContext('2d');
let W=0,H=0,DPR=1,tNow=0,anim=null,statusTimer=null;
const hues=[207,267,313,40,181,286,221,12,160];
const rootNames=['Root A','Root B','Root C','Root D','Root E','Root F','Root G','Root H'];
const TEST_MODE=new URLSearchParams(location.search).get('test')==='1';
$('#app').classList.add(TEST_MODE?'testmode':'publicmode');
let shareState={startId:null,mutations:[],p:0,t:Date.now()};
function encState(o){const raw=unescape(encodeURIComponent(JSON.stringify(o)));return btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decState(v){try{v=v.replace(/-/g,'+').replace(/_/g,'/');while(v.length%4)v+='=';return JSON.parse(decodeURIComponent(escape(atob(v))))}catch{return null}}
function readSharedState(){const m=location.hash.match(/^#b=([A-Za-z0-9_-]+)$/);if(!m)return null;const p=decState(m[1]);return p&&p.v===1&&typeof p.s==='string'&&Array.isArray(p.m)?p:null}
function cleanShareUrl(nextPass=(shareState.p||0)+1){const u=new URL('https://confluenceofminds.com/raluvaaa/');u.hash='#b='+encState({v:1,s:shareState.startId,m:shareState.mutations,p:nextPass,t:shareState.t||Date.now()});return u.toString()}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function lerp(a,b,t){return a+(b-a)*t}
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{let t=seed+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function qpt(e,t){const u=1-t;return{x:u*u*e.x0+2*u*t*e.cx+t*t*e.x1,y:u*u*e.y0+2*u*t*e.cy+t*t*e.y1}}
function setStatus(html){$('#status').innerHTML=html;clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('#status').innerHTML='Explore · grow · <strong>pass it on</strong>',3500)}
function ageLabel(h){if(h<1)return Math.max(1,Math.round(h*60))+'m ago';if(h<24)return (Math.round(h*10)/10)+'h ago';return (Math.round(h/2.4)/10)+'d ago'}
function edgeGeom(x,y,a,len,curve){const x1=x+Math.cos(a)*len,y1=y+Math.sin(a)*len,mx=(x+x1)/2,my=(y+y1)/2;return{x0:x,y0:y,cx:mx-Math.sin(a)*len*curve,cy:my+Math.cos(a)*len*curve,x1,y1}}
const world={roots:[],nodes:[],edges:[],tips:[],clock:0,next:1,humans:0,myTip:null,selected:null,history:[]};
function addNode(n){world.nodes.push(n);return n}function addEdge(e){world.edges.push(e);return e}
function rootNode(root){return world.nodes.find(n=>n.id===root.nodeId)}
function addRoot(x,y,label){const idx=world.roots.length,hue=hues[idx%hues.length],id='r'+world.next++;const root={id,index:idx,label:label||rootNames[idx]||('Root '+(idx+1)),x,y,hue,nodeId:id};world.roots.push(root);const n=addNode({id,root,parentId:null,x,y,angle:0,generation:0,created:world.clock,lastActive:world.clock,children:[],mutation:'root',rootNode:true});const R=rng(hash(id));for(let k=0;k<6;k++){const stub={...n,id:id+'s'+k,angle:k*TAU/6+(R()-.5)*.55,generation:0};grow(stub,R()<.55?'bend':'split',R,false)}return root}
function grow(parent,type,R=rng(hash(parent.id+world.next)),mine=false){const root=parent.root;let radial=Math.atan2(parent.y-root.y,parent.x-root.x);if(parent.generation<2)radial=parent.angle;let dev=(R()-.5)*(type==='split'?1.35:type==='bloom'?.9:.72);if(type==='bend')dev+=(R()<.5?-1:1)*(.10+R()*.24);let a=parent.angle*.38+radial*.38+(radial+dev)*.24;let len=(78+R()*62)*Math.pow(.965,Math.max(0,parent.generation-4));if(type==='bloom')len*=.72;const e=edgeGeom(parent.x,parent.y,a,len,(R()-.5)*.34);e.id='e'+world.next++;e.root=root;e.parentId=parent.id;e.hue=(root.hue+parent.generation*1.2)%360;e.generation=parent.generation+1;e.created=world.clock;e.lastActive=world.clock;e.mine=mine;e.type=type;e.seed=hash(e.id);e.micro=[];const microN=type==='bloom'?7:type==='split'?4:2;for(let i=0;i<microN;i++){const tt=.55+R()*.4,p=qpt(e,tt),aa=a+(R()-.5)*(type==='bloom'?2.2:1.2),ll=(type==='bloom'?14:9)+R()*(type==='bloom'?28:18);e.micro.push(edgeGeom(p.x,p.y,aa,ll,(R()-.5)*.55))}addEdge(e);const n=addNode({id:'n'+world.next++,root,parentId:parent.id,edgeId:e.id,x:e.x1,y:e.y1,angle:a,generation:parent.generation+1,created:world.clock,lastActive:world.clock,children:[],mutation:type,mine});const pn=world.nodes.find(v=>v.id===parent.id);if(pn)pn.children.push(n.id);world.tips=world.tips.filter(v=>v.id!==parent.id);world.tips.push(n);if(R()<.24)world.tips.push({...parent});world.humans++;return{node:n,edge:e}}
function pickTip(R){if(!world.tips.length)return null;let best=null,sum=0,arr=[];for(const n of world.tips){const w=(1.15+Math.max(0,13-n.generation)*.06)*(n.children?.length?0.65:1.35);sum+=w;arr.push([n,w])}let v=R()*sum;for(const [n,w] of arr){v-=w;if(v<=0){best=n;break}}return best||arr[arr.length-1][0]}
function stateOf(n){if(n.rootNode)return'alive';const age=world.clock-n.lastActive;return age<28||n.mine?'alive':age<86?'dormant':'fossil'}
function buildCluster(root,count,seed){const R=rng(seed);for(let i=0;i<count;i++){world.clock+=.05+R()*.04;const p=pickTipForRoot(root,R);if(!p)continue;const r=R(),type=r<.44?'bend':r<.78?'split':'bloom';const out=grow(p,type,R,false);if(type==='split'&&R()<.33){const ghost={...out.node,id:out.node.id+'x',angle:out.node.angle+(R()<.5?-1:1)*(.7+R()*.55),generation:out.node.generation-1};grow(ghost,R()<.7?'bend':'bloom',R,false)}if(R()<.02&&i>40){world.clock+=2}}
}
function pickTipForRoot(root,R){const a=world.tips.filter(t=>t.root===root);if(!a.length)return rootNode(root);return a[Math.floor(R()*a.length)]}
function simulate(n,animate=true){const R=rng(hash('sim'+world.clock+n+world.edges.length)),before=world.edges.length;for(let i=0;i<n;i++){world.clock+=.08+R()*.08;const p=pickTip(R);if(!p)break;const r=R(),type=r<.45?'bend':r<.79?'split':'bloom';grow(p,type,R,false)}if(animate)anim={edges:world.edges.slice(before,Math.min(world.edges.length,before+30)),start:performance.now(),dur:1450};updateStats()}
function seedBaseWorld(){world.roots=[];world.nodes=[];world.edges=[];world.tips=[];world.clock=0;world.next=1;world.humans=0;world.history=[];world.selected=null;anim=null;const positions=[[-420,-20],[-900,420],[80,-540],[800,-220],[640,520],[-120,650]];for(let i=0;i<positions.length;i++){const r=addRoot(positions[i][0],positions[i][1],rootNames[i]);buildCluster(r,120+i*8,9137+i*111)}const R=rng(711);const initial=pickTipForRoot(world.roots[0],R);const naturalClock=world.clock;world.clock=naturalClock;for(const e of world.edges){const h=hash('memory-'+e.id)%100;if(h<18)e.lastActive=world.clock-(34+(h%14));else if(h<25)e.lastActive=world.clock-(92+(h%23))}for(const n of world.nodes){if(n.rootNode||n.mine)continue;const h=hash('memory-'+n.id)%100;if(h<18)n.lastActive=world.clock-(34+(h%14));else if(h<25)n.lastActive=world.clock-(92+(h%23))}return initial}
function replayShared(start,mutations){let parent=start;for(let i=0;i<mutations.length;i++){const type=mutations[i];if(!['bend','split','bloom'].includes(type))continue;world.clock+=.1;const out=grow(parent,type,rng(hash(`share:${shareState.startId}:${i}:${type}`)),false);parent=out.node}return parent}
function reset(){const initial=seedBaseWorld();const incoming=readSharedState();if(incoming){shareState={startId:incoming.s,mutations:incoming.m.slice(0,64),p:Number(incoming.p)||0,t:Number(incoming.t)||Date.now()};const start=world.nodes.find(n=>n.id===shareState.startId)||initial;world.myTip=replayShared(start,shareState.mutations);setStatus('Someone continued this lineage. <strong>Choose what grows next.</strong>')}else{shareState={startId:initial.id,mutations:[],p:0,t:Date.now()};world.myTip=initial;setStatus('You found a living branch. <strong>Choose what grows next.</strong>')}if(world.myTip){world.myTip.received=true;world.myTip.lastActive=world.clock}world.selected=null;camera.focus(world.myTip,false);camera.zoom=Math.max(camera.zoom,.82);updateStats();showMutations()}
function testReset(){history.replaceState(null,'',location.pathname+'?test=1');shareState={startId:null,mutations:[],p:0,t:Date.now()};reset();setStatus('Fresh private test. <strong>Start again from the received branch.</strong>')}
function addNewRoot(){const R=rng(hash('newroot'+world.roots.length+world.clock)),a=R()*TAU,rad=1050+R()*500,r=addRoot(Math.cos(a)*rad,Math.sin(a)*rad,rootNames[world.roots.length]||('Root '+(world.roots.length+1)));buildCluster(r,95,hash(r.id));camera.fit();updateStats();setStatus('A new independent root entered the world.')}
function ageWorld(){world.clock+=38;updateStats();setStatus('Time advanced. <strong>Recent branches dim into fossils.</strong>')}
function myMutate(type){if(anim)return;if(!world.myTip)return;const p={...world.myTip};p.received=false;const liveParent=world.nodes.find(n=>n.id===world.myTip.id);if(liveParent){liveParent.received=false;liveParent.mine=false}const beforeE=world.edges.length,beforeN=world.nodes.length;world.clock+=.1;const step=shareState.mutations.length;const out=grow(p,type,rng(hash(`share:${shareState.startId}:${step}:${type}`)),true);world.myTip=out.node;world.myTip.received=false;world.history.push({prev:p,edgeIds:world.edges.slice(beforeE).map(e=>e.id),nodeIds:world.nodes.slice(beforeN).map(n=>n.id),type});shareState.mutations.push(type);world.selected=null;anim={edges:world.edges.slice(beforeE),start:performance.now(),dur:1250};$('#mutations').style.display='none';$('#after').classList.add('show');$('#mutTitle').textContent='KEEP IT ALIVE';$('#mutHint').textContent='one more human continues it';camera.focus(out.node,false);updateStats();setStatus('You changed it. <strong>Now pass the branch to one more human.</strong>')}
function undo(){const h=world.history.pop();if(!h)return;world.edges=world.edges.filter(e=>!h.edgeIds.includes(e.id));world.nodes=world.nodes.filter(n=>!h.nodeIds.includes(n.id));world.tips=world.tips.filter(n=>!h.nodeIds.includes(n.id));world.myTip=h.prev;const restored=world.nodes.find(n=>n.id===h.prev.id);if(restored){restored.received=true;restored.mine=false;world.myTip=restored}else{world.myTip.received=true}world.selected=null;world.tips.push(world.myTip);world.humans=Math.max(0,world.humans-h.nodeIds.length);shareState.mutations.pop();anim=null;showMutations();camera.focus(world.myTip,false);updateStats();setStatus('Back to the received point. Choose again.')}
function showMutations(){$('#mutations').style.display='grid';$('#after').classList.remove('show');$('#mutTitle').textContent='CHOOSE WHAT GROWS NEXT';$('#mutHint').textContent='one human · one gesture'}
const camera={x:0,y:0,zoom:.5,min:.025,max:18,worldToScreen(x,y){return{x:(x-this.x)*this.zoom+W/2,y:(y-this.y)*this.zoom+H/2}},screenToWorld(x,y){return{x:(x-W/2)/this.zoom+this.x,y:(y-H/2)/this.zoom+this.y}},zoomAt(f,sx=W/2,sy=H/2){const a=this.screenToWorld(sx,sy);this.zoom=clamp(this.zoom*f,this.min,this.max);const b=this.screenToWorld(sx,sy);this.x+=a.x-b.x;this.y+=a.y-b.y;updateStats()},focus(n,deep=false){this.x=n.x;this.y=n.y;if(deep)this.zoom=Math.max(this.zoom,2.4);else this.zoom=Math.max(this.zoom,.72);updateStats()},fit(){if(!world.nodes.length)return;let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;for(const n of world.nodes){minx=Math.min(minx,n.x);maxx=Math.max(maxx,n.x);miny=Math.min(miny,n.y);maxy=Math.max(maxy,n.y)}const px=220,py=180;this.x=(minx+maxx)/2;this.y=(miny+maxy)/2;this.zoom=clamp(Math.min(W/(maxx-minx+px*2),H/(maxy-miny+py*2)),this.min,.85);updateStats()}}
function resize(){const r=canvas.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.6);W=r.width;H=r.height;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);mini.width=Math.max(1,Math.round((mini.clientWidth||200)*DPR));mini.height=Math.max(1,Math.round((mini.clientHeight||110)*DPR));updateStats()}
function updateStats(){const gen=Math.max(0,...world.nodes.map(n=>n.generation||0));if(TEST_MODE){$('#lHumans').textContent='Humans';$('#lNodes').textContent='Nodes';$('#lRoots').textContent='Roots';$('#sHumans').textContent=world.humans.toLocaleString();$('#sNodes').textContent=world.nodes.length.toLocaleString();$('#sRoots').textContent=world.roots.length;$('#sGen').textContent=gen;$('#sAge').textContent=(Math.round(world.clock*10)/10)+'h'}else{$('#lHumans').textContent='Humans';$('#lNodes').textContent='Shares';$('#lRoots').textContent='Roots';$('#sHumans').textContent=(shareState.mutations.length+1).toLocaleString();$('#sNodes').textContent=(shareState.p||0).toLocaleString();$('#sRoots').textContent=world.roots.length;$('#sGen').textContent=shareState.mutations.length;const mins=Math.max(0,Math.floor((Date.now()-(shareState.t||Date.now()))/60000));$('#sAge').textContent=mins<60?mins+'m':(Math.round(mins/6)/10)+'h'}$('#sZoom').textContent=camera.zoom<1?camera.zoom.toFixed(2)+'x':camera.zoom.toFixed(1)+'x';$('#scaleLabel').textContent=Math.round(160/camera.zoom).toLocaleString()+' world units';const z=camera.zoom;$('#lod').textContent=z<.11?'CONSTELLATION':z<.32?'ROOTS':z<1.2?'LINEAGES':z<3?'NODES':'MICROFILAMENTS'}
function inView(x,y,pad=120){const s=camera.worldToScreen(x,y);return s.x>-pad&&s.x<W+pad&&s.y>-pad&&s.y<H+pad}
function drawBackground(){const g=ctx.createRadialGradient(W*.52,H*.44,0,W*.52,H*.44,Math.max(W,H)*.78);g.addColorStop(0,'#071728');g.addColorStop(.42,'#04101d');g.addColorStop(.72,'#020b15');g.addColorStop(1,'#01050d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<230;i++){const x=(hash('sx'+i)%10000)/10000*W,y=(hash('sy'+i*11)%10000)/10000*H,a=.018+((hash('sa'+i)%100)/100)*.055;ctx.fillStyle=`rgba(196,222,255,${a})`;ctx.fillRect(x,y,i%29===0?1.5:.7,i%29===0?1.5:.7)}}
function rootHalo(r){const s=camera.worldToScreen(r.x,r.y);if(s.x<-300||s.x>W+300||s.y<-300||s.y>H+300)return;const count=world.nodes.filter(n=>n.root===r).length,z=camera.zoom,breath=1+Math.sin(tNow*.0011+r.index*1.7)*.08;let rad=(80+Math.sqrt(count)*12)*z*breath;rad=clamp(rad,18,260);const gr=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,rad);gr.addColorStop(0,`hsla(${r.hue},98%,77%,.19)`);gr.addColorStop(.2,`hsla(${r.hue},95%,65%,.10)`);gr.addColorStop(.55,`hsla(${r.hue},92%,55%,.032)`);gr.addColorStop(1,`hsla(${r.hue},80%,45%,0)`);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(s.x,s.y,rad,0,TAU);ctx.fill();if(z<.27){const R=rng(hash('dust'+r.id));for(let i=0;i<Math.min(70,Math.floor(count/2));i++){const aa=R()*TAU,rr=R()*rad*.85,px=s.x+Math.cos(aa)*rr,py=s.y+Math.sin(aa)*rr,sz=.6+R()*1.8;ctx.fillStyle=`hsla(${r.hue+R()*35-18},95%,78%,${.12+R()*.28})`;ctx.shadowColor=`hsla(${r.hue},95%,70%,.7)`;ctx.shadowBlur=5;ctx.beginPath();ctx.arc(px,py,sz,0,TAU);ctx.fill();ctx.shadowBlur=0}}}
function pathEdge(e,progress=1,offset=0,wobble=0){const ph=hash(e.id)%628/100,tt=tNow*.0012+ph;const nx=-(e.y1-e.y0),ny=(e.x1-e.x0),len=Math.hypot(nx,ny)||1,ox=nx/len*offset,oy=ny/len*offset;const wc=Math.sin(tt)*wobble;ctx.beginPath();ctx.moveTo(e.x0+ox,e.y0+oy);if(progress>=.999)ctx.quadraticCurveTo(e.cx+ox+wc,e.cy+oy+wc*.3,e.x1+ox,e.y1+oy);else{const p=qpt(e,progress),c={x:lerp(e.x0,e.cx,progress),y:lerp(e.y0,e.cy,progress)};ctx.quadraticCurveTo(c.x+ox+wc,c.y+oy+wc*.3,p.x+ox,p.y+oy)}}
function drawEdge(e,progress=1){if(!inView((e.x0+e.x1)/2,(e.y0+e.y1)/2,180/camera.zoom))return;const z=camera.zoom,state=stateOfEdge(e),alive=state==='alive',fossil=state==='fossil',age=world.clock-e.lastActive;const breath=alive?(1+Math.sin(tNow*.002+e.seed*.00001)*.15):1;const macro=z<.11,mid=z<.38;if(macro&&e.generation>6)return;if(mid&&e.generation>12&&e.type==='bloom')return;ctx.lineCap='round';if(alive){const alpha=e.mine?.95:clamp(.28+.36*Math.min(1,z*.9),.28,.64);ctx.shadowColor=e.mine?'rgba(255,226,175,.95)':`hsla(${e.hue},96%,72%,.85)`;ctx.shadowBlur=(e.mine?20:12)*breath/Math.max(.35,z);ctx.strokeStyle=e.mine?'rgba(255,240,208,.94)':`hsla(${e.hue},94%,76%,${alpha*breath})`;ctx.lineWidth=(e.mine?2.2:1.45)/Math.max(.42,z);pathEdge(e,progress,0,.75/Math.max(.5,z));ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle=`rgba(230,244,255,${alpha*.48})`;ctx.lineWidth=.52/Math.max(.5,z);pathEdge(e,progress);ctx.stroke();if(z>.55){for(let f=0;f<2;f++){ctx.strokeStyle=`hsla(${e.hue+(f?16:-14)},90%,72%,${alpha*.10})`;ctx.lineWidth=.38/Math.max(.55,z);pathEdge(e,progress,(f?1:-1)*(1.3+f*.6)/Math.max(.65,z),.4/Math.max(.7,z));ctx.stroke()}}}else{ctx.shadowBlur=0;const memoryAlpha=fossil?.075:.145;ctx.strokeStyle=fossil?'rgba(119,137,161,.075)':'rgba(156,177,204,.145)';ctx.lineWidth=.72/Math.max(.45,z);pathEdge(e,1);ctx.stroke();if(z>.24){for(let f=0;f<2;f++){ctx.strokeStyle=fossil?'rgba(112,130,156,.026)':'rgba(159,181,211,.052)';ctx.lineWidth=.34/Math.max(.52,z);pathEdge(e,1,(f?1:-1)*(1.15+f*.55)/Math.max(.62,z),.22/Math.max(.7,z));ctx.stroke()}}}if(z>.85&&progress>.98){const microMax=z>3?e.micro.length:Math.min(e.micro.length,2);for(let i=0;i<microMax;i++){const m=e.micro[i];ctx.beginPath();ctx.moveTo(m.x0,m.y0);ctx.quadraticCurveTo(m.cx,m.cy,m.x1,m.y1);ctx.strokeStyle=alive?`hsla(${e.hue+(i*9)},90%,78%,${z>3?.34:.16})`:'rgba(130,150,176,.05)';ctx.lineWidth=.58/Math.max(.7,z);ctx.stroke();if(z>2&&alive){ctx.fillStyle=`hsla(${e.hue},96%,84%,.72)`;ctx.beginPath();ctx.arc(m.x1,m.y1,1.05/Math.max(.9,z),0,TAU);ctx.fill()}}}if(alive&&z>.22&&progress>.98){const phase=(tNow*.00022+e.seed*.0000007)%1,pp=qpt(e,phase);ctx.fillStyle=`hsla(${e.hue},98%,88%,.72)`;ctx.shadowColor=`hsla(${e.hue},100%,75%,.95)`;ctx.shadowBlur=10/Math.max(.55,z);ctx.beginPath();ctx.arc(pp.x,pp.y,1.2/Math.max(.62,z),0,TAU);ctx.fill();ctx.shadowBlur=0}}
function stateOfEdge(e){const a=world.clock-e.lastActive;return a<28||e.mine?'alive':a<86?'dormant':'fossil'}
function drawNode(n){const z=camera.zoom;if(z<.15&&!n.rootNode&&!n.mine)return;if(!inView(n.x,n.y,60))return;const st=stateOf(n),alive=st==='alive',pulse=1+(alive?Math.sin(tNow*.0024+hash(n.id)*.00001)*.18:0);let r=(n.rootNode?4.2:(n.mine||n.received)?4.7:alive?1.8:1.05)*pulse/Math.max(.5,z);if(z>1.1)r*=1.15;ctx.fillStyle=(n.mine||n.received)?'#fff0c9':n.rootNode?`hsla(${n.root.hue},100%,87%,.95)`:alive?`hsla(${n.root.hue},95%,82%,.72)`:st==='dormant'?'rgba(171,188,214,.30)':'rgba(120,137,163,.16)';if(alive){ctx.shadowColor=(n.mine||n.received)?'rgba(255,222,156,.98)':`hsla(${n.root.hue},100%,75%,.82)`;ctx.shadowBlur=((n.mine||n.received)?22:9)/Math.max(.55,z)}ctx.beginPath();ctx.arc(n.x,n.y,r,0,TAU);ctx.fill();ctx.shadowBlur=0;if(world.selected?.id===n.id){ctx.strokeStyle='rgba(164,246,255,.92)';ctx.lineWidth=1.1/Math.max(.55,z);ctx.beginPath();ctx.arc(n.x,n.y,r*2.8,0,TAU);ctx.stroke()}}
function drawLabels(){const z=camera.zoom;if(z<.075)return;ctx.save();ctx.textBaseline='middle';for(const r of world.roots){const s=camera.worldToScreen(r.x,r.y);if(s.x<-80||s.x>W+80||s.y<-60||s.y>H+60)continue;const count=world.nodes.filter(n=>n.root===r).length;ctx.fillStyle='rgba(205,221,244,.68)';ctx.font=(z<.2?'10':'11')+'px Inter,system-ui';ctx.fillText(`${r.label} (${count})`,s.x+12,s.y-15)}if(z>2.1){ctx.fillStyle='rgba(220,232,248,.48)';ctx.font='9px Inter,system-ui';let shown=0;for(const n of world.nodes){if(shown>60)break;if(n.rootNode||!inView(n.x,n.y,20))continue;const s=camera.worldToScreen(n.x,n.y);ctx.fillText(`g${n.generation} · ${ageLabel(world.clock-n.created)}`,s.x+7,s.y-7);shown++}}ctx.restore()}
function drawScene(ts){tNow=ts;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawBackground();for(const r of world.roots)rootHalo(r);ctx.save();ctx.translate(W/2,H/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);let p=1,animated=[];if(anim){p=clamp((ts-anim.start)/anim.dur,0,1);p=1-Math.pow(1-p,3);animated=anim.edges;if(p>=.999)anim=null}for(const e of world.edges)drawEdge(e,animated.includes(e)?p:1);for(const n of world.nodes)drawNode(n);ctx.restore();drawLabels();drawInspector();drawMini();requestAnimationFrame(drawScene)}
function drawInspector(){const c=$('#nodeCard'),n=world.selected;if(!n){c.classList.remove('show');return}const s=camera.worldToScreen(n.x,n.y);if(s.x<-40||s.x>W+40||s.y<-40||s.y>H+40){c.classList.remove('show');return}c.style.left=clamp(s.x+22,10,W-230)+'px';c.style.top=clamp(s.y-20,78,H-180)+'px';c.classList.add('show');$('#nodeTitle').textContent=n.rootNode?n.root.label:`Node ${n.id}`;const st=stateOf(n);$('#nodeMeta').innerHTML=`<span>Created</span><b>${ageLabel(world.clock-n.created)}</b><span>Generation</span><b>${n.generation}</b><span>Lineage</span><b>${n.root.label} → g${n.generation}</b><span>State</span><b class="${st}">${st[0].toUpperCase()+st.slice(1)}</b><span>Root</span><b>${n.root.label}</b><span>Children</span><b>${n.children?.length||0}</b>`}
function worldBounds(){let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;for(const n of world.nodes){minx=Math.min(minx,n.x);maxx=Math.max(maxx,n.x);miny=Math.min(miny,n.y);maxy=Math.max(maxy,n.y)}return{minx,maxx,miny,maxy}}
function drawMini(){const rw=mini.clientWidth||220,rh=mini.clientHeight||116;mctx.setTransform(DPR,0,0,DPR,0,0);mctx.clearRect(0,0,rw,rh);const b=worldBounds(),pad=100,s=Math.min(rw/(b.maxx-b.minx+pad*2),rh/(b.maxy-b.miny+pad*2));for(const n of world.nodes){if(n.generation%2&&!n.mine)continue;const x=(n.x-b.minx+pad)*s,y=(n.y-b.miny+pad)*s;mctx.fillStyle=n.mine?'#fff0c8':`hsla(${n.root.hue},95%,75%,${stateOf(n)==='alive'?.65:.16})`;mctx.fillRect(x,y,n.mine?2.6:1.2,n.mine?2.6:1.2)}const left=(camera.x-W/2/camera.zoom-b.minx+pad)*s,top=(camera.y-H/2/camera.zoom-b.miny+pad)*s,vw=W/camera.zoom*s,vh=H/camera.zoom*s;mctx.strokeStyle='rgba(196,245,255,.88)';mctx.lineWidth=1;mctx.strokeRect(left,top,vw,vh)}
function hitNode(sx,sy){let best=null,bd=Infinity;const z=camera.zoom;for(const n of world.nodes){if(z<.15&&!n.rootNode&&!n.mine&&!n.received)continue;if(!inView(n.x,n.y,20))continue;const s=camera.worldToScreen(n.x,n.y),d=Math.hypot(s.x-sx,s.y-sy);const hit=(n.rootNode||n.mine||n.received)?12:8;if(d<=hit&&d<bd){best=n;bd=d}}return best}
let pointers=new Map(),drag=null,lastDist=null,moved=false,press=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){drag={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y};press={x:e.clientX,y:e.clientY,t:performance.now()};moved=false}else{const a=[...pointers.values()];lastDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});

function done(e){pointers.delete(e.pointerId);if(press&&!moved&&performance.now()-press.t<280){const n=hitNode(e.clientX,e.clientY);world.selected=n||null;if(n)setStatus(`Generation <strong>${n.generation}</strong> · ${ageLabel(world.clock-n.created)}`)}press=null;lastDist=null;if(!pointers.size){drag=null;canvas.classList.remove('dragging');canvas.style.cursor=hitNode(e.clientX,e.clientY)?'pointer':'default'}else{const p=[...pointers.values()][0];drag={x:p.x,y:p.y,cx:camera.x,cy:camera.y}}}

mini.addEventListener('pointerdown',e=>{const r=mini.getBoundingClientRect(),b=worldBounds(),pad=100,s=Math.min(r.width/(b.maxx-b.minx+pad*2),r.height/(b.maxy-b.miny+pad*2));camera.x=(e.clientX-r.left)/s+b.minx-pad;camera.y=(e.clientY-r.top)/s+b.miny-pad;updateStats()});
