  <g text-anchor="middle">
    <text x="600" y="322" fill="#17201f" font-family="Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="6">CONFLUENCE</text>
    <line x1="372" y1="366" x2="504" y2="366" stroke="#17201f" stroke-opacity="0.52" stroke-width="1"/>
    <circle cx="536" cy="366" r="4" fill="#b66b49"/>
