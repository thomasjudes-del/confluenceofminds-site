<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5efe5"/>
      <stop offset="0.52" stop-color="#eee4d5"/>
      <stop offset="1" stop-color="#ded0bb"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="43%" r="52%">
      <stop offset="0" stop-color="#fffaf2" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#f1e8da" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#d6c6af" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="36%" cy="32%" r="70%">
      <stop offset="0" stop-color="#f4eadb"/>
      <stop offset="0.72" stop-color="#d9c8b2"/>
      <stop offset="1" stop-color="#b7a58f"/>
    </radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b56b45"/>
      <stop offset="1" stop-color="#8e4f34"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft">
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d2726" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

