    <circle cx="271" cy="249" r="4" fill="#b66b49"/>

    <text x="0" y="310" fill="#f8f3ea" font-family="Georgia, 'Times New Roman', serif" font-size="29">Too many ideas for one world.</text>
    <text x="0" y="355" fill="#cf8a65" font-family="Georgia, 'Times New Roman', serif" font-size="25">Come for one world. Get lost in a universe.</text>

    <g transform="translate(0 425)" fill="#f8f3ea" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">
