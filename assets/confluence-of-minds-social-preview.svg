<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Confluence of Minds</title>
  <desc id="desc">Stories, games, sound worlds and impossible worlds.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111817"/>
      <stop offset="0.44" stop-color="#1a211f"/>
      <stop offset="0.68" stop-color="#d4c4ad"/>
      <stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <radialGradient id="planet" cx="65%" cy="35%" r="68%">
      <stop offset="0" stop-color="#323835"/>
      <stop offset="0.55" stop-color="#131918"/>
      <stop offset="1" stop-color="#080c0b"/>
    </radialGradient>
    <linearGradient id="creamFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="0.6" stop-color="#d9ccba"/>
      <stop offset="1" stop-color="#938776"/>
    </linearGradient>
    <linearGradient id="darkFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1413"/>
      <stop offset="1" stop-color="#36403c"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#070b0a" flood-opacity="0.35"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <clipPath id="rightClip"><path d="M520 0H1200V630H465c78-114 96-220 74-318C516 208 510 104 520 0Z"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="#eee8dc" opacity="0.1" filter="url(#grain)"/>

  <g clip-path="url(#rightClip)">
